or usury, is compatible with anarchism."}, {"id": "prop11", "axis": "prop", "core": false, "effect": {"prop": 8}, "text": "Even under anarchism, some form of accounting for individual contribution is fair and necessary."}, {"id": "prop12", "axis": "prop", "core": false, "effect": {"prop": 7}, "text": "Occupancy and use, not communal pooling, should determine who controls a given piece of land or tool."}, {"id": "viol01", "axis": "viol", "core": true, "effect": {"viol": 10}, "text": "Violence in self-defence and in overthrowing an oppressive order is legitimate."}, {"id": "viol02", "axis": "viol", "core": true, "effect": {"viol": 9}, "text": "Expropriating capital by force is a justifiable revolutionary act."}, {"id": "viol03", "axis": "viol", "core": true, "effect": {"viol": 8}, "text": "Waiting for a purely peaceful transition means waiting forever, since the state will not surrender its violence voluntarily."}, {"id": "viol04", "axis": "viol", "core": false, "effect": {"viol": 10}, "text": "Armed defence of a popular uprising against counter-revolution is not a betrayal of anarchist principles."}, {"id": "viol05", "axis": "viol", "core": false, "effect": {"viol": 8}, "text": "There is nothing inconsistent about anarchists organising armed resistance when the situation demands it."}, {"id": "viol06", "axis": "viol", "core": false, "effect": {"viol": 7}, "text": "A revolution that refuses all force will be crushed by a state that has none of the same scruples."}, {"id": "viol07", "axis": "viol", "core": true, "effect": {"viol": -10}, "text": "Anarchism should commit to nonviolence as a matter of consistent principle, not just tactics."}, {"id": "viol08", "axis": "viol", "core": true, "effect": {"viol": -9}, "text": "Using violence to achieve a stateless society reproduces the domination it claims to abolish."}, {"id": "viol09", "axis": "viol", "core": true, "effect": {"viol": -8}, "text": "Means and ends can't be separated; a violent revolution will produce a violent aftermath."}, {"id": "viol10", "axis": "viol", "core": false, "effect": {"viol": -10}, "text": "Nonviolent resistance and mutual aid do more to build a free society than armed struggle does."}, {"id": "viol11", "axis": "viol", "core": false, "effect": {"viol": -8}, "text": "Anarchists who take up arms end up organised like the states they oppose."}, {"id": "viol12", "axis": "viol", "core": false, "effect": {"viol": -7}, "text": "Coercion of any kind, even in a revolutionary cause, contradicts anarchism's basic commitments."}, {"id": "tech01", "axis": "tech", "core": true, "effect": {"tech": -10}, "text": "Modern industry and technology can be reorganised for collective benefit rather than rejected outright."}, {"id": "tech02", "axis": "tech", "core": true, "effect": {"tech": -9}, "text": "Large-scale infrastructure and coordination are compatible with a stateless, classless society."}, {"id": "tech03", "axis": "tech", "core": true, "effect": {"tech": -8}, "text": "Rejecting industrial technology altogether would condemn most people to a much harder life than they need to live."}, {"id": "tech04", "axis": "tech", "core": false, "effect": {"tech": -10}, "text": "Technology is a tool whose effects depend on who controls it, not something inherently opposed to freedom."}, {"id": "tech05", "axis": "tech", "core": false, "effect": {"tech": -8}, "text": "A federated, technologically advanced society is a realistic goal, not a contradiction in terms."}, {"id": "tech06", "axis": "tech", "core": false, "effect": {"tech": -7}, "text": "Anarchists should aim to seize and repurpose industrial capacity, not dismantle it."}, {"id": "tech07", "axis": "tech", "core": true, "effect": {"tech": 10}, "text": "Civilisation itself \u2014 mass society, agriculture, division of labour \u2014 is the root of domination, not just its capitalist form."}, {"id": "tech08", "axis": "tech", "core": true, "effect": {"tech": 9}, "text": "A genuinely free life means abandoning industrial technology and its dependencies, not redistributing them."}, {"id": "tech09", "axis": "tech", "core": true, "effect": {"tech": 8}, "text": "Complex technological systems require the very hierarchy and expertise anarchists are trying to abolish."}, {"id": "tech10", "axis": "tech", "core": false, "effect": {"tech": 10}, "text": "Returning to small-scale, low-technology ways of living is the only way to actually end domination."}, {"id": "tech11", "axis": "tech", "core": false, "effect": {"tech": 8}, "text": "Mass society and its infrastructure cannot be organised without reproducing coercive control."}, {"id": "tech12", "axis": "tech", "core": false, "effect": {"tech": 7}, "text": "The domestication of nature that founded civilisation is itself the first act of domination."}, {"id": "pref01", "axis": "pref", "core": true, "effect": {"pref": -10}, "text": "Building cooperatives, communes, and mutual aid networks now is how the new society is actually constructed."}, {"id": "pref02", "axis": "pref", "core": true, "effect": {"pref": -9}, "text": "A revolution has to prefigure the world it wants; the means must already resemble the ends."}, {"id": "pref03", "axis": "pref", "core": true, "effect": {"pref": -8}, "text": "Creating working alternative institutions matters as much as tearing down the existing ones."}, {"id": "pref04", "axis": "pref", "core": false, "effect": {"pref": -10}, "text": "Practising self-management now, on however small a scale, is real revolutionary work."}, {"id": "pref05", "axis": "pref", "core": false, "effect": {"pref": -8}, "text": "Counter-institutions built before the revolution give people something to defend and expand once it comes."}, {"id": "pref06", "axis": "pref", "core": false, "effect": {"pref": -7}, "text": "A movement that never builds anything concrete has nothing to offer once the old order falls."}, {"id": "pref07", "axis": "pref", "core": true, "effect": {"pref": 10}, "text": "The task is disruption and rupture; blueprints for a future society are premature and constraining."}, {"id": "pref08", "axis": "pref", "core": true, "effect": {"pref": 9}, "text": "Building alternative institutions can become an accommodation with the existing order rather than a threat to it."}, {"id": "pref09", "axis": "pref", "core": true, "effect": {"pref": 8}, "text": "No amount of prefigurative organising substitutes for actually destroying the systems of domination."}, {"id": "pref10", "axis": "pref", "core": false, "effect": {"pref": 10}, "text": "Cooperatives and communes that operate within capitalism end up managing themselves under its rules, not escaping them."}, {"id": "pref11", "axis": "pref", "core": false, "effect": {"pref": 8}, "text": "Rupture has to come before construction; you cannot build the new world inside the shell of the old."}, {"id": "pref12", "axis": "pref", "core": false, "effect": {"pref": 7}, "text": "Focusing energy on alternative institutions can dull the urgency of confronting power directly."}, {"id": "muni01", "axis": "muni", "core": true, "effect": {"muni": 10}, "text": "Confederations of directly democratic municipal assemblies are a viable form of anarchist self-government."}, {"id": "muni02", "axis": "muni", "core": true, "effect": {"muni": 9}, "text": "Local assemblies, federated upward, can perform the coordinating functions anarchists need without becoming a state."}, {"id": "muni03", "axis": "muni", "core": true, "effect": {"muni": 8}, "text": "A directly democratic municipality is not a government in the sense anarchists oppose."}, {"id": "muni04", "axis": "muni", "core": false, "effect": {"muni": 10}, "text": "Citizens' assemblies claiming legitimate public power can be a real transitional strategy toward a stateless society."}, {"id": "muni05", "axis": "muni", "core": false, "effect": {"muni": 8}, "text": "Running candidates for local office on a libertarian municipalist platform is a defensible anarchist tactic."}, {"id": "muni06", "axis": "muni", "core": false, "effect": {"muni": 7}, "text": "Dual power built through confederated municipalities is a credible path beyond the nation-state."}, {"id": "muni07", "axis": "muni", "core": true, "effect": {"muni": -10}, "text": "Any structure claiming to exercise public, binding authority \u2014 even a local assembly \u2014 is a government and should be rejected."}, {"id": "muni08", "axis": "muni", "core": true, "effect": {"muni": -9}, "text": "Federating assemblies from the ground up still recreates layers of representation anarchists should refuse."}, {"id": "muni09", "axis": "muni", "core": true, "effect": {"muni": -8}, "text": "There is no such thing as a legitimate government, local or confederal, direct or representative."}, {"id": "muni10", "axis": "muni", "core": false, "effect": {"muni": -10}, "text": "Anarchism means the negation of the state as such, not its replacement with a smaller, friendlier version."}, {"id": "muni11", "axis": "muni", "core": false, "effect": {"muni": -8}, "text": "Running for local office, however framed, concedes the legitimacy of electoral government."}, {"id": "muni12", "axis": "muni", "core": false, "effect": {"muni": -7}, "text": "A confederation with binding votes across municipalities is still a form of rule over the minority."}, {"id": "oppr01", "axis": "oppr", "core": true, "effect": {"oppr": 10}, "text": "Gender, race, and sexuality are independent axes of domination that class struggle alone does not explain or resolve."}, {"id": "oppr02", "axis": "oppr", "core": true, "effect": {"oppr": 9}, "text": "A movement that centres only class will reproduce patriarchal and racial hierarchies within itself."}, {"id": "oppr03", "axis": "oppr", "core": true, "effect": {"oppr": 8}, "text": "Confronting patriarchy and white supremacy is as fundamental to anarchism as confronting capital and the state."}, {"id": "oppr04", "axis": "oppr", "core": false, "effect": {"oppr": 10}, "text": "Domination takes many forms that don't reduce to economic exploitation."}, {"id": "oppr05", "axis": "oppr", "core": false, "effect": {"oppr": 8}, "text": "Anarchist organising has to actively centre those most marginalised, not treat their oppression as secondary."}, {"id": "oppr06", "axis": "oppr", "core": false, "effect": {"oppr": 7}, "text": "The abolition of the state and capital does not automatically abolish patriarchy or racial hierarchy."}, {"id": "oppr07", "axis": "oppr", "core": true, "effect": {"oppr": -10}, "text": "Class exploitation is the foundation that other forms of domination ultimately rest on."}, {"id": "oppr08", "axis": "oppr", "core": true, "effect": {"oppr": -9}, "text": "Once capitalism and the state are abolished, the material basis for other hierarchies falls away with them."}, {"id": "oppr09", "axis": "oppr", "core": true, "effect": {"oppr": -8}, "text": "Organising around identity fragments the working class instead of uniting it against its common enemy."}, {"id": "oppr10", "axis": "oppr", "core": false, "effect": {"oppr": -10}, "text": "Class struggle is what actually unites people across the divisions capital uses to keep them apart."}, {"id": "oppr11", "axis": "oppr", "core": false, "effect": {"oppr": -8}, "text": "Prioritising any single axis of oppression other than class ends up serving capital by dividing its opponents."}, {"id": "oppr12", "axis": "oppr", "core": false, "effect": {"oppr": -7}, "text": "The point of production remains the central site of struggle, whatever other hierarchies also exist."}]}, "4": {"meta": {"module": 2, "bucketId": 4, "bucket": "Social Democracy / Democratic Socialism", "version": "0.1-draft", "questionCount": 96, "shortFormCount": 48, "scoring": {"answerScale": [{"label": "Strongly Agree", "mult": 1.0}, {"label": "Agree", "mult": 0.5}, {"label": "Neutral / Unsure", "mult": 0.0}, {"label": "Disagree", "mult": -0.5}, {"label": "Strongly Disagree", "mult": -1.0}], "formula": "raw[axis] = sum(mult * effect[axis]); max[axis] = sum(abs(effect[axis])); score[axis] = 100 * (max + raw) / (2 * max)"}, "presentation": "Stored grouped by axis for maintainability. The app must SHUFFLE at runtime with a fixed seed so consecutive items do not come from the same axis."}, "axes": [{"key": "goal", "name": "End Goal", "negPole": "Abolish Capitalism Eventually", "posPole": "Permanently Humanise Capitalism"}, {"key": "ownr", "name": "Ownership Model", "negPole": "State / Public Ownership", "posPole": "Cooperative & Associational"}, {"key": "agen", "name": "Agency of Change", "negPole": "Expert / Administrative Elite", "posPole": "Mass Labour Movement"}, {"key": "clas", "name": "Class Framing", "negPole": "Explicit Class Struggle", "posPole": "Cross-Class National Solidarity"}, {"key": "mora", "name": "Moral Ground", "negPole": "Historical-Materialist Analysis", "posPole": "Ethical / Religious Conviction"}, {"key": "mkt", "name": "Allocation", "negPole": "Comprehensive Planning", "posPole": "Markets Retained"}, {"key": "intl", "name": "Horizon", "negPole": "National Framework Primary", "posPole": "International Solidarity Primary"}, {"key": "rout", "name": "Institutional Route", "negPole": "Parliamentary State Capture", "posPole": "Parallel Movement Institutions"}], "subIdeologies": [{"name": "Classical Social Democracy (Bernstein)", "umbrella": false, "anchor": {"goal": 47, "ownr": 66, "agen": 84, "clas": 61, "mora": 79, "mkt": 88, "intl": 42, "rout": 45}}, {"name": "Nordic Model Social Democracy", "umbrella": false, "anchor": {"goal": 86, "ownr": 32, "agen": 55, "clas": 74, "mora": 40, "mkt": 90, "intl": 32, "rout": 14}}, {"name": "Democratic Socialism (contemporary)", "umbrella": false, "anchor": {"goal": 18, "ownr": 32, "agen": 92, "clas": 18, "mora": 26, "mkt": 34, "intl": 78, "rout": 42}}, {"name": "Fabianism", "umbrella": false, "anchor": {"goal": 46, "ownr": 4, "agen": 2, "clas": 62, "mora": 34, "mkt": 24, "intl": 22, "rout": 4}}, {"name": "Austromarxism", "umbrella": false, "anchor": {"goal": 12, "ownr": 16, "agen": 90, "clas": 4, "mora": 2, "mkt": 30, "intl": 72, "rout": 72}}, {"name": "Guild Socialism", "umbrella": false, "anchor": {"goal": 20, "ownr": 86, "agen": 80, "clas": 34, "mora": 46, "mkt": 40, "intl": 38, "rout": 76}}, {"name": "Christian Socialism", "umbrella": false, "anchor": {"goal": 46, "ownr": 72, "agen": 48, "clas": 78, "mora": 99, "mkt": 56, "intl": 62, "rout": 60}}, {"name": "Market Socialism (Lange-Lerner)", "umbrella": false, "anchor": {"goal": 28, "ownr": 46, "agen": 12, "clas": 60, "mora": 12, "mkt": 95, "intl": 44, "rout": 18}}, {"name": "Ethical Socialism (Tawney)", "umbrella": false, "anchor": {"goal": 45, "ownr": 40, "agen": 60, "clas": 55, "mora": 82, "mkt": 50, "intl": 50, "rout": 30}}, {"name": "Cooperative Socialism / Owenism", "umbrella": false, "anchor": {"goal": 30, "ownr": 99, "agen": 60, "clas": 58, "mora": 58, "mkt": 62, "intl": 55, "rout": 96}}, {"name": "Utopian Socialism (Fourier, Saint-Simon)", "umbrella": false, "anchor": {"goal": 24, "ownr": 92, "agen": 18, "clas": 88, "mora": 80, "mkt": 18, "intl": 72, "rout": 92}}, {"name": "Labor Zionism", "umbrella": false, "anchor": {"goal": 42, "ownr": 90, "agen": 76, "clas": 80, "mora": 52, "mkt": 46, "intl": 2, "rout": 88}}], "questions": [{"id": "goal01", "axis": "goal", "core": true, "effect": {"goal": -10}, "text": "Capitalism should eventually be superseded by a socialised economy, even if the road there is gradual."}, {"id": "goal02", "axis": "goal", "core": true, "effect": {"goal": -9}, "text": "Reforms are worthwhile mainly insofar as they build toward eventually replacing capitalism."}, {"id": "goal03", "axis": "goal", "core": true, "effect": {"goal": -8}, "text": "A fully socialised economy remains the ultimate goal, whatever compromises the present requires."}, {"id": "goal04", "axis": "goal", "core": false, "effect": {"goal": -10}, "text": "Private ownership of the major means of production is a problem to be solved, not managed indefinitely."}, {"id": "goal05", "axis": "goal", "core": false, "effect": {"goal": -8}, "text": "The welfare state is a stage on the way to something beyond capitalism, not the final destination."}, {"id": "goal06", "axis": "goal", "core": false, "effect": {"goal": -7}, "text": "Socialists should keep the horizon of a post-capitalist economy alive, even while working within the current one."}, {"id": "goal07", "axis": "goal", "core": true, "effect": {"goal": 10}, "text": "A well-regulated capitalism with a strong welfare state is not a stage toward something else; it is the goal."}, {"id": "goal08", "axis": "goal", "core": true, "effect": {"goal": 9}, "text": "Taming capitalism's worst effects is a full and sufficient program, not a first step toward abolishing it."}, {"id": "goal09", "axis": "goal", "core": true, "effect": {"goal": 8}, "text": "There is no need to imagine an economy beyond capitalism as long as capitalism can be made humane enough."}, {"id": "goal10", "axis": "goal", "core": false, "effect": {"goal": 10}, "text": "Permanent management of capitalism through democratic institutions is preferable to any attempt to replace it."}, {"id": "goal11", "axis": "goal", "core": false, "effect": {"goal": 8}, "text": "A regulated market economy, indefinitely sustained, is compatible with a genuinely socialist commitment."}, {"id": "goal12", "axis": "goal", "core": false, "effect": {"goal": 7}, "text": "The point of socialism is to civilise capitalism, not to end it."}, {"id": "ownr01", "axis": "ownr", "core": true, "effect": {"ownr": -10}, "text": "Key industries should be brought into state or public ownership."}, {"id": "ownr02", "axis": "ownr", "core": true, "effect": {"ownr": -9}, "text": "Nationalisation of major utilities and infrastructure is a legitimate and often necessary policy."}, {"id": "ownr03", "axis": "ownr", "core": true, "effect": {"ownr": -8}, "text": "The state is the right vehicle to own and run large-scale enterprise on behalf of the public."}, {"id": "ownr04", "axis": "ownr", "core": false, "effect": {"ownr": -10}, "text": "Public ownership, properly managed, outperforms private ownership in essential sectors."}, {"id": "ownr05", "axis": "ownr", "core": false, "effect": {"ownr": -8}, "text": "A government elected to represent the public should be willing to take strategic industries into public hands."}, {"id": "ownr06", "axis": "ownr", "core": false, "effect": {"ownr": -7}, "text": "State ownership removes profit-seeking from decisions that affect everyone."}, {"id": "ownr07", "axis": "ownr", "core": true, "effect": {"ownr": 10}, "text": "Worker and consumer cooperatives are a better model of social ownership than a state-run enterprise."}, {"id": "ownr08", "axis": "ownr", "core": true, "effect": {"ownr": 9}, "text": "Ownership should be devolved to workers' and users' associations rather than centralised in the state."}, {"id": "ownr09", "axis": "ownr", "core": true, "effect": {"ownr": 8}, "text": "A cooperative economy avoids the bureaucratic distance that state ownership creates between the enterprise and the people it serves."}, {"id": "ownr10", "axis": "ownr", "core": false, "effect": {"ownr": 10}, "text": "Mutual and cooperative ownership better reflects democratic control than a ministry ever could."}, {"id": "ownr11", "axis": "ownr", "core": false, "effect": {"ownr": 8}, "text": "The state is too remote from day-to-day production to be the right owner of most enterprise."}, {"id": "ownr12", "axis": "ownr", "core": false, "effect": {"ownr": 7}, "text": "Associational forms of ownership, not nationalisation, are the socialist alternative to private capital."}, {"id": "agen01", "axis": "agen", "core": true, "effect": {"agen": 10}, "text": "Organised labour, through unions and mass parties, is the driving force of social progress."}, {"id": "agen02", "axis": "agen", "core": true, "effect": {"agen": 9}, "text": "Real gains for working people have historically come from mobilised labour movements, not from enlightened administration alone."}, {"id": "agen03", "axis": "agen", "core": true, "effect": {"agen": 8}, "text": "A socialist party without a rooted labour movement behind it has no real base."}, {"id": "agen04", "axis": "agen", "core": false, "effect": {"agen": 10}, "text": "Strikes and organised labour pressure remain a legitimate and necessary part of achieving social democratic goals."}, {"id": "agen05", "axis": "agen", "core": false, "effect": {"agen": 8}, "text": "The trade union movement should have a formal, structural role inside a social democratic party."}, {"id": "agen06", "axis": "agen", "core": false, "effect": {"agen": 7}, "text": "Mass membership and mobilisation are what give a labour party its legitimacy and power."}, {"id": "agen07", "axis": "agen", "core": true, "effect": {"agen": -10}, "text": "Competent technocratic administration and expert policy design deliver more reliable progress than mass mobilisation does."}, {"id": "agen08", "axis": "agen", "core": true, "effect": {"agen": -9}, "text": "A well-run civil service can achieve more for ordinary people than industrial action ever could."}, {"id": "agen09", "axis": "agen", "core": true, "effect": {"agen": -8}, "text": "Modern social democracy is better served by expert governance than by dependence on trade union power."}, {"id": "agen10", "axis": "agen", "core": false, "effect": {"agen": -10}, "text": "Professional policymaking, insulated from union pressure, produces more sustainable reform."}, {"id": "agen11", "axis": "agen", "core": false, "effect": {"agen": -8}, "text": "The labour movement's role should be advisory rather than decisive in shaping government policy."}, {"id": "agen12", "axis": "agen", "core": false, "effect": {"agen": -7}, "text": "Sound administration matters more to social democracy's success than the strength of any particular movement behind it."}, {"id": "clas01", "axis": "clas", "core": true, "effect": {"clas": -10}, "text": "Society is organised around a real conflict between labour and capital, and social democracy exists to represent labour's side of it."}, {"id": "clas02", "axis": "clas", "core": true, "effect": {"clas": -9}, "text": "Political parties should be honest that they represent the interests of a particular class, not the nation as a whole."}, {"id": "clas03", "axis": "clas", "core": true, "effect": {"clas": -8}, "text": "The interests of workers and the interests of employers are, at bottom, opposed."}, {"id": "clas04", "axis": "clas", "core": false, "effect": {"clas": -10}, "text": "A social democratic party should see itself as the political expression of the labour movement."}, {"id": "clas05", "axis": "clas", "core": false, "effect": {"clas": -8}, "text": "Redistribution is justified because capital's gains come at labour's expense."}, {"id": "clas06", "axis": "clas", "core": false, "effect": {"clas": -7}, "text": "Class remains the primary division that social democratic politics has to organise around."}, {"id": "clas07", "axis": "clas", "core": true, "effect": {"clas": 10}, "text": "The national interest, properly understood, unites workers and employers more than it divides them."}, {"id": "clas08", "axis": "clas", "core": true, "effect": {"clas": 9}, "text": "Government should represent the whole nation, not act as the political arm of any one class."}, {"id": "clas09", "axis": "clas", "core": true, "effect": {"clas": 8}, "text": "Cross-class cooperation between labour and capital is possible and preferable to permanent conflict."}, {"id": "clas10", "axis": "clas", "core": false, "effect": {"clas": 10}, "text": "Framing politics as a struggle between classes is a distortion that a modern social democracy should move past."}, {"id": "clas11", "axis": "clas", "core": false, "effect": {"clas": 8}, "text": "Employers and employees share a common interest in a growing, well-managed economy."}, {"id": "clas12", "axis": "clas", "core": false, "effect": {"clas": 7}, "text": "Class-based politics narrows a party's appeal in ways that hurt rather than help ordinary people."}, {"id": "mora01", "axis": "mora", "core": true, "effect": {"mora": 10}, "text": "Socialism's case rests on ethical conviction and human solidarity as much as on any theory of economic development."}, {"id": "mora02", "axis": "mora", "core": true, "effect": {"mora": 9}, "text": "A religious or humanist sense of duty toward the poor is a legitimate foundation for socialist commitment."}, {"id": "mora03", "axis": "mora", "core": true, "effect": {"mora": 8}, "text": "Fellowship and mutual obligation are the moral core of the socialist project, not just its material programme."}, {"id": "mora04", "axis": "mora", "core": false, "effect": {"mora": 10}, "text": "Socialism should be defended as a moral vision of how people ought to treat one another, not only as economic analysis."}, {"id": "mora05", "axis": "mora", "core": false, "effect": {"mora": 8}, "text": "The case for social democracy can rest on conscience and compassion without needing a theory of historical stages."}, {"id": "mora06", "axis": "mora", "core": false, "effect": {"mora": 7}, "text": "Ethical conviction is a sufficient basis for socialist politics on its own."}, {"id": "mora07", "axis": "mora", "core": true, "effect": {"mora": -10}, "text": "Socialist policy should be grounded in a materialist analysis of economic development, not in moral sentiment."}, {"id": "mora08", "axis": "mora", "core": true, "effect": {"mora": -9}, "text": "Appeals to ethics and conscience are a weaker foundation for politics than an analysis of class interest."}, {"id": "mora09", "axis": "mora", "core": true, "effect": {"mora": -8}, "text": "The case for redistribution should rest on structural economic argument, not on charity or compassion."}, {"id": "mora10", "axis": "mora", "core": false, "effect": {"mora": -10}, "text": "Socialism is a scientific analysis of capitalism's development, not primarily a moral creed."}, {"id": "mora11", "axis": "mora", "core": false, "effect": {"mora": -8}, "text": "Grounding policy in sentiment rather than economic analysis makes for worse, less durable politics."}, {"id": "mora12", "axis": "mora", "core": false, "effect": {"mora": -7}, "text": "A social democratic programme should be justified by its material outcomes, not by an appeal to conscience."}, {"id": "mkt01", "axis": "mkt", "core": true, "effect": {"mkt": 10}, "text": "Markets, properly regulated and taxed, are a reasonably efficient way to allocate most goods."}, {"id": "mkt02", "axis": "mkt", "core": true, "effect": {"mkt": 9}, "text": "A mixed economy with strong regulation and a robust welfare state is preferable to comprehensive planning."}, {"id": "mkt03", "axis": "mkt", "core": true, "effect": {"mkt": 8}, "text": "Private enterprise, operating within rules set democratically, can be compatible with a socialist programme."}, {"id": "mkt04", "axis": "mkt", "core": false, "effect": {"mkt": 10}, "text": "Central planning across the whole economy is neither necessary nor desirable to achieve social democratic goals."}, {"id": "mkt05", "axis": "mkt", "core": false, "effect": {"mkt": 8}, "text": "Markets can be harnessed for social ends through taxation and regulation rather than replaced outright."}, {"id": "mkt06", "axis": "mkt", "core": false, "effect": {"mkt": 7}, "text": "A competitive market sector, combined with strong public services, is the practical model worth pursuing."}, {"id": "mkt07", "axis": "mkt", "core": true, "effect": {"mkt": -10}, "text": "The economy as a whole should be organised through comprehensive democratic planning, not left to market allocation."}, {"id": "mkt08", "axis": "mkt", "core": true, "effect": {"mkt": -9}, "text": "Relying on markets, even regulated ones, leaves too much power in private hands to be a real socialist model."}, {"id": "mkt09", "axis": "mkt", "core": true, "effect": {"mkt": -8}, "text": "Planning, not market incentives, should determine what gets produced and how it's distributed."}, {"id": "mkt10", "axis": "mkt", "core": false, "effect": {"mkt": -10}, "text": "A market economy, however regulated, still runs on the logic of profit, which planning would remove."}, {"id": "mkt11", "axis": "mkt", "core": false, "effect": {"mkt": -8}, "text": "Serious social democrats should aim to replace market allocation with democratic planning over time."}, {"id": "mkt12", "axis": "mkt", "core": false, "effect": {"mkt": -7}, "text": "Trusting markets to deliver socially desirable outcomes, even with regulation, concedes too much to capital."}, {"id": "intl01", "axis": "intl", "core": true, "effect": {"intl": 10}, "text": "Solidarity between workers of different countries should take priority over any one nation's programme."}, {"id": "intl02", "axis": "intl", "core": true, "effect": {"intl": 9}, "text": "International labour and socialist organisation matters as much as winning power in any single country."}, {"id": "intl03", "axis": "intl", "core": true, "effect": {"intl": 8}, "text": "A social democratic government should coordinate with sister parties abroad rather than act purely in national terms."}, {"id": "intl04", "axis": "intl", "core": false, "effect": {"intl": 10}, "text": "The labour movement's outlook should be internationalist even when its immediate battles are fought at home."}, {"id": "intl05", "axis": "intl", "core": false, "effect": {"intl": 8}, "text": "Building international institutions of solidarity is a legitimate priority for a socialist movement."}, {"id": "intl06", "axis": "intl", "core": false, "effect": {"intl": 7}, "text": "Workers everywhere share more in common with each other than with the capital of their own country."}, {"id": "intl07", "axis": "intl", "core": true, "effect": {"intl": -10}, "text": "A social democratic party's first obligation is to the workers of its own nation."}, {"id": "intl08", "axis": "intl", "core": true, "effect": {"intl": -9}, "text": "National programmes, tailored to national conditions, should take priority over international coordination."}, {"id": "intl09", "axis": "intl", "core": true, "effect": {"intl": -8}, "text": "Practical social democracy is built one country at a time, not through international schemes."}, {"id": "intl10", "axis": "intl", "core": false, "effect": {"intl": -10}, "text": "The nation remains the primary framework within which social democratic gains are actually won and defended."}, {"id": "intl11", "axis": "intl", "core": false, "effect": {"intl": -8}, "text": "International solidarity is a worthy sentiment but a secondary concern next to winning power at home."}, {"id": "intl12", "axis": "intl", "core": false, "effect": {"intl": -7}, "text": "A social democratic government answers to its own electorate first, international solidarity second."}, {"id": "rout01", "axis": "rout", "core": true, "effect": {"rout": -10}, "text": "Winning elections and governing through parliament is the legitimate route to social democratic change."}, {"id": "rout02", "axis": "rout", "core": true, "effect": {"rout": -9}, "text": "Working through existing constitutional and parliamentary institutions is both practical and principled."}, {"id": "rout03", "axis": "rout", "core": true, "effect": {"rout": -8}, "text": "A social democratic party should aim to win office and legislate its programme through the state."}, {"id": "rout04", "axis": "rout", "core": false, "effect": {"rout": -10}, "text": "Reform through the ballot box has delivered real, lasting gains for working people."}, {"id": "rout05", "axis": "rout", "core": false, "effect": {"rout": -8}, "text": "Patient parliamentary work, however slow, is more durable than any shortcut around it."}, {"id": "rout06", "axis": "rout", "core": false, "effect": {"rout": -7}, "text": "The state, once captured through elections, is a legitimate and sufficient instrument for social democratic change."}, {"id": "rout07", "axis": "rout", "core": true, "effect": {"rout": 10}, "text": "Lasting change requires building movement institutions \u2014 unions, cooperatives, mutual societies \u2014 that operate alongside and sometimes against the state."}, {"id": "rout08", "axis": "rout", "core": true, "effect": {"rout": 9}, "text": "Relying solely on parliament leaves a movement vulnerable whenever it loses an election."}, {"id": "rout09", "axis": "rout", "core": true, "effect": {"rout": 8}, "text": "Parallel structures of working-class power should be built regardless of who holds government office."}, {"id": "rout10", "axis": "rout", "core": false, "effect": {"rout": 10}, "text": "A movement's own institutions, not just its parliamentary representatives, are what secure real, lasting gains."}, {"id": "rout11", "axis": "rout", "core": false, "effect": {"rout": 8}, "text": "Electoral office is only one part of building power; movement infrastructure outside the state matters as much."}, {"id": "rout12", "axis": "rout", "core": false, "effect": {"rout": 7}, "text": "Depending only on the state for change cedes too much of the movement's independence."}]}, "5": {"meta": {"module": 2, "bucketId": 5, "bucket": "Progressive / Social Liberalism", "version": "0.1-draft", "questionCount": 96, "shortFormCount": 48, "scoring": {"answerScale": [{"label": "Strongly Agree", "mult": 1.0}, {"label": "Agree", "mult": 0.5}, {"label": "Neutral / Unsure", "mult": 0.0}, {"label": "Disagree", "mult": -0.5}, {"label": "Strongly Disagree", "mult": -1.0}], "formula": "raw[axis] = sum(mult * effect[axis]); max[axis] = sum(abs(effect[axis])); score[axis] = 100 * (max + raw) / (2 * max)"}, "presentation": "Stored grouped by axis for maintainability. The app must SHUFFLE at runtime with a fixed seed so consecutive items do not come from the same axis."}, "axes": [{"key": "stat", "name": "State Economic Role", "negPole": "Market-Deferential", "posPole": "Large Redistributive State"}, {"key": "just", "name": "Ground of Justification", "negPole": "Pragmatic Problem-Solving", "posPole": "Principled Rights & Theory"}, {"key": "reco", "name": "Axis of Justice", "negPole": "Material Redistribution", "posPole": "Recognition & Identity"}, {"key": "expe", "name": "Mode of Change", "negPole": "Technocratic Administration", "posPole": "Popular Movement Pressure"}, {"key": "grow", "name": "Growth & Limits", "negPole": "Growth-Compatible", "posPole": "Ecological Limits Bind"}, {"key": "cosm", "name": "Community of Obligation", "negPole": "Bounded National Community", "posPole": "Cosmopolitan / Global"}, {"key": "mkt", "name": "Market Confidence", "negPole": "Markets Need Structural Correction", "posPole": "Markets Work; Correct at Margins"}, {"key": "forp", "name": "Foreign Posture", "negPole": "Restraint / Non-Intervention", "posPole": "Liberal Interventionism"}], "subIdeologies": [{"name": "New Deal Liberalism", "umbrella": false, "anchor": {"stat": 92, "just": 18, "reco": 4, "expe": 42, "grow": 8, "cosm": 18, "mkt": 12, "forp": 58}}, {"name": "Rawlsian Liberalism", "umbrella": false, "anchor": {"stat": 76, "just": 99, "reco": 24, "expe": 30, "grow": 30, "cosm": 56, "mkt": 38, "forp": 44}}, {"name": "Welfare Liberalism", "umbrella": false, "anchor": {"stat": 86, "just": 55, "reco": 14, "expe": 34, "grow": 20, "cosm": 34, "mkt": 24, "forp": 44}}, {"name": "Third Way / Blairism", "umbrella": false, "anchor": {"stat": 24, "just": 18, "reco": 42, "expe": 6, "grow": 2, "cosm": 46, "mkt": 94, "forp": 96}}, {"name": "Green Liberalism", "umbrella": false, "anchor": {"stat": 60, "just": 46, "reco": 44, "expe": 62, "grow": 97, "cosm": 76, "mkt": 34, "forp": 16}}, {"name": "Feminist Liberalism", "umbrella": false, "anchor": {"stat": 66, "just": 76, "reco": 88, "expe": 78, "grow": 34, "cosm": 66, "mkt": 46, "forp": 48}}, {"name": "Multiculturalist Liberalism", "umbrella": false, "anchor": {"stat": 54, "just": 82, "reco": 97, "expe": 58, "grow": 28, "cosm": 92, "mkt": 56, "forp": 52}}, {"name": "Civil Rights Liberalism", "umbrella": false, "anchor": {"stat": 60, "just": 86, "reco": 82, "expe": 96, "grow": 18, "cosm": 44, "mkt": 44, "forp": 22}}, {"name": "Progressivism (US Progressive Era)", "umbrella": false, "anchor": {"stat": 66, "just": 8, "reco": 18, "expe": 8, "grow": 14, "cosm": 12, "mkt": 24, "forp": 40}}, {"name": "Radical Centrism", "umbrella": false, "anchor": {"stat": 34, "just": 4, "reco": 34, "expe": 2, "grow": 10, "cosm": 30, "mkt": 84, "forp": 66}}], "questions": [{"id": "stat01", "axis": "stat", "core": true, "effect": {"stat": 10}, "text": "Government should take an active, sustained role in redistributing income and providing social insurance."}, {"id": "stat02", "axis": "stat", "core": true, "effect": {"stat": 9}, "text": "A large welfare state is a legitimate and necessary feature of a decent society."}, {"id": "stat03", "axis": "stat", "core": true, "effect": {"stat": 8}, "text": "Public programmes should guarantee a baseline of security that markets alone won't provide."}, {"id": "stat04", "axis": "stat", "core": false, "effect": {"stat": 10}, "text": "Taxation to fund broad social programmes is a reasonable price for a fairer society."}, {"id": "stat05", "axis": "stat", "core": false, "effect": {"stat": 8}, "text": "Government has a responsibility to correct the unequal outcomes markets produce."}, {"id": "stat06", "axis": "stat", "core": false, "effect": {"stat": 7}, "text": "Expanding public provision of health, education, and income support is a core task of government."}, {"id": "stat07", "axis": "stat", "core": true, "effect": {"stat": -10}, "text": "Government's economic role should be limited mostly to setting the rules within which markets operate."}, {"id": "stat08", "axis": "stat", "core": true, "effect": {"stat": -9}, "text": "Most social needs are better met by markets and private initiative than by large public programmes."}, {"id": "stat09", "axis": "stat", "core": true, "effect": {"stat": -8}, "text": "Extensive redistribution risks doing more economic harm than the inequality it's meant to fix."}, {"id": "stat10", "axis": "stat", "core": false, "effect": {"stat": -10}, "text": "A leaner state, focused on targeted rather than universal programmes, serves people better."}, {"id": "stat11", "axis": "stat", "core": false, "effect": {"stat": -8}, "text": "Public spending should be judged mainly by its efficiency, not its scale."}, {"id": "stat12", "axis": "stat", "core": false, "effect": {"stat": -7}, "text": "Government intervention should be the exception that's justified, not the default approach."}, {"id": "just01", "axis": "just", "core": true, "effect": {"just": 10}, "text": "Political principles should follow from a coherent theory of rights and fairness, worked out in advance."}, {"id": "just02", "axis": "just", "core": true, "effect": {"just": 9}, "text": "A just policy is one that could be justified to anyone regardless of their position in society."}, {"id": "just03", "axis": "just", "core": true, "effect": {"just": 8}, "text": "Consistency with a defensible theory of justice matters even when it's politically inconvenient."}, {"id": "just04", "axis": "just", "core": false, "effect": {"just": 10}, "text": "Rights-based reasoning should constrain policy even against short-term practical pressures."}, {"id": "just05", "axis": "just", "core": false, "effect": {"just": 8}, "text": "Working out the principles first, then applying them, produces better policy than improvising case by case."}, {"id": "just06", "axis": "just", "core": false, "effect": {"just": 7}, "text": "A society's institutions should be judged against an ideal of fairness, not just against what currently works."}, {"id": "just07", "axis": "just", "core": true, "effect": {"just": -10}, "text": "Good policy comes from solving concrete problems as they arise, not from applying a general theory."}, {"id": "just08", "axis": "just", "core": true, "effect": {"just": -9}, "text": "Pragmatic compromise, even where it's theoretically untidy, usually beats principled consistency."}, {"id": "just09", "axis": "just", "core": true, "effect": {"just": -8}, "text": "What matters is whether a policy works, not whether it fits a general theory of justice."}, {"id": "just10", "axis": "just", "core": false, "effect": {"just": -10}, "text": "Flexibility to adapt policy to circumstances is more valuable than fidelity to abstract principle."}, {"id": "just11", "axis": "just", "core": false, "effect": {"just": -8}, "text": "Most political problems are better solved by expertise and experimentation than by philosophical first principles."}, {"id": "just12", "axis": "just", "core": false, "effect": {"just": -7}, "text": "Rigid adherence to a theory of justice often gets in the way of practical, achievable reform."}, {"id": "reco01", "axis": "reco", "core": true, "effect": {"reco": 10}, "text": "Recognising and affirming marginalised identities is as important a task of justice as redistributing income."}, {"id": "reco02", "axis": "reco", "core": true, "effect": {"reco": 9}, "text": "Discrimination based on identity is a distinct injustice that redistribution alone does not fix."}, {"id": "reco03", "axis": "reco", "core": true, "effect": {"reco": 8}, "text": "Representation and dignity for historically excluded groups are legitimate goals of public policy in their own right."}, {"id": "reco04", "axis": "reco", "core": false, "effect": {"reco": 10}, "text": "Addressing cultural stigma and exclusion matters even independent of any economic effect."}, {"id": "reco05", "axis": "reco", "core": false, "effect": {"reco": 8}, "text": "Justice requires that institutions recognise different identities and experiences, not just distribute resources equally."}, {"id": "reco06", "axis": "reco", "core": false, "effect": {"reco": 7}, "text": "Symbolic recognition \u2014 visibility, respect, representation \u2014 is a real form of justice, not a distraction from it."}, {"id": "reco07", "axis": "reco", "core": true, "effect": {"reco": -10}, "text": "Economic redistribution is the more fundamental form of justice; recognition of identity is secondary to it."}, {"id": "reco08", "axis": "reco", "core": true, "effect": {"reco": -9}, "text": "Focusing on identity and recognition can distract from the material inequality that underlies most injustice."}, {"id": "reco09", "axis": "reco", "core": true, "effect": {"reco": -8}, "text": "If material inequality were solved, most grievances currently framed around identity would fade."}, {"id": "reco10", "axis": "reco", "core": false, "effect": {"reco": -10}, "text": "Policy should target income and opportunity directly rather than focus on symbolic recognition."}, {"id": "reco11", "axis": "reco", "core": false, "effect": {"reco": -8}, "text": "Redistribution reaches more people and does more good than recognition-focused policy does."}, {"id": "reco12", "axis": "reco", "core": false, "effect": {"reco": -7}, "text": "Class and income remain a more solid basis for a justice agenda than identity and recognition."}, {"id": "expe01", "axis": "expe", "core": true, "effect": {"expe": 10}, "text": "Sustained public pressure and organised movements are often necessary to force meaningful reform."}, {"id": "expe02", "axis": "expe", "core": true, "effect": {"expe": 9}, "text": "Progress on rights and equality has historically depended on movements outside government, not administrators inside it."}, {"id": "expe03", "axis": "expe", "core": true, "effect": {"expe": 8}, "text": "Grassroots organising deserves a central place in a progressive theory of change."}, {"id": "expe04", "axis": "expe", "core": false, "effect": {"expe": 10}, "text": "Protest and mobilisation are legitimate and often necessary complements to legislative work."}, {"id": "expe05", "axis": "expe", "core": false, "effect": {"expe": 8}, "text": "Change driven from below tends to be more durable than change handed down from above."}, {"id": "expe06", "axis": "expe", "core": false, "effect": {"expe": 7}, "text": "Movements holding politicians accountable from outside government are essential to real progress."}, {"id": "expe07", "axis": "expe", "core": true, "effect": {"expe": -10}, "text": "Careful policy design by qualified experts and administrators is a more reliable route to progress than mass mobilisation."}, {"id": "expe08", "axis": "expe", "core": true, "effect": {"expe": -9}, "text": "Technocratic governance, insulated from populist pressure, tends to produce better long-run outcomes."}, {"id": "expe09", "axis": "expe", "core": true, "effect": {"expe": -8}, "text": "Expert-driven incrementalism achieves more durable progress than movement pressure that burns out."}, {"id": "expe10", "axis": "expe", "core": false, "effect": {"expe": -10}, "text": "Good administration, not agitation, is what actually implements progressive goals once they're won."}, {"id": "expe11", "axis": "expe", "core": false, "effect": {"expe": -8}, "text": "Professional policymaking should be trusted over popular pressure to get complex reforms right."}, {"id": "expe12", "axis": "expe", "core": false, "effect": {"expe": -7}, "text": "Movements are useful for raising issues, but implementation is properly the work of experts and administrators."}, {"id": "grow01", "axis": "grow", "core": true, "effect": {"grow": 10}, "text": "Economic growth has to be constrained by ecological limits, even where that means slower growth."}, {"id": "grow02", "axis": "grow", "core": true, "effect": {"grow": 9}, "text": "Environmental sustainability should take priority over growth when the two conflict."}, {"id": "grow03", "axis": "grow", "core": true, "effect": {"grow": 8}, "text": "The planet's ecological limits are a hard constraint that policy has to respect, not just balance against other goals."}, {"id": "grow04", "axis": "grow", "core": false, "effect": {"grow": 10}, "text": "Some current levels of consumption and production are not sustainable and need to be reduced."}, {"id": "grow05", "axis": "grow", "core": false, "effect": {"grow": 8}, "text": "Climate and environmental goals justify significant near-term costs to economic growth."}, {"id": "grow06", "axis": "grow", "core": false, "effect": {"grow": 7}, "text": "A serious environmental policy sometimes means accepting less growth, not just greener growth."}, {"id": "grow07", "axis": "grow", "core": true, "effect": {"grow": -10}, "text": "Growth and environmental protection can generally be pursued together without hard trade-offs."}, {"id": "grow08", "axis": "grow", "core": true, "effect": {"grow": -9}, "text": "Technological innovation will resolve most environmental constraints without needing to slow growth."}, {"id": "grow09", "axis": "grow", "core": true, "effect": {"grow": -8}, "text": "Prioritising growth remains the most reliable way to fund the programmes progressives care about."}, {"id": "grow10", "axis": "grow", "core": false, "effect": {"grow": -10}, "text": "Environmental goals should be pursued in ways that don't compromise economic growth."}, {"id": "grow11", "axis": "grow", "core": false, "effect": {"grow": -8}, "text": "A growing economy gives government more resources to address environmental problems than a shrinking one would."}, {"id": "grow12", "axis": "grow", "core": false, "effect": {"grow": -7}, "text": "Ecological limits should be treated as one consideration among several, not an overriding constraint."}, {"id": "cosm01", "axis": "cosm", "core": true, "effect": {"cosm": 10}, "text": "Moral obligations extend to people everywhere, not just to fellow citizens."}, {"id": "cosm02", "axis": "cosm", "core": true, "effect": {"cosm": 9}, "text": "Global inequality between nations is as much a matter of justice as inequality within one."}, {"id": "cosm03", "axis": "cosm", "core": true, "effect": {"cosm": 8}, "text": "International institutions deserve real authority to address problems that cross borders."}, {"id": "cosm04", "axis": "cosm", "core": false, "effect": {"cosm": 10}, "text": "Immigration should be judged mainly by its effects on the migrants and the world, not only on current citizens."}, {"id": "cosm05", "axis": "cosm", "core": false, "effect": {"cosm": 8}, "text": "A just global order matters as much as a just national one."}, {"id": "cosm06", "axis": "cosm", "core": false, "effect": {"cosm": 7}, "text": "Citizens of wealthy countries have significant obligations to people in poorer ones."}, {"id": "cosm07", "axis": "cosm", "core": true, "effect": {"cosm": -10}, "text": "Government's primary obligation is to its own citizens; global obligations are real but secondary."}, {"id": "cosm08", "axis": "cosm", "core": true, "effect": {"cosm": -9}, "text": "National borders and national community are a legitimate basis for prioritising fellow citizens' interests."}, {"id": "cosm09", "axis": "cosm", "core": true, "effect": {"cosm": -8}, "text": "Policy should weigh the interests of citizens more heavily than the interests of non-citizens."}, {"id": "cosm10", "axis": "cosm", "core": false, "effect": {"cosm": -10}, "text": "Strong national sovereignty is compatible with progressive values and shouldn't be treated with suspicion."}, {"id": "cosm11", "axis": "cosm", "core": false, "effect": {"cosm": -8}, "text": "International institutions should support national governments, not override their democratic decisions."}, {"id": "cosm12", "axis": "cosm", "core": false, "effect": {"cosm": -7}, "text": "The nation remains the primary and appropriate unit of political obligation."}, {"id": "mkt01", "axis": "mkt", "core": true, "effect": {"mkt": -10}, "text": "Markets left to themselves produce outcomes that need serious structural correction, not just tinkering at the margins."}, {"id": "mkt02", "axis": "mkt", "core": true, "effect": {"mkt": -9}, "text": "Market failures are common and significant enough to justify active government intervention as a rule, not an exception."}, {"id": "mkt03", "axis": "mkt", "core": true, "effect": {"mkt": -8}, "text": "Concentrated corporate power distorts market outcomes badly enough to need real regulatory correction."}, {"id": "mkt04", "axis": "mkt", "core": false, "effect": {"mkt": -10}, "text": "Markets systematically underprice environmental and social costs unless government intervenes."}, {"id": "mkt05", "axis": "mkt", "core": false, "effect": {"mkt": -8}, "text": "Left alone, markets tend to concentrate wealth and power in ways that need active counterbalancing."}, {"id": "mkt06", "axis": "mkt", "core": false, "effect": {"mkt": -7}, "text": "Structural reform of market institutions, not just redistribution after the fact, is often necessary."}, {"id": "mkt07", "axis": "mkt", "core": true, "effect": {"mkt": 10}, "text": "Markets generally work well and mainly need correction only at the margins."}, {"id": "mkt08", "axis": "mkt", "core": true, "effect": {"mkt": 9}, "text": "Most economic problems are better solved by improving market competition than by heavy regulation."}, {"id": "mkt09", "axis": "mkt", "core": true, "effect": {"mkt": 8}, "text": "Government's role should mostly be removing obstacles to markets working efficiently, not overriding them."}, {"id": "mkt10", "axis": "mkt", "core": false, "effect": {"mkt": 10}, "text": "Light-touch regulation, rather than structural intervention, usually gets the best economic outcomes."}, {"id": "mkt11", "axis": "mkt", "core": false, "effect": {"mkt": 8}, "text": "Markets are broadly good at allocating resources; policy should nudge, not override, their outcomes."}, {"id": "mkt12", "axis": "mkt", "core": false, "effect": {"mkt": 7}, "text": "The presumption should favour market solutions unless there's a clear, specific failure to correct."}, {"id": "forp01", "axis": "forp", "core": true, "effect": {"forp": -10}, "text": "Military restraint and diplomacy should be the default in foreign policy, not intervention."}, {"id": "forp02", "axis": "forp", "core": true, "effect": {"forp": -9}, "text": "Interventions abroad, even well-intentioned ones, usually cause more harm than they prevent."}, {"id": "forp03", "axis": "forp", "core": true, "effect": {"forp": -8}, "text": "A country should be very cautious about using force to promote its values overseas."}, {"id": "forp04", "axis": "forp", "core": false, "effect": {"forp": -10}, "text": "Foreign policy should prioritise avoiding war over promoting democracy abroad by force."}, {"id": "forp05", "axis": "forp", "core": false, "effect": {"forp": -8}, "text": "The record of humanitarian and democracy-promoting interventions counsels strong scepticism about future ones."}, {"id": "forp06", "axis": "forp", "core": false, "effect": {"forp": -7}, "text": "National sovereignty should generally be respected even when a foreign government's conduct is troubling."}, {"id": "forp07", "axis": "forp", "core": true, "effect": {"forp": 10}, "text": "The international community has a responsibility to intervene, including militarily, to stop severe human rights abuses."}, {"id": "forp08", "axis": "forp", "core": true, "effect": {"forp": 9}, "text": "Promoting democracy and human rights abroad can justify the use of force in serious cases."}, {"id": "forp09", "axis": "forp", "core": true, "effect": {"forp": 8}, "text": "Standing by while atrocities occur abroad is itself a moral failure that inaction doesn't excuse."}, {"id": "forp10", "axis": "forp", "core": false, "effect": {"forp": 10}, "text": "Liberal states have a duty to use their power, including military power, in defence of universal rights."}, {"id": "forp11", "axis": "forp", "core": false, "effect": {"forp": 8}, "text": "Non-intervention in the face of genocide or mass atrocity is not genuine neutrality; it has consequences too."}, {"id": "forp12", "axis": "forp", "core": false, "effect": {"forp": 7}, "text": "A credible commitment to human rights sometimes requires the willingness to intervene abroad."}]}, "6": {"meta": {"module": 2, "bucketId": 6, "bucket": "Classical / Market Liberalism", "version": "0.1-draft", "questionCount": 96, "shortFormCount": 48, "scoring": {"answerScale": [{"label": "Strongly Agree", "mult": 1.0}, {"label": "Agree", "mult": 0.5}, {"label": "Neutral / Unsure", "mult": 0.0}, {"label": "Disagree", "mult": -0.5}, {"label": "Strongly Disagree", "mult": -1.0}], "formula": "raw[axis] = sum(mult * effect[axis]); max[axis] = sum(abs(effect[axis])); score[axis] = 100 * (max + raw) / (2 * max)"}, "presentation": "Stored grouped by axis for maintainability. The app must SHUFFLE at runtime with a fixed seed so consecutive items do not come from the same axis."}, "axes": [{"key": "stat", "name": "State & the Market", "negPole": "Pure Laissez-Faire", "posPole": "State Constructs the Market Order"}, {"key": "prop", "name": "Property Theory", "negPole": "Natural-Rights Absolutism", "posPole": "Property as Social Convention"}, {"key": "epis", "name": "Epistemic Method", "negPole": "Deductive / Rationalist", "posPole": "Empirical / Utilitarian"}, {"key": "demo", "name": "Democracy", "negPole": "Bind Democracy by Rules", "posPole": "Trust Majoritarian Democracy"}, {"key": "soci", "name": "Social Provision", "negPole": "No Public Welfare", "posPole": "Substantial Safety Net"}, {"key": "intl", "name": "Trade Order", "negPole": "Free-Trade Universalism", "posPole": "Managed National Economic Sovereignty"}, {"key": "mora", "name": "Moral Register", "negPole": "Individualist / Egoist Ethics", "posPole": "Civic Virtue & Moral Community"}, {"key": "corp", "name": "Concentrated Capital", "negPole": "Concentration Is Benign", "posPole": "Private Power Must Be Broken Up"}], "subIdeologies": [{"name": "Classical Liberalism (Locke, Smith)", "umbrella": false, "anchor": {"stat": 68, "prop": 28, "epis": 87, "demo": 30, "soci": 81, "intl": 29, "mora": 81, "corp": 66}}, {"name": "Neoliberalism", "umbrella": false, "anchor": {"stat": 55, "prop": 45, "epis": 88, "demo": 18, "soci": 40, "intl": 10, "mora": 34, "corp": 28}}, {"name": "Ordoliberalism", "umbrella": false, "anchor": {"stat": 97, "prop": 60, "epis": 60, "demo": 14, "soci": 82, "intl": 55, "mora": 82, "corp": 97}}, {"name": "Manchester Liberalism", "umbrella": false, "anchor": {"stat": 2, "prop": 20, "epis": 72, "demo": 62, "soci": 12, "intl": 0, "mora": 30, "corp": 40}}, {"name": "Georgism", "umbrella": false, "anchor": {"stat": 60, "prop": 99, "epis": 42, "demo": 78, "soci": 70, "intl": 24, "mora": 62, "corp": 80}}, {"name": "Austrian School Liberalism", "umbrella": false, "anchor": {"stat": 8, "prop": 8, "epis": 2, "demo": 24, "soci": 10, "intl": 18, "mora": 26, "corp": 18}}, {"name": "Constitutional / Federalist Liberalism", "umbrella": false, "anchor": {"stat": 45, "prop": 40, "epis": 50, "demo": 4, "soci": 30, "intl": 58, "mora": 72, "corp": 60}}, {"name": "Objectivism (Rand)", "umbrella": false, "anchor": {"stat": 5, "prop": 0, "epis": 4, "demo": 10, "soci": 0, "intl": 26, "mora": 0, "corp": 0}}], "questions": [{"id": "stat01", "axis": "stat", "core": true, "effect": {"stat": -10}, "text": "The state's role should be strictly limited to enforcing contracts and protecting property, nothing more."}, {"id": "stat02", "axis": "stat", "core": true, "effect": {"stat": -9}, "text": "Even a well-designed regulatory state tends to distort markets more than it improves them."}, {"id": "stat03", "axis": "stat", "core": true, "effect": {"stat": -8}, "text": "The fewer functions government performs, the better markets tend to work."}, {"id": "stat04", "axis": "stat", "core": false, "effect": {"stat": -10}, "text": "Government should get out of the way of voluntary exchange as a general rule."}, {"id": "stat05", "axis": "stat", "core": false, "effect": {"stat": -8}, "text": "Regulation, however well-intentioned, usually ends up serving established interests over the public."}, {"id": "stat06", "axis": "stat", "core": false, "effect": {"stat": -7}, "text": "A minimal state, confined to defence and courts, is the ideal to aim toward."}, {"id": "stat07", "axis": "stat", "core": true, "effect": {"stat": 10}, "text": "A sound market order has to be actively constructed and maintained by appropriate state institutions, not simply left alone."}, {"id": "stat08", "axis": "stat", "core": true, "effect": {"stat": 9}, "text": "Competition policy and a strong legal framework are necessary conditions for markets to function well, not optional extras."}, {"id": "stat09", "axis": "stat", "core": true, "effect": {"stat": 8}, "text": "Government has a legitimate role in designing the rules that make fair competition possible."}, {"id": "stat10", "axis": "stat", "core": false, "effect": {"stat": 10}, "text": "Laissez-faire without a strong institutional framework tends to produce monopoly, not competition."}, {"id": "stat11", "axis": "stat", "core": false, "effect": {"stat": 8}, "text": "The state should actively shape market structure, not just step back and let outcomes happen."}, {"id": "stat12", "axis": "stat", "core": false, "effect": {"stat": 7}, "text": "Deliberately building the legal and institutional order of the market is itself a proper task of government."}, {"id": "prop01", "axis": "prop", "core": true, "effect": {"prop": -10}, "text": "Property rights derive from an individual's labour and are prior to any decision by the state."}, {"id": "prop02", "axis": "prop", "core": true, "effect": {"prop": -9}, "text": "What a person justly acquires through voluntary exchange, they are entitled to keep, full stop."}, {"id": "prop03", "axis": "prop", "core": true, "effect": {"prop": -8}, "text": "Taxation beyond what's needed for basic state functions is a violation of property rights."}, {"id": "prop04", "axis": "prop", "core": false, "effect": {"prop": -10}, "text": "Property rights should be treated as close to absolute, not subject to routine political adjustment."}, {"id": "prop05", "axis": "prop", "core": false, "effect": {"prop": -8}, "text": "The right to property exists independently of whether society currently recognises or enforces it."}, {"id": "prop06", "axis": "prop", "core": false, "effect": {"prop": -7}, "text": "Redistribution of justly acquired property is a form of taking, whatever social goal it serves."}, {"id": "prop07", "axis": "prop", "core": true, "effect": {"prop": 10}, "text": "Property rights are a useful social convention, justified by their good consequences, not a natural entitlement."}, {"id": "prop08", "axis": "prop", "core": true, "effect": {"prop": 9}, "text": "Whether a rule of property is respected should depend on whether it produces good outcomes, not on an abstract right."}, {"id": "prop09", "axis": "prop", "core": true, "effect": {"prop": 8}, "text": "Land and unearned value should be treated differently from wealth actually produced by labour and enterprise."}, {"id": "prop10", "axis": "prop", "core": false, "effect": {"prop": 10}, "text": "Society can legitimately redefine property arrangements when doing so improves overall welfare."}, {"id": "prop11", "axis": "prop", "core": false, "effect": {"prop": 8}, "text": "Property rights are justified because they work, not because they're owed to anyone by nature."}, {"id": "prop12", "axis": "prop", "core": false, "effect": {"prop": 7}, "text": "The value of a property system lies entirely in its practical benefits, which makes it open to revision."}, {"id": "epis01", "axis": "epis", "core": true, "effect": {"epis": -10}, "text": "Economic truths can be established by logical deduction from basic axioms of human action, without needing statistical testing."}, {"id": "epis02", "axis": "epis", "core": true, "effect": {"epis": -9}, "text": "Economics is fundamentally a deductive discipline, closer to logic than to empirical science."}, {"id": "epis03", "axis": "epis", "core": true, "effect": {"epis": -8}, "text": "Attempts to mathematically model and test economic behaviour miss what's essential about individual human choice."}, {"id": "epis04", "axis": "epis", "core": false, "effect": {"epis": -10}, "text": "Sound economic reasoning follows from first principles, and data can at most illustrate it, not establish it."}, {"id": "epis05", "axis": "epis", "core": false, "effect": {"epis": -8}, "text": "The core truths of economics don't depend on statistical verification."}, {"id": "epis06", "axis": "epis", "core": false, "effect": {"epis": -7}, "text": "Formal models that abstract from real human choice can mislead more than they clarify."}, {"id": "epis07", "axis": "epis", "core": true, "effect": {"epis": 10}, "text": "Economic claims should be tested empirically and revised when the evidence doesn't support them."}, {"id": "epis08", "axis": "epis", "core": true, "effect": {"epis": 9}, "text": "Economics should be treated like other sciences: hypotheses tested against data, not derived from axioms alone."}, {"id": "epis09", "axis": "epis", "core": true, "effect": {"epis": 8}, "text": "Good policy follows from empirical study of what actually works, not from deducing conclusions from first principles."}, {"id": "epis10", "axis": "epis", "core": false, "effect": {"epis": 10}, "text": "Statistical evidence should override abstract theoretical reasoning when the two conflict."}, {"id": "epis11", "axis": "epis", "core": false, "effect": {"epis": 8}, "text": "Utilitarian calculation of costs and benefits is the right way to evaluate economic policy."}, {"id": "epis12", "axis": "epis", "core": false, "effect": {"epis": 7}, "text": "Economic theory should be judged by its predictive accuracy, tested against real outcomes."}, {"id": "demo01", "axis": "demo", "core": true, "effect": {"demo": -10}, "text": "Constitutional limits should bind what a democratic majority is permitted to legislate, especially over property and contract."}, {"id": "demo02", "axis": "demo", "core": true, "effect": {"demo": -9}, "text": "Some economic rights should be placed beyond the reach of ordinary majority votes."}, {"id": "demo03", "axis": "demo", "core": true, "effect": {"demo": -8}, "text": "Unrestrained democracy poses a real danger to individual liberty and property."}, {"id": "demo04", "axis": "demo", "core": false, "effect": {"demo": -10}, "text": "A written constitution constraining economic policy protects liberty better than trusting each new majority."}, {"id": "demo05", "axis": "demo", "core": false, "effect": {"demo": -8}, "text": "The risk of a democratic majority voting away individual rights is serious enough to justify strong constitutional limits."}, {"id": "demo06", "axis": "demo", "core": false, "effect": {"demo": -7}, "text": "Judicial review that strikes down economically illiberal legislation is a legitimate check on democracy."}, {"id": "demo07", "axis": "demo", "core": true, "effect": {"demo": 10}, "text": "Democratic majorities should have wide latitude to regulate the economy as they see fit."}, {"id": "demo08", "axis": "demo", "core": true, "effect": {"demo": 9}, "text": "Trusting elected majorities to set economic policy is more legitimate than binding them with rigid constitutional limits."}, {"id": "demo09", "axis": "demo", "core": true, "effect": {"demo": 8}, "text": "Constraining what voters can decide about the economy is itself a democratic problem, not a solution to one."}, {"id": "demo10", "axis": "demo", "core": false, "effect": {"demo": 10}, "text": "Economic policy should be as responsive to shifting majorities as any other area of legislation."}, {"id": "demo11", "axis": "demo", "core": false, "effect": {"demo": 8}, "text": "There's no special reason to wall off economic questions from ordinary democratic decision-making."}, {"id": "demo12", "axis": "demo", "core": false, "effect": {"demo": 7}, "text": "A society is more legitimate when its economic rules can be changed by the people who live under them."}, {"id": "soci01", "axis": "soci", "core": true, "effect": {"soci": -10}, "text": "There should be no state-run welfare programmes; charity and mutual aid should meet social needs."}, {"id": "soci02", "axis": "soci", "core": true, "effect": {"soci": -9}, "text": "Public pensions, unemployment insurance, and similar programmes crowd out better private and voluntary alternatives."}, {"id": "soci03", "axis": "soci", "core": true, "effect": {"soci": -8}, "text": "A safety net provided by the state creates dependency that voluntary provision would not."}, {"id": "soci04", "axis": "soci", "core": false, "effect": {"soci": -10}, "text": "People are better served by private insurance and saving than by state welfare programmes."}, {"id": "soci05", "axis": "soci", "core": false, "effect": {"soci": -8}, "text": "The state has no proper role in guaranteeing anyone's economic security."}, {"id": "soci06", "axis": "soci", "core": false, "effect": {"soci": -7}, "text": "Welfare provision should be left entirely to families, churches, and voluntary associations."}, {"id": "soci07", "axis": "soci", "core": true, "effect": {"soci": 10}, "text": "A basic social safety net is compatible with, and even strengthens, a market economy."}, {"id": "soci08", "axis": "soci", "core": true, "effect": {"soci": 9}, "text": "Public provision of health, unemployment, and retirement security is a reasonable complement to markets, not a threat to them."}, {"id": "soci09", "axis": "soci", "core": true, "effect": {"soci": 8}, "text": "A market economy is more politically sustainable when it's paired with real social insurance."}, {"id": "soci10", "axis": "soci", "core": false, "effect": {"soci": 10}, "text": "There's no contradiction between believing in free markets and supporting a substantial welfare state."}, {"id": "soci11", "axis": "soci", "core": false, "effect": {"soci": 8}, "text": "Universal basic protections make a market economy more resilient, not less efficient."}, {"id": "soci12", "axis": "soci", "core": false, "effect": {"soci": 7}, "text": "A humane floor under market outcomes is compatible with a broadly free-market economy."}, {"id": "intl01", "axis": "intl", "core": true, "effect": {"intl": -10}, "text": "Free trade, pursued unilaterally if necessary, benefits a country regardless of what other countries do."}, {"id": "intl02", "axis": "intl", "core": true, "effect": {"intl": -9}, "text": "Tariffs and trade barriers virtually always make a country poorer than free trade would."}, {"id": "intl03", "axis": "intl", "core": true, "effect": {"intl": -8}, "text": "Global economic integration should be pursued as an end in itself, not conditioned on reciprocity."}, {"id": "intl04", "axis": "intl", "core": false, "effect": {"intl": -10}, "text": "Open borders for trade and capital produce better outcomes than managed trade policy."}, {"id": "intl05", "axis": "intl", "core": false, "effect": {"intl": -8}, "text": "A country should not sacrifice free trade for the sake of protecting specific domestic industries."}, {"id": "intl06", "axis": "intl", "core": false, "effect": {"intl": -7}, "text": "The gains from free trade outweigh the disruption it causes to particular sectors or regions."}, {"id": "intl07", "axis": "intl", "core": true, "effect": {"intl": 10}, "text": "Trade policy should be actively managed to protect national economic capacity and strategic industries."}, {"id": "intl08", "axis": "intl", "core": true, "effect": {"intl": 9}, "text": "A country is right to prioritise its own economic sovereignty over the gains from unrestricted trade."}, {"id": "intl09", "axis": "intl", "core": true, "effect": {"intl": 8}, "text": "Reciprocity and strategic considerations should shape trade policy more than a general commitment to openness."}, {"id": "intl10", "axis": "intl", "core": false, "effect": {"intl": 10}, "text": "Free trade agreements should be judged by their effect on domestic jobs and industry, not on principle alone."}, {"id": "intl11", "axis": "intl", "core": false, "effect": {"intl": 8}, "text": "National economic self-sufficiency in key sectors is worth some sacrifice in overall efficiency."}, {"id": "intl12", "axis": "intl", "core": false, "effect": {"intl": 7}, "text": "Blanket commitment to free trade underestimates the value of retaining domestic productive capacity."}, {"id": "mora01", "axis": "mora", "core": true, "effect": {"mora": -10}, "text": "The pursuit of one's own rational self-interest is a legitimate, even admirable, guide to action."}, {"id": "mora02", "axis": "mora", "core": true, "effect": {"mora": -9}, "text": "Individuals owe nothing to others beyond what they voluntarily choose to give."}, {"id": "mora03", "axis": "mora", "core": true, "effect": {"mora": -8}, "text": "A society of people pursuing their own interests, without coerced obligation to each other, is a moral achievement."}, {"id": "mora04", "axis": "mora", "core": false, "effect": {"mora": -10}, "text": "Altruism imposed as a duty is a corruption of genuine, voluntary generosity."}, {"id": "mora05", "axis": "mora", "core": false, "effect": {"mora": -8}, "text": "Self-interest, properly understood, is compatible with and even productive of a flourishing society."}, {"id": "mora06", "axis": "mora", "core": false, "effect": {"mora": -7}, "text": "There is no moral obligation to sacrifice one's own interests for the collective good."}, {"id": "mora07", "axis": "mora", "core": true, "effect": {"mora": 10}, "text": "A functioning market economy still depends on habits of trust, restraint, and civic virtue that self-interest alone won't produce."}, {"id": "mora08", "axis": "mora", "core": true, "effect": {"mora": 9}, "text": "Individual liberty has to be balanced by a sense of obligation to the community that sustains it."}, {"id": "mora09", "axis": "mora", "core": true, "effect": {"mora": 8}, "text": "A purely self-interested citizenry would eventually undermine the institutions that let markets function."}, {"id": "mora10", "axis": "mora", "core": false, "effect": {"mora": 10}, "text": "Virtues like honesty and restraint are civic goods that markets depend on but don't generate on their own."}, {"id": "mora11", "axis": "mora", "core": false, "effect": {"mora": 8}, "text": "A healthy market order requires a moral culture that goes beyond simple self-interest."}, {"id": "mora12", "axis": "mora", "core": false, "effect": {"mora": 7}, "text": "Liberty without a sense of duty to others tends to hollow out the community that liberty depends on."}, {"id": "corp01", "axis": "corp", "core": true, "effect": {"corp": 10}, "text": "Large concentrations of private economic power rarely persist without abusing it, and should be broken up."}, {"id": "corp02", "axis": "corp", "core": true, "effect": {"corp": 9}, "text": "Antitrust action against dominant firms is a legitimate and often necessary use of state power."}, {"id": "corp03", "axis": "corp", "core": true, "effect": {"corp": 8}, "text": "Corporate concentration is as much a threat to a free market as government overreach is."}, {"id": "corp04", "axis": "corp", "core": false, "effect": {"corp": 10}, "text": "Big business, left unchecked, tends to entrench itself against competition rather than earn its position through it."}, {"id": "corp05", "axis": "corp", "core": false, "effect": {"corp": 8}, "text": "A market economy needs active measures against monopoly power to actually stay competitive."}, {"id": "corp06", "axis": "corp", "core": false, "effect": {"corp": 7}, "text": "Unequal concentrations of private economic power can become a form of unaccountable rule."}, {"id": "corp07", "axis": "corp", "core": true, "effect": {"corp": -10}, "text": "Market concentration achieved through genuine competitive success shouldn't be broken up by government fiat."}, {"id": "corp08", "axis": "corp", "core": true, "effect": {"corp": -9}, "text": "The size of a firm isn't itself a problem as long as it succeeded through voluntary exchange."}, {"id": "corp09", "axis": "corp", "core": true, "effect": {"corp": -8}, "text": "Antitrust intervention usually punishes efficiency and success rather than genuine abuse."}, {"id": "corp10", "axis": "corp", "core": false, "effect": {"corp": -10}, "text": "Concerns about corporate concentration are usually overstated compared to the danger of government power."}, {"id": "corp11", "axis": "corp", "core": false, "effect": {"corp": -8}, "text": "Large firms that serve customers well shouldn't be penalised just for being large."}, {"id": "corp12", "axis": "corp", "core": false, "effect": {"corp": -7}, "text": "Government intervention against big business tends to do more economic harm than the concentration it targets."}]}, "7": {"meta": {"module": 2, "bucketId": 7, "bucket": "Conservatism", "version": "0.1-draft", "questionCount": 96, "shortFormCount": 48, "scoring": {"answerScale": [{"label": "Strongly Agree", "mult": 1.0}, {"label": "Agree", "mult": 0.5}, {"label": "Neutral / Unsure", "mult": 0.0}, {"label": "Disagree", "mult": -0.5}, {"label": "Strongly Disagree", "mult": -1.0}], "formula": "raw[axis] = sum(mult * effect[axis]); max[axis] = sum(abs(effect[axis])); score[axis] = 100 * (max + raw) / (2 * max)"}, "presentation": "Stored grouped by axis for maintainability. The app must SHUFFLE at runtime with a fixed seed so consecutive items do not come from the same axis."}, "axes": [{"key": "econ", "name": "Economic Posture", "negPole": "Market Fundamentalist", "posPole": "Economic Paternalism / Social Market"}, {"key": "forp", "name": "Foreign Posture", "negPole": "Restraint / Non-Intervention", "posPole": "Global Interventionism"}, {"key": "reli", "name": "Religion in Public Life", "negPole": "Secular Civic Conservatism", "posPole": "Confessional Grounding"}, {"key": "iden", "name": "National Identity", "negPole": "Civic / Creedal Nation", "posPole": "Ethno-Cultural / Ancestral Nation"}, {"key": "chng", "name": "Disposition to Change", "negPole": "Prudential Gradualism", "posPole": "Restorationist / Roll Back"}, {"key": "stat", "name": "State Capacity", "negPole": "Minimal State", "posPole": "Strong Directive State"}, {"key": "cpol", "name": "Moral Policy Instrument", "negPole": "Persuasion & Civil Society", "posPole": "Legal Enforcement of Moral Order"}, {"key": "popu", "name": "Political Style", "negPole": "Deference to Established Elites", "posPole": "Popular Anti-Elite Mobilisation"}], "subIdeologies": [{"name": "Traditional / Burkean Conservatism", "umbrella": false, "anchor": {"econ": 55, "forp": 40, "reli": 45, "iden": 50, "chng": 5, "stat": 45, "cpol": 30, "popu": 5}}, {"name": "Paleoconservatism", "umbrella": false, "anchor": {"econ": 45, "forp": 2, "reli": 65, "iden": 88, "chng": 85, "stat": 35, "cpol": 55, "popu": 80}}, {"name": "Neoconservatism", "umbrella": false, "anchor": {"econ": 25, "forp": 99, "reli": 25, "iden": 3, "chng": 50, "stat": 70, "cpol": 35, "popu": 20}}, {"name": "Fusionism", "umbrella": false, "anchor": {"econ": 12, "forp": 65, "reli": 30, "iden": 15, "chng": 45, "stat": 15, "cpol": 15, "popu": 35}}, {"name": "One-Nation Conservatism / Toryism", "umbrella": false, "anchor": {"econ": 80, "forp": 45, "reli": 30, "iden": 35, "chng": 15, "stat": 65, "cpol": 25, "popu": 10}}, {"name": "Christian Democracy", "umbrella": false, "anchor": {"econ": 88, "forp": 45, "reli": 97, "iden": 28, "chng": 20, "stat": 66, "cpol": 45, "popu": 18}}, {"name": "National Conservatism", "umbrella": false, "anchor": {"econ": 60, "forp": 30, "reli": 55, "iden": 86, "chng": 78, "stat": 90, "cpol": 76, "popu": 94}}, {"name": "Agrarian Conservatism", "umbrella": false, "anchor": {"econ": 66, "forp": 10, "reli": 62, "iden": 70, "chng": 70, "stat": 30, "cpol": 40, "popu": 66}}, {"name": "Cultural / Social Conservatism", "umbrella": false, "anchor": {"econ": 50, "forp": 40, "reli": 86, "iden": 60, "chng": 65, "stat": 58, "cpol": 92, "popu": 60}}, {"name": "Compassionate Conservatism", "umbrella": false, "anchor": {"econ": 58, "forp": 55, "reli": 72, "iden": 18, "chng": 22, "stat": 50, "cpol": 32, "popu": 28}}, {"name": "Libertarian Conservatism", "umbrella": false, "anchor": {"econ": 2, "forp": 8, "reli": 5, "iden": 20, "chng": 45, "stat": 2, "cpol": 0, "popu": 45}}, {"name": "Communitarian Conservatism", "umbrella": false, "anchor": {"econ": 92, "forp": 22, "reli": 50, "iden": 45, "chng": 30, "stat": 58, "cpol": 30, "popu": 48}}], "questions": [{"id": "econ01", "axis": "econ", "core": true, "effect": {"econ": 10}, "text": "Government should actively shape the economy to serve the community, not just referee a free market."}, {"id": "econ02", "axis": "econ", "core": true, "effect": {"econ": 9}, "text": "A strong social safety net is compatible with, and even expresses, conservative values of care for one's own."}, {"id": "econ03", "axis": "econ", "core": true, "effect": {"econ": 8}, "text": "Protecting domestic industry and workers can justify departing from free-market orthodoxy."}, {"id": "econ04", "axis": "econ", "core": false, "effect": {"econ": 10}, "text": "The state has a legitimate role in supporting families and communities against pure market pressures."}, {"id": "econ05", "axis": "econ", "core": false, "effect": {"econ": 8}, "text": "Economic policy should serve social stability, even where that means limiting market forces."}, {"id": "econ06", "axis": "econ", "core": false, "effect": {"econ": 7}, "text": "A conservative government should be willing to intervene economically to protect its own people and institutions."}, {"id": "econ07", "axis": "econ", "core": true, "effect": {"econ": -10}, "text": "Free markets, left largely alone, are the best mechanism for producing widely shared prosperity."}, {"id": "econ08", "axis": "econ", "core": true, "effect": {"econ": -9}, "text": "Government intervention in the economy usually does more harm than the problems it's meant to fix."}, {"id": "econ09", "axis": "econ", "core": true, "effect": {"econ": -8}, "text": "Lower taxes and less regulation are generally the right conservative default."}, {"id": "econ10", "axis": "econ", "core": false, "effect": {"econ": -10}, "text": "A dynamic, competitive market economy is itself a conservative value worth protecting from state overreach."}, {"id": "econ11", "axis": "econ", "core": false, "effect": {"econ": -8}, "text": "Economic freedom and limited government go together as core conserva

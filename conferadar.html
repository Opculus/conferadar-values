rongly Disagree", "mult": -1.0}], "formula": "raw[axis] = sum(mult * effect[axis]); max[axis] = sum(abs(effect[axis])); score[axis] = 100 * (max + raw) / (2 * max)"}, "presentation": "Stored grouped by axis for maintainability. The app must SHUFFLE at runtime with a fixed seed so consecutive items do not come from the same axis."}, "axes": [{"key": "stat", "name": "State Residue", "negPole": "Zero State", "posPole": "Night-Watchman State Retained"}, {"key": "ethi", "name": "Ethical Foundation", "negPole": "Deontological Natural Rights", "posPole": "Consequentialist Efficiency"}, {"key": "land", "name": "Land & Natural Resources", "negPole": "Homesteading Absolutism", "posPole": "Land Rent Belongs to All"}, {"key": "stra", "name": "Strategy", "negPole": "Electoral / Institutional Reform", "posPole": "Counter-Economics / Exit"}, {"key": "base", "name": "Social Base Strategy", "negPole": "Universalist Individual Appeal", "posPole": "Coalition with Traditional Communities"}, {"key": "mone", "name": "Money & Finance", "negPole": "Hard Commodity Money", "posPole": "Monetary Pluralism / Crypto"}, {"key": "egoi", "name": "Moral Psychology", "negPole": "Explicit Ethical Egoism", "posPole": "Rights Plus Community Obligation"}, {"key": "ipro", "name": "Intellectual Property", "negPole": "IP Is Legitimate Property", "posPole": "IP Is an Illegitimate Monopoly"}], "subIdeologies": [{"name": "Anarcho-Capitalism (Rothbard)", "umbrella": false, "anchor": {"stat": 0, "ethi": 3, "land": 0, "stra": 45, "base": 45, "mone": 10, "egoi": 35, "ipro": 88}}, {"name": "Minarchism", "umbrella": false, "anchor": {"stat": 96, "ethi": 45, "land": 15, "stra": 15, "base": 30, "mone": 30, "egoi": 55, "ipro": 30}}, {"name": "Agorism (Konkin)", "umbrella": false, "anchor": {"stat": 3, "ethi": 15, "land": 20, "stra": 100, "base": 15, "mone": 75, "egoi": 40, "ipro": 92}}, {"name": "Paleolibertarianism", "umbrella": false, "anchor": {"stat": 30, "ethi": 20, "land": 5, "stra": 30, "base": 99, "mone": 5, "egoi": 70, "ipro": 45}}, {"name": "Geolibertarianism", "umbrella": false, "anchor": {"stat": 55, "ethi": 60, "land": 100, "stra": 20, "base": 30, "mone": 55, "egoi": 80, "ipro": 70}}, {"name": "Voluntaryism", "umbrella": false, "anchor": {"stat": 2, "ethi": 5, "land": 5, "stra": 66, "base": 25, "mone": 55, "egoi": 60, "ipro": 76}}, {"name": "Crypto- / Techno-Libertarianism", "umbrella": false, "anchor": {"stat": 8, "ethi": 72, "land": 25, "stra": 92, "base": 3, "mone": 100, "egoi": 20, "ipro": 99}}, {"name": "Objectivism (Rand)", "umbrella": false, "anchor": {"stat": 86, "ethi": 15, "land": 3, "stra": 25, "base": 5, "mone": 15, "egoi": 0, "ipro": 0}}, {"name": "Right-Libertarianism (umbrella)", "umbrella": true, "anchor": {"stat": 70, "ethi": 55, "land": 25, "stra": 5, "base": 35, "mone": 40, "egoi": 55, "ipro": 40}}], "questions": [{"id": "stat01", "axis": "stat", "core": true, "effect": {"stat": -10}, "text": "All functions currently performed by the state, including courts, police, and defence, can and should be provided by competing private firms."}, {"id": "stat02", "axis": "stat", "core": true, "effect": {"stat": -9}, "text": "The state is not a necessary institution; it is a monopoly on force that competition could replace."}, {"id": "stat03", "axis": "stat", "core": true, "effect": {"stat": -8}, "text": "Private arbitration and defence agencies would work at least as well as a state monopoly on those functions."}, {"id": "stat04", "axis": "stat", "core": false, "effect": {"stat": -10}, "text": "There is no legitimate function that requires a single coercive monopoly rather than voluntary competing providers."}, {"id": "stat05", "axis": "stat", "core": false, "effect": {"stat": -8}, "text": "A society with no state at all, only voluntary institutions, is both possible and preferable."}, {"id": "stat06", "axis": "stat", "core": false, "effect": {"stat": -7}, "text": "Even courts and law enforcement should be opened to competition rather than reserved to a single state."}, {"id": "stat07", "axis": "stat", "core": true, "effect": {"stat": 10}, "text": "A minimal state confined to defence, courts, and police is necessary and legitimate, even if nothing more is."}, {"id": "stat08", "axis": "stat", "core": true, "effect": {"stat": 9}, "text": "Some functions, like enforcement of contracts and defence, genuinely require a single legitimate authority to work."}, {"id": "stat09", "axis": "stat", "core": true, "effect": {"stat": 8}, "text": "Purely private substitutes for courts and policing would struggle to remain neutral and would likely re-create a state."}, {"id": "stat10", "axis": "stat", "core": false, "effect": {"stat": 10}, "text": "A night-watchman state is the minimum needed to prevent private force from degenerating into warlordism."}, {"id": "stat11", "axis": "stat", "core": false, "effect": {"stat": 8}, "text": "Removing the state entirely goes further than protecting liberty actually requires."}, {"id": "stat12", "axis": "stat", "core": false, "effect": {"stat": 7}, "text": "A small, constitutionally limited state is compatible with, and more stable than, having no state at all."}, {"id": "ethi01", "axis": "ethi", "core": true, "effect": {"ethi": -10}, "text": "Rights against force and fraud are absolute and cannot be traded off against other social goals."}, {"id": "ethi02", "axis": "ethi", "core": true, "effect": {"ethi": -9}, "text": "The non-aggression principle is a strict moral rule, not one consideration to weigh against others."}, {"id": "ethi03", "axis": "ethi", "core": true, "effect": {"ethi": -8}, "text": "Individual rights hold regardless of the consequences of respecting them in a given case."}, {"id": "ethi04", "axis": "ethi", "core": false, "effect": {"ethi": -10}, "text": "Violating someone's rights is wrong even if doing so would produce better aggregate outcomes."}, {"id": "ethi05", "axis": "ethi", "core": false, "effect": {"ethi": -8}, "text": "Property and contract rights are deduced from self-ownership, not justified by their social usefulness."}, {"id": "ethi06", "axis": "ethi", "core": false, "effect": {"ethi": -7}, "text": "A rights framework should never bend to utilitarian calculation of costs and benefits."}, {"id": "ethi07", "axis": "ethi", "core": true, "effect": {"ethi": 10}, "text": "Rules of property and exchange are ultimately justified by the good outcomes they produce, not by an abstract natural right."}, {"id": "ethi08", "axis": "ethi", "core": true, "effect": {"ethi": 9}, "text": "If a policy that violates strict property rights produces clearly better outcomes, that's a real point in its favour."}, {"id": "ethi09", "axis": "ethi", "core": true, "effect": {"ethi": 8}, "text": "Rights are useful conventions we adopt because they tend to work, not moral absolutes prior to consequences."}, {"id": "ethi10", "axis": "ethi", "core": false, "effect": {"ethi": 10}, "text": "Cost-benefit analysis is a legitimate way to evaluate libertarian policy, not something to be ruled out in principle."}, {"id": "ethi11", "axis": "ethi", "core": false, "effect": {"ethi": 8}, "text": "Practical outcomes should guide libertarian policy at least as much as any doctrine of natural rights."}, {"id": "ethi12", "axis": "ethi", "core": false, "effect": {"ethi": 7}, "text": "A rule of property is worth keeping only as long as it continues to produce good results."}, {"id": "land01", "axis": "land", "core": true, "effect": {"land": -10}, "text": "Whoever first mixes their labour with unowned land or resources rightfully owns them outright, with no further obligation."}, {"id": "land02", "axis": "land", "core": true, "effect": {"land": -9}, "text": "Original appropriation of land, once made, creates a full and permanent property right like any other."}, {"id": "land03", "axis": "land", "core": true, "effect": {"land": -8}, "text": "There is no residual claim the rest of society has over land once it has been justly homesteaded."}, {"id": "land04", "axis": "land", "core": false, "effect": {"land": -10}, "text": "Land should be treated exactly like any other justly acquired private property."}, {"id": "land05", "axis": "land", "core": false, "effect": {"land": -8}, "text": "Homesteading unowned resources requires no compensation to anyone else, now or in the future."}, {"id": "land06", "axis": "land", "core": false, "effect": {"land": -7}, "text": "A full, unqualified right to land follows from the same logic as a right to any other property."}, {"id": "land07", "axis": "land", "core": true, "effect": {"land": 10}, "text": "The value of land itself, as distinct from what's built on it, rightfully belongs to the community and should be taxed accordingly."}, {"id": "land08", "axis": "land", "core": true, "effect": {"land": 9}, "text": "Unimproved land value is a common inheritance that no individual can justly claim without compensating others."}, {"id": "land09", "axis": "land", "core": true, "effect": {"land": 8}, "text": "A single tax on land value, replacing other taxes, is compatible with a strongly free-market economy."}, {"id": "land10", "axis": "land", "core": false, "effect": {"land": 10}, "text": "Ownership of raw land is different in kind from ownership of what human labour produces, and should be treated differently."}, {"id": "land11", "axis": "land", "core": false, "effect": {"land": 8}, "text": "Landowners owe society compensation for the value of the land itself, apart from any improvements they've made."}, {"id": "land12", "axis": "land", "core": false, "effect": {"land": 7}, "text": "Full private ownership of land ignores that no one created the land itself."}, {"id": "stra01", "axis": "stra", "core": true, "effect": {"stra": -10}, "text": "The most effective path to a freer society is running for office and reforming the system from within."}, {"id": "stra02", "axis": "stra", "core": true, "effect": {"stra": -9}, "text": "Libertarians should build political parties and contest elections as their primary strategy."}, {"id": "stra03", "axis": "stra", "core": true, "effect": {"stra": -8}, "text": "Working through legislatures and courts is a legitimate and realistic route to reducing state power."}, {"id": "stra04", "axis": "stra", "core": false, "effect": {"stra": -10}, "text": "Electoral politics, however slow, is more likely to succeed than trying to route around the state entirely."}, {"id": "stra05", "axis": "stra", "core": false, "effect": {"stra": -8}, "text": "A libertarian movement needs to engage seriously with existing institutions to have any real influence."}, {"id": "stra06", "axis": "stra", "core": false, "effect": {"stra": -7}, "text": "Winning elections is the strategy most likely to actually roll back state power."}, {"id": "stra07", "axis": "stra", "core": true, "effect": {"stra": 10}, "text": "Building alternative institutions and markets that operate outside and beneath state control is the more effective strategy."}, {"id": "stra08", "axis": "stra", "core": true, "effect": {"stra": 9}, "text": "Voting and lobbying inside the system tend to legitimise the very state a libertarian should be trying to shrink."}, {"id": "stra09", "axis": "stra", "core": true, "effect": {"stra": 8}, "text": "Counter-economics \u2014 untaxed, unregulated exchange \u2014 does more to reduce the state's power than electoral politics does."}, {"id": "stra10", "axis": "stra", "core": false, "effect": {"stra": 10}, "text": "The state should be starved and evaded, not reformed through participation in its own institutions."}, {"id": "stra11", "axis": "stra", "core": false, "effect": {"stra": 8}, "text": "Exit and evasion of state control are more consistent libertarian strategies than working within the system."}, {"id": "stra12", "axis": "stra", "core": false, "effect": {"stra": 7}, "text": "A parallel economy operating outside state control is a more radical and effective strategy than seeking office."}, {"id": "base01", "axis": "base", "core": true, "effect": {"base": -10}, "text": "A free society should welcome anyone regardless of background who accepts its property and contract norms."}, {"id": "base02", "axis": "base", "core": true, "effect": {"base": -9}, "text": "Libertarian principles apply universally and shouldn't be tied to any particular cultural or religious community."}, {"id": "base03", "axis": "base", "core": true, "effect": {"base": -8}, "text": "Cultural and religious diversity is compatible with, and doesn't threaten, a free-market order."}, {"id": "base04", "axis": "base", "core": false, "effect": {"base": -10}, "text": "The case for liberty should be made in universal terms, not aimed at any one cultural group."}, {"id": "base05", "axis": "base", "core": false, "effect": {"base": -8}, "text": "A libertarian order has no need to privilege any particular tradition or community over others."}, {"id": "base06", "axis": "base", "core": false, "effect": {"base": -7}, "text": "Openness to newcomers, so long as they respect property and contract, strengthens rather than threatens a free society."}, {"id": "base07", "axis": "base", "core": true, "effect": {"base": 10}, "text": "A free society is more stable when built on communities that share strong cultural norms and traditions, not just abstract rules."}, {"id": "base08", "axis": "base", "core": true, "effect": {"base": 9}, "text": "Explicitly traditionalist communities are a more realistic foundation for lasting liberty than a purely universalist appeal."}, {"id": "base09", "axis": "base", "core": true, "effect": {"base": 8}, "text": "Shared culture and even exclusion by covenant can be a legitimate and effective basis for a free community."}, {"id": "base10", "axis": "base", "core": false, "effect": {"base": 10}, "text": "A coalition with traditionalist and religious conservatives serves libertarian goals better than a purely individualist appeal."}, {"id": "base11", "axis": "base", "core": false, "effect": {"base": 8}, "text": "Homogeneous, covenant-based communities may preserve liberty better than open, universalist ones."}, {"id": "base12", "axis": "base", "core": false, "effect": {"base": 7}, "text": "Cultural cohesion, not abstract universalism, is what actually sustains a free social order over time."}, {"id": "mone01", "axis": "mone", "core": true, "effect": {"mone": -10}, "text": "Money should be backed by a scarce physical commodity like gold, not issued at the discretion of any authority."}, {"id": "mone02", "axis": "mone", "core": true, "effect": {"mone": -9}, "text": "A commodity-based monetary standard prevents the kind of arbitrary inflation that discretionary money invites."}, {"id": "mone03", "axis": "mone", "core": true, "effect": {"mone": -8}, "text": "Central banks and fiat currency are a major source of economic distortion and should be abolished."}, {"id": "mone04", "axis": "mone", "core": false, "effect": {"mone": -10}, "text": "Sound money means money whose supply cannot be expanded by political decision."}, {"id": "mone05", "axis": "mone", "core": false, "effect": {"mone": -8}, "text": "A gold or similar commodity standard disciplines government spending in a way paper money cannot."}, {"id": "mone06", "axis": "mone", "core": false, "effect": {"mone": -7}, "text": "Returning to a hard, commodity-backed currency would substantially improve economic stability."}, {"id": "mone07", "axis": "mone", "core": true, "effect": {"mone": 10}, "text": "Competing private and digital currencies are a legitimate and promising alternative to any single monetary standard."}, {"id": "mone08", "axis": "mone", "core": true, "effect": {"mone": 9}, "text": "Multiple currencies competing for use, including cryptocurrencies, produce better outcomes than any single official standard."}, {"id": "mone09", "axis": "mone", "core": true, "effect": {"mone": 8}, "text": "Monetary innovation, including decentralised digital currency, is a genuine advance over traditional commodity money."}, {"id": "mone10", "axis": "mone", "core": false, "effect": {"mone": 10}, "text": "The right approach to money is letting the market choose among competing currencies, not fixing on any one standard."}, {"id": "mone11", "axis": "mone", "core": false, "effect": {"mone": 8}, "text": "Cryptographic and algorithmically governed currencies can replace the function gold once served."}, {"id": "mone12", "axis": "mone", "core": false, "effect": {"mone": 7}, "text": "A diverse, competitive monetary landscape is preferable to reinstating a single commodity standard."}, {"id": "egoi01", "axis": "egoi", "core": true, "effect": {"egoi": -10}, "text": "Rational self-interest is not just permissible but the proper and admirable guide to individual action."}, {"id": "egoi02", "axis": "egoi", "core": true, "effect": {"egoi": -9}, "text": "Altruism as a demanded duty is a corrupting, not an ennobling, moral ideal."}, {"id": "egoi03", "axis": "egoi", "core": true, "effect": {"egoi": -8}, "text": "A person owes nothing to others beyond what they voluntarily choose to give."}, {"id": "egoi04", "axis": "egoi", "core": false, "effect": {"egoi": -10}, "text": "The pursuit of one's own values and happiness is the standard by which action should be judged."}, {"id": "egoi05", "axis": "egoi", "core": false, "effect": {"egoi": -8}, "text": "Sacrifice of one's own interest for others, when not freely chosen, has no moral claim on a person."}, {"id": "egoi06", "axis": "egoi", "core": false, "effect": {"egoi": -7}, "text": "A society of consistently self-interested individuals, each respecting others' rights, is a moral achievement."}, {"id": "egoi07", "axis": "egoi", "core": true, "effect": {"egoi": 10}, "text": "Individual liberty makes the most sense within a wider framework of duty and reciprocal obligation to others."}, {"id": "egoi08", "axis": "egoi", "core": true, "effect": {"egoi": 9}, "text": "A purely self-interested ethic, taken on its own, leaves out real obligations people have toward each other."}, {"id": "egoi09", "axis": "egoi", "core": true, "effect": {"egoi": 8}, "text": "Rights have to be paired with a sense of community responsibility, not treated as licence for pure self-interest."}, {"id": "egoi10", "axis": "egoi", "core": false, "effect": {"egoi": 10}, "text": "Libertarian ethics need some account of obligation to others, not just freedom from interference."}, {"id": "egoi11", "axis": "egoi", "core": false, "effect": {"egoi": 8}, "text": "An ethic of rational self-interest alone doesn't capture everything that matters about how people should treat each other."}, {"id": "egoi12", "axis": "egoi", "core": false, "effect": {"egoi": 7}, "text": "Liberty and mutual obligation belong together; neither one alone is a sufficient moral foundation."}, {"id": "ipro01", "axis": "ipro", "core": true, "effect": {"ipro": -10}, "text": "Intellectual creations like inventions and writing are legitimate property, and the state is right to protect them."}, {"id": "ipro02", "axis": "ipro", "core": true, "effect": {"ipro": -9}, "text": "Patents and copyrights are a justified application of ordinary property rights to ideas."}, {"id": "ipro03", "axis": "ipro", "core": true, "effect": {"ipro": -8}, "text": "Without some enforceable claim to an idea's use, there's too little incentive to create it in the first place."}, {"id": "ipro04", "axis": "ipro", "core": false, "effect": {"ipro": -10}, "text": "A creator's claim over their invention or work is as legitimate as a farmer's claim over their crop."}, {"id": "ipro05", "axis": "ipro", "core": false, "effect": {"ipro": -8}, "text": "Protecting intellectual property doesn't contradict libertarian principles; it extends them to a new kind of good."}, {"id": "ipro06", "axis": "ipro", "core": false, "effect": {"ipro": -7}, "text": "Enforcing intellectual property rights is a proper, limited function even for a minimal state."}, {"id": "ipro07", "axis": "ipro", "core": true, "effect": {"ipro": 10}, "text": "Intellectual property is really a state-granted monopoly, not a legitimate property right at all."}, {"id": "ipro08", "axis": "ipro", "core": true, "effect": {"ipro": 9}, "text": "Ideas can be copied without depriving the original creator of their use, which makes them unlike ordinary property."}, {"id": "ipro09", "axis": "ipro", "core": true, "effect": {"ipro": 8}, "text": "Patent and copyright law mainly protect incumbents and restrict the free flow of information."}, {"id": "ipro10", "axis": "ipro", "core": false, "effect": {"ipro": 10}, "text": "A genuinely free market would have no enforceable claims over the copying of ideas or inventions."}, {"id": "ipro11", "axis": "ipro", "core": false, "effect": {"ipro": 8}, "text": "Abolishing intellectual property protections would increase, not reduce, real innovation and competition."}, {"id": "ipro12", "axis": "ipro", "core": false, "effect": {"ipro": 7}, "text": "Treating ideas as ownable property contradicts the same logic that makes physical property legitimate."}]}, "12": {"meta": {"module": 2, "bucketId": 12, "bucket": "Third-Worldism / National Liberation", "version": "0.1-draft", "questionCount": 96, "shortFormCount": 48, "scoring": {"answerScale": [{"label": "Strongly Agree", "mult": 1.0}, {"label": "Agree", "mult": 0.5}, {"label": "Neutral / Unsure", "mult": 0.0}, {"label": "Disagree", "mult": -0.5}, {"label": "Strongly Disagree", "mult": -1.0}], "formula": "raw[axis] = sum(mult * effect[axis]); max[axis] = sum(abs(effect[axis])); score[axis] = 100 * (max + raw) / (2 * max)"}, "presentation": "Stored grouped by axis for maintainability. The app must SHUFFLE at runtime with a fixed seed so consecutive items do not come from the same axis."}, "axes": [{"key": "marx", "name": "Theoretical Frame", "negPole": "Scientific Socialism / Class Analysis", "posPole": "Indigenous Cultural Socialism"}, {"key": "vehi", "name": "Vehicle", "negPole": "Vanguard Party & State Apparatus", "posPole": "Autonomous Communities & Movements"}, {"key": "reli", "name": "Religious Register", "negPole": "Explicitly Secular", "posPole": "Faith Integrated into Liberation"}, {"key": "scop", "name": "Scope of Solidarity", "negPole": "Single Nation / Self-Reliance", "posPole": "Pan-Regional or Global South Union"}, {"key": "alig", "name": "Cold-War Alignment", "negPole": "Soviet-Bloc Aligned", "posPole": "Strict Non-Alignment"}, {"key": "deve", "name": "Development Model", "negPole": "State-Led Heavy Industrialisation", "posPole": "Rural-Communal Self-Sufficiency"}, {"key": "plur", "name": "Political Form", "negPole": "Single-Party / Personalist Rule", "posPole": "Electoral Pluralism Accepted"}, {"key": "agen", "name": "Revolutionary Agent", "negPole": "Domestic Workers & Peasants", "posPole": "The Nation Against Imperialism"}], "subIdeologies": [{"name": "Juche / Kim Il-Sungism", "umbrella": false, "anchor": {"marx": 25, "vehi": 0, "reli": 15, "scop": 0, "alig": 35, "deve": 20, "plur": 0, "agen": 80}}, {"name": "Ba'athism", "umbrella": false, "anchor": {"marx": 55, "vehi": 2, "reli": 8, "scop": 96, "alig": 55, "deve": 5, "plur": 2, "agen": 90}}, {"name": "Nasserism", "umbrella": false, "anchor": {"marx": 72, "vehi": 14, "reli": 45, "scop": 66, "alig": 40, "deve": 12, "plur": 12, "agen": 82}}, {"name": "Bolivarianism / Chavismo", "umbrella": false, "anchor": {"marx": 40, "vehi": 35, "reli": 60, "scop": 75, "alig": 55, "deve": 25, "plur": 66, "agen": 55}}, {"name": "Sandinismo", "umbrella": false, "anchor": {"marx": 20, "vehi": 25, "reli": 66, "scop": 35, "alig": 20, "deve": 40, "plur": 60, "agen": 35}}, {"name": "Zapatismo", "umbrella": false, "anchor": {"marx": 55, "vehi": 100, "reli": 55, "scop": 35, "alig": 92, "deve": 98, "plur": 48, "agen": 24}}, {"name": "Pan-Africanism (Nkrumaism)", "umbrella": false, "anchor": {"marx": 35, "vehi": 15, "reli": 35, "scop": 96, "alig": 60, "deve": 15, "plur": 15, "agen": 70}}, {"name": "Ujamaa / African Socialism (Nyerere)", "umbrella": false, "anchor": {"marx": 86, "vehi": 15, "reli": 45, "scop": 25, "alig": 76, "deve": 97, "plur": 20, "agen": 60}}, {"name": "Negritude-Socialism (Senghor)", "umbrella": false, "anchor": {"marx": 97, "vehi": 20, "reli": 60, "scop": 76, "alig": 92, "deve": 70, "plur": 46, "agen": 80}}, {"name": "Pan-Arabism", "umbrella": true, "anchor": {"marx": 76, "vehi": 15, "reli": 30, "scop": 100, "alig": 70, "deve": 15, "plur": 15, "agen": 92}}, {"name": "Sankarism (Burkina Faso)", "umbrella": false, "anchor": {"marx": 20, "vehi": 20, "reli": 15, "scop": 30, "alig": 65, "deve": 62, "plur": 15, "agen": 34}}, {"name": "Gaddafism / Third International Theory", "umbrella": false, "anchor": {"marx": 80, "vehi": 72, "reli": 86, "scop": 86, "alig": 86, "deve": 45, "plur": 10, "agen": 76}}, {"name": "Maoist Third-Worldism", "umbrella": false, "anchor": {"marx": 0, "vehi": 20, "reli": 5, "scop": 92, "alig": 72, "deve": 55, "plur": 20, "agen": 88}}, {"name": "Non-Aligned Movement developmentalism", "umbrella": false, "anchor": {"marx": 70, "vehi": 20, "reli": 40, "scop": 88, "alig": 100, "deve": 25, "plur": 56, "agen": 92}}], "questions": [{"id": "marx01", "axis": "marx", "core": true, "effect": {"marx": -10}, "text": "Class analysis and scientific socialism remain the right framework for understanding liberation struggles."}, {"id": "marx02", "axis": "marx", "core": true, "effect": {"marx": -9}, "text": "Imperialism should be analysed primarily as a stage and structure of capitalism, in Marxist terms."}, {"id": "marx03", "axis": "marx", "core": true, "effect": {"marx": -8}, "text": "A liberation movement's programme should be grounded in a materialist analysis of class and capital."}, {"id": "marx04", "axis": "marx", "core": false, "effect": {"marx": -10}, "text": "Socialism, understood in the Marxist sense, is the proper end goal of national liberation."}, {"id": "marx05", "axis": "marx", "core": false, "effect": {"marx": -8}, "text": "The vocabulary of scientific socialism translates well enough to describe any nation's path to liberation."}, {"id": "marx06", "axis": "marx", "core": false, "effect": {"marx": -7}, "text": "A liberation movement without a class analysis of its own society will misdiagnose its real obstacles."}, {"id": "marx07", "axis": "marx", "core": true, "effect": {"marx": 10}, "text": "The nation's own cultural and communal traditions, not imported Marxist theory, are the right foundation for its socialism."}, {"id": "marx08", "axis": "marx", "core": true, "effect": {"marx": 9}, "text": "A borrowed European framework like Marxism doesn't fit the specific history and social structure of this nation."}, {"id": "marx09", "axis": "marx", "core": true, "effect": {"marx": 8}, "text": "Indigenous values of community and solidarity are a sounder basis for socialism than imported class theory."}, {"id": "marx10", "axis": "marx", "core": false, "effect": {"marx": 10}, "text": "This nation's socialism has to be built from its own traditions, not translated from foreign doctrine."}, {"id": "marx11", "axis": "marx", "core": false, "effect": {"marx": 8}, "text": "Applying Marxist categories developed for industrial Europe to this society distorts more than it explains."}, {"id": "marx12", "axis": "marx", "core": false, "effect": {"marx": 7}, "text": "The nation's own precolonial traditions of communal life are a truer foundation for its politics than any imported ideology."}, {"id": "vehi01", "axis": "vehi", "core": true, "effect": {"vehi": -10}, "text": "A disciplined vanguard party, once in power, should hold and use the state to build the new society."}, {"id": "vehi02", "axis": "vehi", "core": true, "effect": {"vehi": -9}, "text": "Building strong state institutions is the necessary vehicle for consolidating national liberation."}, {"id": "vehi03", "axis": "vehi", "core": true, "effect": {"vehi": -8}, "text": "The party-state is the legitimate instrument through which liberation is defended and carried forward."}, {"id": "vehi04", "axis": "vehi", "core": false, "effect": {"vehi": -10}, "text": "A revolutionary government needs to control the commanding heights of the state to make liberation durable."}, {"id": "vehi05", "axis": "vehi", "core": false, "effect": {"vehi": -8}, "text": "National liberation is secured through state power, not despite it."}, {"id": "vehi06", "axis": "vehi", "core": false, "effect": {"vehi": -7}, "text": "A single leading party, coordinating through the state apparatus, is the right vehicle for this nation's revolution."}, {"id": "vehi07", "axis": "vehi", "core": true, "effect": {"vehi": 10}, "text": "Autonomous communities and grassroots movements, not a party controlling the state, are where liberation actually lives."}, {"id": "vehi08", "axis": "vehi", "core": true, "effect": {"vehi": 9}, "text": "The state, even a revolutionary one, tends to become a new structure of domination over the people it claims to liberate."}, {"id": "vehi09", "axis": "vehi", "core": true, "effect": {"vehi": 8}, "text": "Liberation should be built from below, through self-governing communities, rather than delegated to a party-state."}, {"id": "vehi10", "axis": "vehi", "core": false, "effect": {"vehi": 10}, "text": "A movement that hands its power to a centralised state has already compromised its liberatory character."}, {"id": "vehi11", "axis": "vehi", "core": false, "effect": {"vehi": 8}, "text": "Autonomy and self-organisation at the local level matter more than capturing state power."}, {"id": "vehi12", "axis": "vehi", "core": false, "effect": {"vehi": 7}, "text": "Real liberation resists being absorbed into any single party or state apparatus, revolutionary or not."}, {"id": "reli01", "axis": "reli", "core": true, "effect": {"reli": -10}, "text": "Political liberation should be pursued on explicitly secular grounds, separate from religious authority."}, {"id": "reli02", "axis": "reli", "core": true, "effect": {"reli": -9}, "text": "Religious institutions should not have formal influence over a liberation movement's politics."}, {"id": "reli03", "axis": "reli", "core": true, "effect": {"reli": -8}, "text": "A secular state is the right framework for uniting a diverse population around a common liberation project."}, {"id": "reli04", "axis": "reli", "core": false, "effect": {"reli": -10}, "text": "Mixing religious authority into liberation politics risks excluding those who don't share the majority faith."}, {"id": "reli05", "axis": "reli", "core": false, "effect": {"reli": -8}, "text": "The movement's legitimacy should rest on national and social grounds, not religious ones."}, {"id": "reli06", "axis": "reli", "core": false, "effect": {"reli": -7}, "text": "Keeping religion out of formal politics helps liberation movements stay unified across religious lines."}, {"id": "reli07", "axis": "reli", "core": true, "effect": {"reli": 10}, "text": "Religious faith and identity are integral to this people's liberation and shouldn't be set aside in the name of secularism."}, {"id": "reli08", "axis": "reli", "core": true, "effect": {"reli": 9}, "text": "A liberation movement that ignores the religious convictions of its people has cut itself off from real popular support."}, {"id": "reli09", "axis": "reli", "core": true, "effect": {"reli": 8}, "text": "Faith-based solidarity is a genuine and legitimate source of strength for a liberation struggle."}, {"id": "reli10", "axis": "reli", "core": false, "effect": {"reli": 10}, "text": "This nation's liberation is inseparable from the defence and revival of its religious tradition."}, {"id": "reli11", "axis": "reli", "core": false, "effect": {"reli": 8}, "text": "Religious leaders and institutions have a legitimate place in the leadership of a liberation movement."}, {"id": "reli12", "axis": "reli", "core": false, "effect": {"reli": 7}, "text": "A purely secular liberation project would betray what actually motivates and unites this people's struggle."}, {"id": "scop01", "axis": "scop", "core": true, "effect": {"scop": -10}, "text": "Liberation should focus on building this nation's own strength and self-reliance before anything wider."}, {"id": "scop02", "axis": "scop", "core": true, "effect": {"scop": -9}, "text": "A single nation's revolution has to be consolidated on its own terms before looking outward."}, {"id": "scop03", "axis": "scop", "core": true, "effect": {"scop": -8}, "text": "Overextending into regional or pan-national projects risks weakening what's been won at home."}, {"id": "scop04", "axis": "scop", "core": false, "effect": {"scop": -10}, "text": "Self-reliance within the nation's own borders is the soundest basis for lasting liberation."}, {"id": "scop05", "axis": "scop", "core": false, "effect": {"scop": -8}, "text": "This nation's specific struggle deserves priority over broader regional or pan-ideological ambitions."}, {"id": "scop06", "axis": "scop", "core": false, "effect": {"scop": -7}, "text": "A movement should secure its own house before committing resources to liberation elsewhere."}, {"id": "scop07", "axis": "scop", "core": true, "effect": {"scop": 10}, "text": "True liberation requires uniting with other peoples across the region into a broader union or federation."}, {"id": "scop08", "axis": "scop", "core": true, "effect": {"scop": 9}, "text": "This nation's struggle is inseparable from a wider regional or civilisational liberation project."}, {"id": "scop09", "axis": "scop", "core": true, "effect": {"scop": 8}, "text": "Artificial borders drawn by colonial powers should be transcended by a larger union of peoples."}, {"id": "scop10", "axis": "scop", "core": false, "effect": {"scop": 10}, "text": "Solidarity and unification across the whole region matters more than any single nation's separate path."}, {"id": "scop11", "axis": "scop", "core": false, "effect": {"scop": 8}, "text": "This nation's liberation is only a first step toward a broader union it should actively pursue."}, {"id": "scop12", "axis": "scop", "core": false, "effect": {"scop": 7}, "text": "Pan-regional unity is not a distraction from national liberation but its necessary completion."}, {"id": "alig01", "axis": "alig", "core": true, "effect": {"alig": -10}, "text": "Practical alliance with the Soviet bloc or its successors was, and remains, a reasonable strategic choice against imperialism."}, {"id": "alig02", "axis": "alig", "core": true, "effect": {"alig": -9}, "text": "Accepting military and economic support from a socialist power was a legitimate part of the liberation struggle."}, {"id": "alig03", "axis": "alig", "core": true, "effect": {"alig": -8}, "text": "Alignment with an anti-imperialist bloc strengthens a liberation movement more than strict neutrality does."}, {"id": "alig04", "axis": "alig", "core": false, "effect": {"alig": -10}, "text": "A liberation movement facing powerful enemies is right to seek powerful allies, socialist or otherwise."}, {"id": "alig05", "axis": "alig", "core": false, "effect": {"alig": -8}, "text": "Formal alliance with a socialist power doesn't compromise a liberation movement's independence in any meaningful way."}, {"id": "alig06", "axis": "alig", "core": false, "effect": {"alig": -7}, "text": "Turning down support from a sympathetic bloc out of a principle of non-alignment would have weakened the struggle."}, {"id": "alig07", "axis": "alig", "core": true, "effect": {"alig": 10}, "text": "A liberation movement should avoid dependence on any single foreign bloc, socialist or capitalist."}, {"id": "alig08", "axis": "alig", "core": true, "effect": {"alig": 9}, "text": "Strict non-alignment protects a movement's independence better than any alliance, however sympathetic, would."}, {"id": "alig09", "axis": "alig", "core": true, "effect": {"alig": 8}, "text": "Reliance on a foreign patron, even an anti-imperialist one, tends to compromise a movement's autonomy over time."}, {"id": "alig10", "axis": "alig", "core": false, "effect": {"alig": 10}, "text": "The movement's foreign policy should be judged case by case, aligned with no permanent bloc."}, {"id": "alig11", "axis": "alig", "core": false, "effect": {"alig": 8}, "text": "Non-alignment gives a liberation movement more genuine room to manoeuvre than any fixed alliance does."}, {"id": "alig12", "axis": "alig", "core": false, "effect": {"alig": 7}, "text": "Even a sympathetic foreign patron has its own interests that can come to override the movement's own."}, {"id": "deve01", "axis": "deve", "core": true, "effect": {"deve": -10}, "text": "Rapid state-led industrialisation is the surest route out of underdevelopment and dependency."}, {"id": "deve02", "axis": "deve", "core": true, "effect": {"deve": -9}, "text": "Heavy industry, built and coordinated by the state, is the backbone of real national development."}, {"id": "deve03", "axis": "deve", "core": true, "effect": {"deve": -8}, "text": "A five-year-plan style approach to industrial development is appropriate for a newly liberated nation."}, {"id": "deve04", "axis": "deve", "core": false, "effect": {"deve": -10}, "text": "Concentrating resources on industrial capacity, even at short-term cost, pays off in long-term sovereignty."}, {"id": "deve05", "axis": "deve", "core": false, "effect": {"deve": -8}, "text": "State-directed industrial development reduces dependency on former colonial powers faster than gradual growth would."}, {"id": "deve06", "axis": "deve", "core": false, "effect": {"deve": -7}, "text": "A strong industrial base is what ultimately secures a nation's independence, not just political sovereignty."}, {"id": "deve07", "axis": "deve", "core": true, "effect": {"deve": 10}, "text": "Development should build outward from self-sufficient rural and communal life, not from forced industrialisation."}, {"id": "deve08", "axis": "deve", "core": true, "effect": {"deve": 9}, "text": "Village-level self-sufficiency is a sounder development model for this nation than heavy industrial planning."}, {"id": "deve09", "axis": "deve", "core": true, "effect": {"deve": 8}, "text": "Rushing toward industrialisation risks uprooting the communal structures the nation's strength actually rests on."}, {"id": "deve10", "axis": "deve", "core": false, "effect": {"deve": 10}, "text": "A development model rooted in rural cooperation fits this nation's conditions better than an imported industrial model."}, {"id": "deve11", "axis": "deve", "core": false, "effect": {"deve": 8}, "text": "Strengthening local, communal production is more sustainable than concentrating on industrial mega-projects."}, {"id": "deve12", "axis": "deve", "core": false, "effect": {"deve": 7}, "text": "This nation's own agrarian and communal traditions offer a better development path than state-led industrialisation."}, {"id": "plur01", "axis": "plur", "core": true, "effect": {"plur": -10}, "text": "A single party, or a strong personalist leader, is necessary to hold the nation together through the liberation struggle and after it."}, {"id": "plur02", "axis": "plur", "core": true, "effect": {"plur": -9}, "text": "Multi-party competition, introduced too soon, risks fracturing a fragile post-liberation state along old colonial or ethnic lines."}, {"id": "plur03", "axis": "plur", "core": true, "effect": {"plur": -8}, "text": "Unified leadership under one party or leader is what has actually delivered liberation in practice."}, {"id": "plur04", "axis": "plur", "core": false, "effect": {"plur": -10}, "text": "The urgency of consolidating liberation justifies concentrating political authority for a time."}, {"id": "plur05", "axis": "plur", "core": false, "effect": {"plur": -8}, "text": "Factional political competition is a luxury a newly liberated nation often cannot yet afford."}, {"id": "plur06", "axis": "plur", "core": false, "effect": {"plur": -7}, "text": "A movement that fragments into competing parties too early tends to lose what it fought to win."}, {"id": "plur07", "axis": "plur", "core": true, "effect": {"plur": 10}, "text": "Multi-party democracy and open political competition should be established as soon as liberation is achieved."}, {"id": "plur08", "axis": "plur", "core": true, "effect": {"plur": 9}, "text": "Concentrating power in one party or leader, even temporarily, tends to become permanent and should be avoided."}, {"id": "plur09", "axis": "plur", "core": true, "effect": {"plur": 8}, "text": "Genuine liberation includes the right of the people to remove their own leaders through open competition."}, {"id": "plur10", "axis": "plur", "core": false, "effect": {"plur": 10}, "text": "A liberation movement should commit to pluralism as a core value, not a postponable luxury."}, {"id": "plur11", "axis": "plur", "core": false, "effect": {"plur": 8}, "text": "Political competition after liberation is a source of legitimacy and correction, not a threat to be managed."}, {"id": "plur12", "axis": "plur", "core": false, "effect": {"plur": 7}, "text": "Personalist or single-party rule, whatever its justification, tends to outlive the emergency that supposedly required it."}, {"id": "agen01", "axis": "agen", "core": true, "effect": {"agen": -10}, "text": "This nation's own workers and peasants, organised around their material interests, are the true agents of liberation."}, {"id": "agen02", "axis": "agen", "core": true, "effect": {"agen": -9}, "text": "Liberation has to serve the concrete interests of ordinary working people, not just national sovereignty in the abstract."}, {"id": "agen03", "axis": "agen", "core": true, "effect": {"agen": -8}, "text": "Class interest within the nation shapes who actually benefits from liberation and who leads it."}, {"id": "agen04", "axis": "agen", "core": false, "effect": {"agen": -10}, "text": "A liberation movement that ignores internal class inequality has left its work half done."}, {"id": "agen05", "axis": "agen", "core": false, "effect": {"agen": -8}, "text": "The struggle against internal exploitation is as central to liberation as the struggle against foreign domination."}, {"id": "agen06", "axis": "agen", "core": false, "effect": {"agen": -7}, "text": "Domestic elites who exploit their own people are as much an obstacle to liberation as any foreign power."}, {"id": "agen07", "axis": "agen", "core": true, "effect": {"agen": 10}, "text": "The nation as a whole, uniting across classes against a common external enemy, is the true agent of liberation."}, {"id": "agen08", "axis": "agen", "core": true, "effect": {"agen": 9}, "text": "Internal class conflict should be set aside while the more urgent struggle against imperialism is fought."}, {"id": "agen09", "axis": "agen", "core": true, "effect": {"agen": 8}, "text": "Liberation is first and foremost a national project, not a class one."}, {"id": "agen10", "axis": "agen", "core": false, "effect": {"agen": 10}, "text": "Emphasising class divisions within the nation weakens the unity liberation actually requires."}, {"id": "agen11", "axis": "agen", "core": false, "effect": {"agen": 8}, "text": "The colonising or imperial power, not any internal class, is the movement's primary target."}, {"id": "agen12", "axis": "agen", "core": false, "effect": {"agen": 7}, "text": "National unity against a common external enemy matters more right now than resolving internal class conflict."}]}, "13": {"meta": {"module": 2, "bucketId": 13, "bucket": "Neo-Eurasianism / Traditionalism", "version": "0.1-draft", "questionCount": 96, "shortFormCount": 48, "scoring": {"answerScale": [{"label": "Strongly Agree", "mult": 1.0}, {"label": "Agree", "mult": 0.5}, {"label": "Neutral / Unsure", "mult": 0.0}, {"label": "Disagree", "mult": -0.5}, {"label": "Strongly Disagree", "mult": -1.0}], "formula": "raw[axis] = sum(mult * effect[axis]); max[axis] = sum(abs(effect[axis])); score[axis] = 100 * (max + raw) / (2 * max)"}, "presentation": "Stored grouped by axis for maintainability. The app must SHUFFLE at runtime with a fixed seed so consecutive items do not come from the same axis."}, "axes": [{"key": "meta", "name": "Metaphysical Ground", "negPole": "Secular / Materialist Analysis", "posPole": "Sacred Metaphysics & Cyclical Tim // -------------------------------------------------------------- PRNG/shuffle
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function seededShuffle(arr, seed) {
  const rng = mulberry32(seed);
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// sessionStorage throws SecurityError outright in a partitioned/sandboxed frame

// shuffle stability across a mid-quiz refresh; it must never block the app.
const memSeeds = {};
function getSeed(key) {
  try {
    const stored = sessionStorage.getItem(key);
    if (stored) return parseInt(stored, 10);
  } catch (e) { /* storage blocked — fall through to in-memory */ }
  if (memSeeds[key] != null) return memSeeds[key];
  const seed = crypto.getRandomValues(new Uint32Array(1))[0];
  memSeeds[key] = seed;
  try { sessionStorage.setItem(key, String(seed)); } catch (e) { /* ditto */ }
  return seed;
}
function clearSeeds() {
  for (const k in memSeeds) delete memSeeds[k];
  try { sessionStorage.clear(); } catch (e) { /* storage blocked */ }
}

  try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(p)); } catch (e) { /* storage blocked */ }
}
function clearProgress() {
  try { localStorage.removeItem(PROGRESS_KEY); } catch (e) { /* storage blocked */ }
}
function loadRawProgress() {
  try {
    const raw = localStorage.getItem(PROGRESS_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

// Re-derives order1/order2 from the saved seeds and checks every saved
// answer id still exists in the current question set, so stale progress from
// a previous build (questions added/removed/reworded) is dropped rather than
// resumed into a broken state.
function validateProgress(p, data) {
  if (!p || p.v !== PROGRESS_VERSION) return null;
  if (p.form !== 'full' && p.form !== 'short') return null;
  if (!['quiz1', 'transition', 'quiz2'].includes(p.screen)) return null;

  const m1q = questionsForForm(data.module1.questions, p.form);
  const order1 = seededShuffle(m1q, p.seed1);
  const ids1 = new Set(order1.map(q => q.id));
  if (!Object.keys(p.answers1 || {}).every(id => ids1.has(id))) return null;

  if (p.screen === 'quiz1') {
    if (!Number.isInteger(p.idx1) || p.idx1 < 0 || p.idx1 >= order1.length) return null;
    return { ...p, order1 };
  }

  const bucketData = data.module2.buckets[p.bucketId];
  if (!bucketData || !p.m1scores) return null;
  if (p.screen === 'transition') return { ...p, order1 };

  const m2q = questionsForForm(bucketData.questions, p.form);
  const order2 = seededShuffle(m2q, p.seed2);
  const ids2 = new Set(order2.map(q => q.id));
  if (!Object.keys(p.answers2 || {}).every(id => ids2.has(id))) return null;
  if (!Number.isInteger(p.idx2) || p.idx2 < 0 || p.idx2 >= order2.length) return null;
  return { ...p, order1, order2 };
}

function resumeProgress() {
  const p = state.resumable;
  if (!p) return;
  state.form = p.form;
  state.seed1 = p.seed1;
  state.order1 = p.order1;
  state.answers1 = p.answers1 || {};

  if (p.screen === 'quiz1') {
    state.idx = p.idx1;
    state.screen = 'quiz1';
    render();
    return;
  }

  state.m1scores = p.m1scores;
  state.culturalScore = p.culturalScore;
  state.routing = routeModule1(p.m1scores, state.data.module1.buckets);
  state.bucketId = p.bucketId;

  if (p.screen === 'transition') {
    state.screen = 'transition';
    render();
    return;
  }

  state.seed2 = p.seed2;
  state.order2 = p.order2;
  state.answers2 = p.answers2 || {};
  state.idx = p.idx2;
  state.screen = 'quiz2';
  render();
}

// ------------------------------------------------------------------ scoring
function scoreAxes(questions, answers) {
  const acc = {};
  for (const q of questions) {
    const ax = q.axis;
    const eff = q.effect[ax];
    if (!acc[ax]) acc[ax] = { raw: 0, max: 0 };
    const mult = answers[q.id] ?? 0;
    acc[ax].raw += mult * eff;
    acc[ax].max += Math.abs(eff);
  }
  const out = {};
  for (const ax in acc) out[ax] = 100 * (acc[ax].max + acc[ax].raw) / (2 * acc[ax].max);
  return out;
}

function dist(a, b, keys) {
  let s = 0;
  for (const k of keys) { const d = a[k] - b[k]; s += d * d; }
  return Math.sqrt(s);
}

function routeModule1(scores, buckets) {
  const keys = ['econ', 'auth', 'soli', 'chng', 'legi', 'impe'];
  const maxD = Math.sqrt(keys.length * 100 ** 2);
  const ranked = buckets
    .map(b => ({ id: b.id, name: b.name, d: dist(scores, b.anchor, keys) }))
    .sort((a, b) => a.d - b.d)
    .map(r => ({ ...r, matchPercent: 100 * (1 - r.d / maxD) }));
  return ranked;
}

function resolveModule2Label(scores, subIdeologies, axisKeys) {
  const maxD = Math.sqrt(axisKeys.length * 100 ** 2);
  const ranked = subIdeologies
    .map(s => ({ ...s, d: dist(scores, s.anchor, axisKeys) }))
    .sort((a, b) => a.d - b.d)
    .map(r => ({ ...r, matchPercent: 100 * (1 - r.d / maxD) }));

  let primary = ranked[0];
  if (primary.umbrella) {
    const nonUmbrella = ranked.find(s => !s.umbrella);
    if (nonUmbrella && (primary.matchPercent - nonUmbrella.matchPercent) <= LABEL_THRESHOLD) {
      primary = nonUmbrella;
    }
  }
  const secondary = ranked.find(s => s.name !== primary.name);
  let label = primary.name;
  let compound = false;
  if (secondary && (primary.matchPercent - secondary.matchPercent) <= LABEL_THRESHOLD) {
    label = `${primary.name}, ${secondary.name} Lean`;
    compound = true;
  }
  return { ranked, primary, secondary, label, compound };
}

// ------------------------------------------------------------ URL encoding
// A result is fully reconstructible from three things: which bucket ran, the 7
// Module 1 axis scores, and the bucket's 8 Module 2 axis scores. Routing and the
// tendency label are recomputed from those on load, so the link carries no
// answers and stays short. Fixed-width base36 fields keep parsing trivial.
// The payload is positional: fields are written in bucketData.axes order with no
// checksum. BUMP THIS whenever any bucket's axes are added, removed, renamed or
// reordered — otherwise old links decode to wrong scores on the wrong axes and
// render a plausible-looking but incorrect result with no error.
const RESULT_VERSION = '1';
const M1_ORDER = ['econ', 'auth', 'soli', 'chng', 'legi', 'impe', 'cult'];

function enc3(v) {
  const n = Math.max(0, Math.min(1000, Math.round(v * 10)));
  return n.toString(36).padStart(3, '0');
}
function dec3(s) {
  const n = parseInt(s, 36);
  return Number.isFinite(n) ? Math.max(0, Math.min(100, n / 10)) : NaN;
}

function encodeResult() {
  const axes = state.data.module2.buckets[state.bucketId].axes;
  return RESULT_VERSION
    + state.bucketId.toString(36).padStart(2, '0')
    + (state.form === 'short' ? 's' : 'f')
    + M1_ORDER.map(k => enc3(state.m1scores[k] ?? 50)).join('')
    + axes.map(a => enc3(state.m2.scores[a.key] ?? 50)).join('');
}

// Returns true if the payload was valid and state was populated.
function decodeResult(payload) {
  if (!payload || payload[0] !== RESULT_VERSION) return false;
  const bucketId = parseInt(payload.slice(1, 3), 36);
  const bucketData = state.data.module2.buckets[bucketId];
  if (!bucketData) return false;
  const form = payload[3] === 's' ? 'short' : 'full';
  const body = payload.slice(4);
  const expected = (M1_ORDER.length + bucketData.axes.length) * 3;
  if (body.length !== expected) return false;

  const m1scores = {};
  M1_ORDER.forEach((k, i) => { m1scores[k] = dec3(body.substr(i * 3, 3)); });
  const m2scores = {};
  const offset = M1_ORDER.length * 3;
  bucketData.axes.forEach((a, i) => { m2scores[a.key] = dec3(body.substr(offset + i * 3, 3)); });
  const all = [...Object.values(m1scores), ...Object.values(m2scores)];
  if (all.some(v => !Number.isFinite(v))) return false;

  const axisKeys = bucketData.axes.map(a => a.key);
  state.form = form;
  state.bucketId = bucketId;
  state.m1scores = m1scores;
  state.culturalScore = m1scores.cult;
  state.routing = routeModule1(m1scores, state.data.module1.buckets);
  state.m2 = {
    scores: m2scores,
    axes: bucketData.axes,
    ...resolveModule2Label(m2scores, bucketData.subIdeologies, axisKeys),
  };
  state.fromLink = true;
  return true;
}

let suppressHashChange = false;
function writeResultHash() {
  suppressHashChange = true;
  // never let a restricted-navigation frame stop the results from rendering
  try { location.hash = 'r=' + encodeResult(); } catch (e) { /* no shareable URL */ }
  setTimeout(() => { suppressHashChange = false; }, 0);
}
function clearResultHash() {
  suppressHashChange = true;
  if (location.hash) {
    // replaceState is restricted in sandboxed frames; blanking the hash is a
    // lesser fallback (leaves a history entry) but must not abort the retake.
    try {
      history.replaceState(null, '', location.pathname + location.search);
    } catch (e) {
      location.hash = '';
    }
  }
  setTimeout(() => { suppressHashChange = false; }, 0);
}
function hashPayload() {
  const m = /^#r=([0-9a-z]+)$/i.exec(location.hash || '');
  return m ? m[1] : null;
}

// -------------------------------------------------------------------- state
const state = {
  screen: 'intro',
  form: 'full', // 'full' | 'short'
  data: null,
  order1: [],
  order2: [],
  idx: 0,
  answers1: {},
  answers2: {},
  seed1: null,
  seed2: null,
  resumable: null, // validated save/resume snapshot offered on the intro screen
  bucketId: null,
  routing: null,
  m1scores: null,
  culturalScore: 50,
  m2: null,
  fromLink: false,
  accuracyRating: '',
  selfId: '',
  submitStatus: 'idle', // 'idle' | 'sending' | 'sent' | 'error'
};

const root = document.getElementById('app');

function questionsForForm(all, form) {
  return form === 'short' ? all.filter(q => q.core) : all;
}

// ------------------------------------------------------------------ render
function render() {
  if (state.screen === 'quiz1' || state.screen === 'transition' || state.screen === 'quiz2') {
    saveProgress();
  } else if (state.screen === 'results' && !state.fromLink) {
    // a freshly-finished run — nothing left to resume
    clearProgress();
  }
  root.innerHTML = '';
  if (state.screen === 'intro') return renderIntro();
  if (state.screen === 'quiz1') return renderQuiz(1);
  if (state.screen === 'transition') return renderTransition();
  if (state.screen === 'quiz2') return renderQuiz(2);
  if (state.screen === 'results') return renderResults();
}

function el(tag, attrs = {}, children = []) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    // null/false must mean "omit": setAttribute('disabled', null) stringifies to
    // "null", which is a *present* boolean attribute and silently disables it.
    else if (v != null && v !== false) e.setAttribute(k, v);
  }
  for (const c of [].concat(children)) if (c) e.appendChild(c);
  return e;
}
const text = (tag, cls, str) => el(tag, { class: cls }, [document.createTextNode(str)]);

function siteFooter() {
  return el('div', { class: 'site-footer' }, [
    document.createTextNode('Discussion & feedback — '),
    el('a', {
      href: 'https://discord.gg/Ct5aNegdun',
      target: '_blank',
      rel: 'noopener noreferrer',
    }, document.createTextNode('join the Discord ↗')),
  ]);
}

function buildSubmissionPayload() {
  const family = state.routing.find(r => r.id === state.bucketId) || state.routing[0];
  return {
    form: state.form,
    m1: {
      bucket: family.name,
      axes: state.m1scores,
      matchPercent: family.matchPercent,
    },
    m2: {
      bucketId: state.bucketId,
      label: state.m2.label,
      primary: state.m2.primary.name,
      secondary: state.m2.secondary ? state.m2.secondary.name : '',
      matchPercent: state.m2.primary.matchPercent,
    },
    culturalScore: state.culturalScore,
    accuracyRating: state.accuracyRating,
    // free text is the whole point (self-reported ideology to compare against
    // the routed label) but still capped — this is a public unauthenticated
    // endpoint and the field must not become a place to paste arbitrary text.
    selfId: state.selfId.slice(0, 300),
  };
}

// Shown only on a respondent's own freshly-taken result (never on a shared
// link someone else is viewing) and only once an endpoint is deployed.
function renderValidation() {
  const box = el('div', { class: 'validate-box' });
  box.appendChild(text('div', 'section-title', 'HELP CALIBRATE THIS TEST'));

  if (state.submitStatus === 'sent') {
    box.appendChild(text('p', 'note', 'Thanks — your anonymized result was submitted.'));
    return box;
  }

  box.appendChild(text('p', 'note',
    'Optional and anonymous. Submitting sends only the scores and label shown ' +
    'above, plus whatever you answer below — no individual question answers, ' +
    'no identifying info.'));

  const ratingRow = el('div', { class: 'rating-row' });
  for (const r of ['Spot on', 'Close', 'Off', 'Way off']) {
    ratingRow.appendChild(el('button', {
      class: 'rating-btn' + (state.accuracyRating === r ? ' active' : ''),
      onclick: () => { state.accuracyRating = r; render(); },
    }, text('span', '', r)));
  }
  box.appendChild(ratingRow);

  const selfIdInput = el('input', {
    class: 'share-fallback',
    placeholder: 'If different, what do you actually identify as? (optional)',
    value: state.selfId,
  });
  // deliberately no render() here — a full re-render on every keystroke would
  // blow away focus and cursor position in this input
  selfIdInput.addEventListener('input', e => { state.selfId = e.target.value; });
  box.appendChild(selfIdInput);

  const submitBtn = el('button', {
    class: 'begin-btn compact',
    disabled: state.submitStatus === 'sending' ? 'disabled' : null,
  }, text('span', '', state.submitStatus === 'error' ? 'RETRY SUBMIT' : '📤 SUBMIT ANONYMIZED RESULT'));
  submitBtn.addEventListener('click', async () => {
    state.submitStatus = 'sending';
    render();
    try {
      // no-cors: Apps Script web apps don't send CORS headers a browser will
      // accept, so the response is opaque and unreadable either way — the
      // POST still reaches the server and appends the row. text/plain avoids
      // a preflight OPTIONS request, which Apps Script doesn't implement.
      await fetch(SUBMIT_ENDPOINT, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(buildSubmissionPayload()),
      });
      state.submitStatus = 'sent';
    } catch (e) {
      state.submitStatus = 'error';
    }
    render();
  });
  box.appendChild(submitBtn);
  if (state.submitStatus === 'error') {
    box.appendChild(text('p', 'note', 'Submission failed — check your connection and try again.'));
  }

  return box;
}

function beginModule1() {

  state.seed1 = seed;
  state.order1 = seededShuffle(q, seed);
  state.idx = 0;
  state.answers1 = {};
  state.screen = 'quiz1';
  render();
}

function renderQuiz(moduleNum) {
  const order = moduleNum === 1 ? state.order1 : state.order2;
  const answers = moduleNum === 1 ? state.answers1 : state.answers2;
  const q = order[state.idx];
  const pct = Math.round((state.idx / order.length) * 100);

  const wrap = el('div', { class: 'sheet quiz' });
  wrap.appendChild(el('div', { class: 'progress-track' }, [
    el('div', { class: 'progress-fill', style: `width:${pct}%` }),
  ]));
  wrap.appendChild(text('div', 'progress-label',
    `MODULE ${moduleNum} — ITEM ${state.idx + 1} OF ${order.length}`));

  wrap.appendChild(text('p', 'question-text', q.text));

  const opts = el('div', { class: 'options' });
  for (const opt of ANSWER_SCALE) {
    const selected = answers[q.id] === opt.mult;
    opts.appendChild(el('button', {
      class: 'opt-btn' + (selected ? ' selected' : ''),
      onclick: () => {
        answers[q.id] = opt.mult;

  }, text('span', '', '← BACK'));

  wrap.appendChild(nav);

  root.appendChild(wrap);
}

function advance(moduleNum) {
  const order = moduleNum === 1 ? state.order1 : state.order2;
  if (state.idx < order.length - 1) {
    state.idx++;
    render();
  } else if (moduleNum === 1) {
    finishModule1();
  } else {
    finishModule2();
  }
}

function finishModule1() {
  // MUST be the form-filtered set, not all 94. scoreAxes treats a missing
  // answer as 0 in the numerator but still counts its weight in the
  // denominator, so scoring the short form against every question drags each
  // axis toward 50 by the fraction of items that form never asked (~0.53-0.64
  // per axis). That compression collapsed the whole moderate-left region onto
  // the Social Democracy anchor.
  const asked = questionsForForm(state.data.module1.questions, state.form);
  const scores = scoreAxes(asked, state.answers1);
  state.m1scores = scores;
  state.culturalScore = scores.cult ?? 50;
  state.routing = routeModule1(scores, state.data.module1.buckets);
  state.bucketId = state.routing[0].id;
  state.screen = 'transition';
  render();
}

function beginModule2() {

function finishModule2() {
  const bucketData = state.data.module2.buckets[state.bucketId];
  // form-filtered for the same reason as finishModule1()
  const scores = scoreAxes(questionsForForm(bucketData.questions, state.form), state.answers2);
  const axisKeys = bucketData.axes.map(a => a.key);
  const resolved = resolveModule2Label(scores, bucketData.subIdeologies, axisKeys);
  state.m2 = { scores, axes: bucketData.axes, ...resolved };
  state.fromLink = false;
  state.screen = 'results';
  writeResultHash();
  render();
}

// -------------------------------------------------------------- radar chart
// An axis score of 0 means "hard toward negPole", 100 means "hard toward posPole",
// 50 means "no commitment either way". Plotting the raw 0-100 as the spoke radius
// would draw a hard negPole conviction as a SHORT spoke, which reads as "weak on
// this" — the opposite of the truth. So the spoke radius is the STRENGTH of the
// lean, and the vertex is labelled with the pole actually landed on. Long spoke =
// strongly held, always; the label says which side.
const BALANCED_BAND = 4; // within this many points of 50, call it uncommitted

function leaning(axis, score) {
  if (Math.abs(score - 50) < BALANCED_BAND) {
    return { pole: 'No firm position', strength: 0, balanced: true };
  }
  return score >= 50
    ? { pole: axis.posPole, strength: (score - 50) * 2, balanced: false }
    : { pole: axis.negPole, strength: (50 - score) * 2, balanced: false };
}

function wrapWords(str, maxChars) {
  const lines = [];
  let cur = '';
  for (const word of str.split(/\s+/)) {
    if (!cur) cur = word;
    else if ((cur + ' ' + word).length <= maxChars) cur += ' ' + word;
    else { lines.push(cur); cur = word; }
  }
  if (cur) lines.push(cur);
  return lines;
}

function buildRadar(axes, scores) {
  const n = axes.length;
  const R = 118, pad = 132; // pad: room for the pole labels sitting outside the ring
  const w = 2 * (R + pad), h = 2 * (R + pad), cx = w / 2, cy = h / 2;
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  svg.setAttribute('class', 'radar-svg');

  const angleFor = i => -Math.PI / 2 + (i * 2 * Math.PI) / n;
  const pt = (i, r) => [cx + r * Math.cos(angleFor(i)), cy + r * Math.sin(angleFor(i))];
  const mk = (tag, attrs) => {
    const e = document.createElementNS(ns, tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    return e;
  };

  for (const frac of [0.25, 0.5, 0.75, 1]) {
    svg.appendChild(mk('polygon', {
      points: axes.map((_, i) => pt(i, R * frac).join(',')).join(' '),
      class: 'radar-ring',
    }));
  }

  axes.forEach((ax, i) => {
    const [x, y] = pt(i, R);
    svg.appendChild(mk('line', { x1: cx, y1: cy, x2: x, y2: y, class: 'radar-spoke' }));

    const lean = leaning(ax, scores[ax.key]);
    const [lx, ly] = pt(i, R + 14);
    const onSide = Math.abs(lx - cx) > 4;
    const anchor = !onSide ? 'middle' : lx > cx ? 'start' : 'end';
    const lines = wrapWords(lean.pole, onSide ? 17 : 22);
    const lh = 11.5;

    // grow the text block away from the centre so it never overlaps the ring
    let startY;
    if (!onSide) startY = ly < cy ? ly - (lines.length - 1) * lh - 2 : ly + 9;
    else startY = ly - ((lines.length - 1) * lh) / 2 + 3;

    const label = mk('text', {
      x: lx, y: startY, class: 'radar-pole-label' + (lean.balanced ? ' muted' : ''),
      'text-anchor': anchor,
    });
    lines.forEach((ln, k) => {
      const ts = mk('tspan', { x: lx, y: startY + k * lh });
      ts.textContent = ln;
      label.appendChild(ts);
    });
    svg.appendChild(label);
  });

  const radiusFor = ax => (R * leaning(ax, scores[ax.key]).strength) / 100;
  svg.appendChild(mk('polygon', {
    points: axes.map((ax, i) => pt(i, radiusFor(ax)).join(',')).join(' '),
    class: 'radar-data',
  }));
  axes.forEach((ax, i) => {
    const [x, y] = pt(i, radiusFor(ax));
    svg.appendChild(mk('circle', { cx: x, cy: y, r: 3.5, class: 'radar-dot' }));
  });
  return svg;
}

function axisBar(axis, value) {
  const row = el('div', { class: 'axis-bar-row' });
  row.appendChild(text('span', 'pole pole-neg', axis.negPole));
  const track = el('div', { class: 'axis-track' });
  track.appendChild(el('div', { class: 'axis-marker', style: `left:${value}%` }));
  row.appendChild(track);
  row.appendChild(text('span', 'pole pole-pos', axis.posPole));
  row.appendChild(text('span', 'axis-value', value.toFixed(0)));
  return row;
}

function matchList(rows, limit) {
  const list = el('div', { class: 'match-list' });
  for (const r of rows.slice(0, limit)) {
    list.appendChild(el('div', { class: 'match-row' }, [
      text('span', 'match-name', r.name),
      text('span', 'match-pct', `${r.matchPercent.toFixed(1)}%`),
    ]));
  }
  return list;
}

// ------------------------------------------------------------- share card
// A downloadable PNG for manual sharing (Discord, Twitter, etc), NOT a
// crawler-fetched og:image — the result payload lives in location.hash, and
// URL fragments never reach a server, so a link-preview bot can never see it.
// Drawn with 2D canvas primitives rather than serializing the results radar
// <svg>: that SVG is styled entirely by CSS classes (radar-ring, radar-data,
// ...), which do not travel when cloned into an off-DOM canvas — it would
// rasterize blank.
function drawRadarOnCanvas(ctx, axes, scores, cx, cy, R) {
  const n = axes.length;
  const angleFor = i => -Math.PI / 2 + (i * 2 * Math.PI) / n;

  ctx.strokeStyle = 'rgba(217,201,163,0.25)';
  ctx.lineWidth = 1;
  for (const frac of [0.25, 0.5, 0.75, 1]) {
    ctx.beginPath();
    axes.forEach((_, i) => {
      const a = angleFor(i);
      const x = cx + R * frac * Math.cos(a), y = cy + R * frac * Math.sin(a);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.closePath();
    ctx.stroke();
  }

  ctx.fillStyle = '#d9c9a3';
  ctx.font = '12px Georgia, serif';
  axes.forEach((ax, i) => {
    const a = angleFor(i);
    const x = cx + R * Math.cos(a), y = cy + R * Math.sin(a);
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(x, y); ctx.stroke();
    const lx = cx + (R + 16) * Math.cos(a), ly = cy + (R + 16) * Math.sin(a);
    ctx.textAlign = Math.abs(lx - cx) < 4 ? 'center' : (lx > cx ? 'left' : 'right');
    ctx.textBaseline = ly < cy ? 'bottom' : 'top';
    ctx.fillText(ax.name, lx, ly);
  });

  const radiusFor = ax => (R * leaning(ax, scores[ax.key]).strength) / 100;
  ctx.beginPath();
  axes.forEach((ax, i) => {
    const a = angleFor(i), r = radiusFor(ax);
    const x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.closePath();
  ctx.fillStyle = 'rgba(140,31,31,0.35)';
  ctx.fill();
  ctx.strokeStyle = '#8c1f1f';
  ctx.lineWidth = 2;
  ctx.stroke();
}

function buildShareCardCanvas() {
  const W = 1200, H = 630;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  const family = state.routing.find(r => r.id === state.bucketId) || state.routing[0];

  ctx.fillStyle = '#1c2a44';
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#8c1f1f';
  ctx.lineWidth = 6;
  ctx.strokeRect(3, 3, W - 6, H - 6);

  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#a89873';
  ctx.font = 'bold 22px Georgia, serif';
  ctx.fillText('CONFERADAR VALUES — CASE FILE', 48, 64);

  ctx.fillStyle = '#d9c9a3';
  ctx.font = 'bold 46px Georgia, serif';
  ctx.fillText(family.name, 48, 130);

  ctx.fillStyle = '#c2492a';
  ctx.font = '26px Georgia, serif';
  wrapWords(state.m2.label, 34).slice(0, 2).forEach((line, i) => {
    ctx.fillText(line, 48, 168 + i * 32);
  });

  ctx.fillStyle = '#d9c9a3';
  ctx.font = '19px Georgia, serif';
  ctx.fillText(
    `${family.matchPercent.toFixed(0)}% family match · ${state.m2.primary.matchPercent.toFixed(0)}% tendency match`,
    48, 240);

  drawRadarOnCanvas(ctx, state.m2.axes, state.m2.scores, 860, 360, 190);

  ctx.fillStyle = '#a89873';
  ctx.font = '15px Georgia, serif';
  ctx.fillText('conferadar values — take the test yourself', 48, H - 36);

  return canvas;
}

function renderResults() {
  const wrap = el('div', { class: 'sheet results' });
  wrap.appendChild(el('div', { class: 'stamp verdict-stamp' }, text('span', '', 'VERDICT')));

  // read the family off the bucket Module 2 actually ran, not just routing[0]
  const family = state.routing.find(r => r.id === state.bucketId) || state.routing[0];

  const head = el('div', { class: 'verdict-head' });
  head.appendChild(text('div', 'dossier-label', 'CASE FILE — FINAL ASSESSMENT'));
  head.appendChild(text('h1', 'bucket-name', family.name));
  head.appendChild(text('h2', 'flavor-label', state.m2.label));
  head.appendChild(text('div', 'headline-match',
    `${family.matchPercent.toFixed(0)}% family match · ` +
    `${state.m2.primary.matchPercent.toFixed(0)}% tendency match`));
  wrap.appendChild(head);
  wrap.appendChild(el('hr', { class: 'rule' }));

  const grid = el('div', { class: 'results-grid' });

  const left = el('div', { class: 'results-left' });
  left.appendChild(el('div', { class: 'radar-wrap' }, buildRadar(state.m2.axes, state.m2.scores)));
  left.appendChild(text('div', 'radar-legend',
    'Each spoke is named for the side you actually came down on. Distance from the centre = how strongly you held it.'));
  grid.appendChild(left);

  const right = el('div', { class: 'results-right' });
  right.appendChild(text('div', 'section-title', 'CULTURAL ORIENTATION'));
  const cultRow = el('div', { class: 'axis-bar-row cultural' });
  cultRow.appendChild(text('span', 'pole pole-neg', 'Traditionalist'));
  const cultTrack = el('div', { class: 'axis-track' });
  cultTrack.appendChild(el('div', { class: 'axis-marker', style: `left:${state.culturalScore}%` }));
  cultRow.appendChild(cultTrack);
  cultRow.appendChild(text('span', 'pole pole-pos', 'Progressive'));
  cultRow.appendChild(text('span', 'axis-value', state.culturalScore.toFixed(0)));
  right.appendChild(cultRow);
  right.appendChild(text('div', 'note', 'Measured separately — never affects which family you were routed into.'));

  right.appendChild(text('div', 'section-title', 'CLOSEST FAMILIES'));
  right.appendChild(matchList(state.routing, 3));
  right.appendChild(text('div', 'section-title', 'CLOSEST TENDENCIES'));
  right.appendChild(matchList(state.m2.ranked, 4));
  grid.appendChild(right);

  wrap.appendChild(grid);

  // full 0-100 axis positions, folded away so the verdict fits one screen
  const details = el('details', { class: 'breakdown' });
  const summary = document.createElement('summary');
  summary.textContent = 'FULL AXIS BREAKDOWN';
  details.appendChild(summary);
  const barsWrap = el('div', { class: 'axis-bars' });
  for (const ax of state.m2.axes) barsWrap.appendChild(axisBar(ax, state.m2.scores[ax.key]));
  details.appendChild(barsWrap);
  wrap.appendChild(details);

  const actions = el('div', { class: 'action-row' });
  const shareBtn = el('button', { class: 'begin-btn compact' },
    text('span', '', '🔗 COPY SHAREABLE LINK'));
  shareBtn.addEventListener('click', async () => {
    const url = location.href;
    const done = () => {
      shareBtn.firstChild.textContent = '✓ LINK COPIED';
      setTimeout(() => { shareBtn.firstChild.textContent = '🔗 COPY SHAREABLE LINK'; }, 1800);
    };
    try {
      await navigator.clipboard.writeText(url);
      done();
    } catch (e) {
      // clipboard API is blocked on file:// and in some sandboxed frames
      const box = el('input', { class: 'share-fallback', value: url, readonly: 'readonly' });
      shareBtn.replaceWith(box);
      box.focus(); box.select();
    }
  });
  actions.appendChild(shareBtn);

  const cardBtn = el('button', { class: 'begin-btn compact' },
    text('span', '', '🖼 DOWNLOAD SHARE CARD'));
  cardBtn.addEventListener('click', () => {
    const canvas = buildShareCardCanvas();
    canvas.toBlob(blob => {
      if (!blob) return;
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'conferadar-result.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }, 'image/png');
  });
  actions.appendChild(cardBtn);

  actions.appendChild(el('button', {
    class: 'begin-btn compact',
    onclick: () => {
      clearSeeds();
      clearResultHash();
      clearProgress();
      state.resumable = null;
      state.screen = 'intro';
      state.answers1 = {}; state.answers2 = {};
      state.fromLink = false;
      render();
    },
  }, text('span', '', state.fromLink ? '→ TAKE THE TEST YOURSELF' : '↺ RETAKE ASSESSMENT')));
  wrap.appendChild(actions);

  if (SUBMIT_ENDPOINT && !state.fromLink) wrap.appendChild(renderValidation());

  wrap.appendChild(siteFooter());

  root.appendChild(wrap);
}

// -------------------------------------------------------------------- boot
function routeFromHash() {
  const payload = hashPayload();
  if (payload && decodeResult(payload)) {
    state.screen = 'results';
  } else {
    state.screen = 'intro';
    state.resumable = validateProgress(loadRawProgress(), state.data);
  }
  render();
}

window.addEventListener('hashchange', () => {
  if (suppressHashChange) return;
  routeFromHash();
});

loadData().then(data => {
  state.data = data;
  routeFromHash();
}).catch(err => {
  root.innerHTML = `<div class="sheet"><p class="body">Failed to load data: ${err.message}. If you opened this file directly, serve it via a local HTTP server instead.</p></div>`;
});

</script>
</body>
</html>

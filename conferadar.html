<style>
:root {
  --manila: #d9c9a3;
  --manila-dark: #cbb98c;
  --paper-shadow: rgba(60, 45, 20, 0.35);
  --navy: #1c2a44;
  --navy-soft: #33456b;
  --red: #8c1f1f;
  --ink: #2a2015;
  --serif: Georgia, 'Times New Roman', Times, serif;
  --mono: 'Courier New', Courier, monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  background: var(--manila-dark);
  background-image:
    radial-gradient(ellipse at 20% 10%, rgba(255,255,255,0.08), transparent 60%),
    repeating-linear-gradient(0deg, rgba(0,0,0,0.02) 0px, rgba(0,0,0,0.02) 1px, transparent 1px, transparent 3px);
  color: var(--ink);
  font-family: var(--serif);
}

#app {
  display: flex;
  justify-content: center;
  padding: 40px 16px 80px;
}

.sheet {
  position: relative;
  width: 100%;
  max-width: 720px;
  --sheet-max: 720px;
  background: var(--manila);
  box-shadow: 0 12px 30px var(--paper-shadow), inset 0 0 60px rgba(80, 60, 20, 0.12);
  border: 1px solid rgba(28, 42, 68, 0.25);
  padding: 48px 44px 56px;
}

.sheet::before {
  content: '';
  position: absolute;
  inset: 10px;
  border: 2px solid var(--navy);
  pointer-events: none;
  opacity: 0.55;
}

.title {
  font-family: var(--mono);
  letter-spacing: 0.14em;
  font-size: 2rem;
  color: var(--navy);
  margin: 0 0 4px;
  text-align: center;
}

.subtitle {
  text-align: center;
  font-style: italic;
  color: var(--navy-soft);
  margin: 0 0 20px;
}

.rule {
  border: none;
  border-top: 2px solid var(--navy);
  margin: 22px 0;
  opacity: 0.75;
}

.body {
  font-size: 1.02rem;
  line-height: 1.6;
  color: var(--ink);
}

.dossier-label {
  font-family: var(--mono);
  letter-spacing: 0.12em;
  color: var(--navy-soft);
  font-size: 0.8rem;
  margin-bottom: 6px;
}

.section-title {
  font-family: var(--mono);
  letter-spacing: 0.1em;
  color: var(--navy);
  font-size: 0.78rem;
  margin: 16px 0 8px;
  border-bottom: 1px solid rgba(28,42,68,0.3);
  padding-bottom: 4px;
}
.results-right > .section-title:first-child { margin-top: 0; }

/* stamps */
.stamp-corner, .stamp {
  position: absolute;
  top: 22px;
  right: 28px;
  border: 3px solid var(--red);
  color: var(--red);
  font-family: var(--mono);
  font-weight: bold;
  letter-spacing: 0.12em;
  padding: 6px 14px;
  transform: rotate(-8deg);
  opacity: 0.75;
  font-size: 0.8rem;
}

.verdict-stamp {
  top: -10px;
  right: 10px;
  font-size: 1.1rem;
  padding: 8px 18px;
  transform: rotate(-9deg);
}

/* intro form picker */
.form-picker {
  display: flex;
  gap: 14px;
  margin: 24px 0;
}

.choice-btn {
  flex: 1;
  background: rgba(255,255,255,0.25);
  border: 2px solid var(--navy-soft);
  padding: 14px 12px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 4px;
  text-align: left;
  font-family: var(--serif);
  color: var(--ink);
}
.choice-btn strong { font-family: var(--mono); color: var(--navy); }
.choice-btn .meta { font-size: 0.8rem; color: var(--navy-soft); }
.choice-btn.active { background: var(--navy); border-color: var(--navy); }
.choice-btn.active strong, .choice-btn.active .meta { color: var(--manila); }

.begin-btn {
  display: block;
  width: 100%;
  margin-top: 26px;
  background: var(--navy);
  color: var(--manila);
  border: none;
  padding: 16px;
  font-family: var(--mono);
  letter-spacing: 0.12em;
  font-size: 0.95rem;
  cursor: pointer;
  transition: background 0.15s;
}
.begin-btn:hover { background: var(--navy-soft); }

/* quiz */
.progress-track {
  height: 6px;
  background: rgba(28,42,68,0.15);
  margin-bottom: 8px;
}
.progress-fill {
  height: 100%;
  background: var(--red);
  transition: width 0.2s;
}
.progress-label {
  font-family: var(--mono);
  font-size: 0.72rem;
  letter-spacing: 0.1em;
  color: var(--navy-soft);
  margin-bottom: 26px;
}
.question-text {
  font-size: 1.35rem;
  line-height: 1.45;
  color: var(--navy);
  min-height: 90px;
  margin-bottom: 26px;
}
.options {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.opt-btn {
  text-align: left;
  background: rgba(255,255,255,0.3);
  border: 1.5px solid var(--navy-soft);
  padding: 12px 16px;
  font-family: var(--serif);
  font-size: 1rem;
  cursor: pointer;
  color: var(--ink);
}
.opt-btn:hover { background: rgba(255,255,255,0.55); }
.opt-btn.selected { background: var(--navy); color: var(--manila); border-color: var(--navy); }
.nav-row { margin-top: 20px; }
.nav-btn {
  background: none;
  border: none;
  font-family: var(--mono);
  color: var(--navy-soft);
  cursor: pointer;
  font-size: 0.8rem;
  letter-spacing: 0.08em;
}
.nav-btn:disabled { opacity: 0.3; cursor: default; }

/* matches / transition */
.match-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
.match-row {
  display: flex;
  justify-content: space-between;
  font-family: var(--mono);
  font-size: 0.88rem;
  border-bottom: 1px dotted rgba(28,42,68,0.3);
  padding: 4px 0;
}
.match-name { color: var(--ink); }
.match-pct { color: var(--navy); font-weight: bold; }

/* results */
.results { padding: 34px 38px 34px; max-width: 940px; }
.verdict-head { padding-right: 130px; }
.bucket-name {
  font-family: var(--mono);
  color: var(--navy);
  font-size: 1.85rem;
  margin: 2px 0 2px;
  letter-spacing: 0.01em;
  line-height: 1.1;
}
.flavor-label {
  font-style: italic;
  font-weight: normal;
  font-size: 1.12rem;
  color: var(--red);
  margin: 0 0 6px;
  line-height: 1.25;
}
.headline-match {
  font-family: var(--mono);
  font-size: 0.75rem;
  letter-spacing: 0.06em;
  color: var(--navy-soft);
}

.results-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
  gap: 24px;
  align-items: start;
}
.results-left { min-width: 0; }
.results-right { min-width: 0; }

.radar-wrap { display: flex; justify-content: center; }
.radar-svg { width: 100%; max-width: 400px; height: auto; overflow: visible; }
.radar-ring { fill: none; stroke: var(--navy-soft); stroke-opacity: 0.22; }
.radar-spoke { stroke: var(--navy-soft); stroke-opacity: 0.28; }
.radar-data { fill: rgba(140, 31, 31, 0.28); stroke: var(--red); stroke-width: 2; }
.radar-dot { fill: var(--red); }
.radar-pole-label {
  font-family: var(--mono);
  font-size: 9.5px;
  fill: var(--navy);
}
.radar-pole-label.muted { fill: var(--navy-soft); opacity: 0.5; font-style: italic; }
.radar-legend {
  font-size: 0.74rem;
  line-height: 1.4;
  color: var(--navy-soft);
  text-align: center;
  margin-top: 2px;
  font-style: italic;
}
.note {
  font-size: 0.7rem;
  color: var(--navy-soft);
  font-style: italic;
  margin-top: 5px;
  line-height: 1.35;
}

.validate-box {
  margin-top: 20px;
  border-top: 1px solid rgba(28, 42, 68, 0.3);
  padding-top: 14px;
}
.rating-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin: 10px 0;
}
.rating-btn {
  background: rgba(255,255,255,0.3);
  border: 1.5px solid var(--navy-soft);
  padding: 8px 6px;
  font-family: var(--mono);
  font-size: 0.7rem;
  letter-spacing: 0.02em;
  cursor: pointer;
  color: var(--ink);
}
.rating-btn:hover { background: rgba(255,255,255,0.55); }
.rating-btn.active { background: var(--navy); color: var(--manila); border-color: var(--navy); }
.validate-box input.share-fallback { margin-bottom: 10px; }
@media (max-width: 560px) {
  .rating-row { grid-template-columns: repeat(2, 1fr); }
}

.site-footer {
  text-align: center;
  margin-top: 24px;
  font-family: var(--mono);
  font-size: 0.72rem;
  letter-spacing: 0.03em;
  color: var(--navy-soft);
}
.site-footer a {
  color: var(--navy);
  text-decoration: none;
  border-bottom: 1px solid var(--navy-soft);
}
.site-footer a:hover {
  color: var(--red);
  border-bottom-color: var(--red);
}

.breakdown {
  margin-top: 16px;
  border-top: 1px solid rgba(28, 42, 68, 0.3);
  padding-top: 10px;
}
.breakdown summary {
  font-family: var(--mono);
  font-size: 0.74rem;
  letter-spacing: 0.1em;
  color: var(--navy);
  cursor: pointer;
}
.breakdown summary:hover { color: var(--red); }
.begin-btn.compact { margin-top: 0; padding: 12px; }
.action-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 10px;
  margin-top: 16px;
}
.share-fallback {
  width: 100%;
  font-family: var(--mono);
  font-size: 0.72rem;
  padding: 12px;
  border: 2px solid var(--navy);
  background: rgba(255,255,255,0.5);
  color: var(--ink);
}
@media (max-width: 560px) {
  .action-row { grid-template-columns: 1fr; }
}

.axis-bars { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
.axis-bar-row { display: grid; grid-template-columns: 100px 1fr 100px 36px; align-items: center; gap: 8px; }
.pole { font-family: var(--mono); font-size: 0.68rem; color: var(--navy-soft); letter-spacing: 0.02em; }
.pole-neg { text-align: right; }
.axis-track {
  position: relative;
  height: 6px;
  background: rgba(28,42,68,0.15);
}
.axis-marker {
  position: absolute;
  top: -4px;
  width: 3px;
  height: 14px;
  background: var(--red);
  transform: translateX(-1.5px);
}
.axis-value { font-family: var(--mono); font-size: 0.75rem; text-align: right; color: var(--navy); }
.cultural { margin-top: 10px; }

@media (max-width: 820px) {
  .results-grid { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .verdict-head { padding-right: 100px; }
}

@media (max-width: 560px) {
  .sheet { padding: 30px 20px 40px; }
  .results { padding: 28px 18px 30px; }
  .title { font-size: 1.5rem; }
  .bucket-name { font-size: 1.35rem; }
  .axis-bar-row { grid-template-columns: 76px 1fr 76px 26px; gap: 6px; }
  .pole { font-size: 0.58rem; line-height: 1.2; }
}

</style>
</head>

, "anchor": {"econ": 70, "auth": 62, "soli": 66, "chng": 80, "legi": 58, "impe": 52}}, {"id": 8, "name": "Fascism / Third Position", "anchor": {"econ": 52, "auth": 96, "soli": 92, "chng": 48, "legi": 38, "impe": 88}}, {"id": 9, "name": "Monarchism / Reaction", "anchor": {"econ": 70, "auth": 90, "soli": 52, "chng": 96, "legi": 74, "impe": 45}}, {"id": 10, "name": "Theocracy / Religious Fundamentalism", "anchor": {"econ": 48, "auth": 85, "soli": 42, "chng": 72, "legi": 96, "impe": 55}}, {"id": 11, "name": "Anarcho-Capitalism / Right-Lib.", "anchor": {"econ": 98, "auth": 4, "soli": 28, "chng": 52, "legi": 15, "impe": 28}}, {"id": 12, "name": "Third-Worldism / National Liberation", "anchor": {"econ": 22, "auth": 58, "soli": 68, "chng": 18, "legi": 32, "impe": 8}}, {"id": 13, "name": "Neo-Eurasianism / Traditionalism", "anchor": {"econ": 55, "auth": 82, "soli": 75, "chng": 88, "legi": 66, "impe": 78}}], "questions": [{"id": "auth01", "axis": "auth", "core": true, "effect": {"auth": 10}, "text": "A single disciplined organisation must hold decisive power during a period of transformation."}, {"id": "auth02", "axis": "auth", "core": true, "effect": {"auth": 10}, "text": "Political opposition can legitimately be banned when it threatens the established order."}, {"id": "auth03", "axis": "auth", "core": false, "effect": {"auth": 8}, "text": "The state is right to use surveillance against organised internal enemies."}, {"id": "auth04", "axis": "auth", "core": false, "effect": {"auth": 9}, "text": "A centralised command structure is more effective than any assembly or council."}, {"id": "auth05", "axis": "auth", "core": true, "effect": {"auth": 8}, "text": "Ordinary people generally lack the information needed to decide major questions of state directly."}, {"id": "auth06", "axis": "auth", "core": true, "effect": {"auth": 9}, "text": "Coercion by the state is a normal instrument of rule, not a regrettable exception."}, {"id": "auth07", "axis": "auth", "core": false, "effect": {"auth": 7}, "text": "Discipline and obedience are more valuable civic qualities than dissent."}, {"id": "auth08", "axis": "auth", "core": false, "effect": {"auth": 9}, "text": "A single leader holding wide personal authority serves a country better than rule by committee."}, {"id": "auth09", "axis": "auth", "core": true, "effect": {"auth": -10}, "text": "All political power should be exercised by delegates who can be recalled at any moment."}, {"id": "auth10", "axis": "auth", "core": true, "effect": {"auth": -10}, "text": "No permanent body of officials should be allowed to exist above the population."}, {"id": "auth11", "axis": "auth", "core": false, "effect": {"auth": -10}, "text": "Any concentration of coercive power reproduces domination regardless of who holds it."}, {"id": "auth12", "axis": "auth", "core": true, "effect": {"auth": -9}, "text": "Decisions should be made by federated local assemblies rather than a central authority."}, {"id": "auth13", "axis": "auth", "core": true, "effect": {"auth": -8}, "text": "The right to organise politically must be unconditional, including for one's enemies."}, {"id": "auth14", "axis": "auth", "core": false, "effect": {"auth": -8}, "text": "Hierarchy within an organisation corrupts its purpose, however good its intentions."}, {"id": "auth15", "axis": "auth", "core": false, "effect": {"auth": -8}, "text": "A police apparatus separate from the armed population is always dangerous."}, {"id": "auth16", "axis": "auth", "core": false, "effect": {"auth": -7}, "text": "Rule by permanent officials is a form of class power in its own right."}, {"id": "auth17", "axis": "auth", "core": true, "effect": {"auth": 7}, "text": "A revolutionary movement needs a formal, disciplined party organisation even when it holds no state power.", "note": "added v0.2: mid-range discriminator"}, {"id": "auth18", "axis": "auth", "core": false, "effect": {"auth": 6}, "text": "Binding collective decisions are necessary; spontaneous coordination is not enough.", "note": "added v0.2: mid-range discriminator"}, {"id": "auth19", "axis": "auth", "core": true, "effect": {"auth": -7}, "text": "Any group should be free to ignore a decision it did not itself consent to.", "note": "added v0.2: mid-range discriminator"}, {"id": "auth20", "axis": "auth", "core": false, "effect": {"auth": -6}, "text": "Political authority should never be delegated to anyone, even temporarily.", "note": "added v0.2: mid-range discriminator"}, {"id": "chng01", "axis": "chng", "core": true, "effect": {"chng": 10}, "text": "Society took a wrong turn at an identifiable point in the past and should return to what preceded it."}, {"id": "chng02", "axis": "chng", "core": true, "effect": {"chng": 9}, "text": "Inherited institutions carry accumulated wisdom that no deliberate redesign can replace."}, {"id": "chng03", "axis": "chng", "core": false, "effect": {"chng": 9}, "text": "The transformations of the past century have been mostly losses to be reversed."}, {"id": "chng04", "axis": "chng", "core": true, "effect": {"chng": 10}, "text": "Restoring an older order is a more worthy aim than constructing a new one."}, {"id": "chng05", "axis": "chng", "core": false, "effect": {"chng": 8}, "text": "Continuity with our ancestors is a stronger claim on us than the demands of the future."}, {"id": "chng06", "axis": "chng", "core": true, "effect": {"chng": 8}, "text": "Attempts to remake society from first principles end in catastrophe."}, {"id": "chng07", "axis": "chng", "core": false, "effect": {"chng": 7}, "text": "The existing order should be defended against those who would overturn it."}, {"id": "chng08", "axis": "chng", "core": false, "effect": {"chng": 7}, "text": "Stability is worth more than justice when the two come into conflict."}, {"id": "chng09", "axis": "chng", "core": true, "effect": {"chng": -10}, "text": "The present order cannot be repaired and must be broken."}, {"id": "chng10", "axis": "chng", "core": true, "effect": {"chng": -10}, "text": "What is needed is a rupture with the entire existing structure, not a series of corrections."}, {"id": "chng11", "axis": "chng", "core": false, "effect": {"chng": -9}, "text": "Existing institutions should be dismantled rather than inherited and reformed."}, {"id": "chng12", "axis": "chng", "core": false, "effect": {"chng": -8}, "text": "Nothing in the present arrangement is worth conserving for its own sake."}, {"id": "chng13", "axis": "chng", "core": true, "effect": {"chng": -9}, "text": "Decisive change comes through struggle, not through legislation."}, {"id": "chng14", "axis": "chng", "core": true, "effect": {"chng": -8}, "text": "Gradual reform ultimately stabilises the thing it claims to improve."}, {"id": "chng15", "axis": "chng", "core": false, "effect": {"chng": -7}, "text": "History moves forward, and the task is to accelerate it."}, {"id": "chng16", "axis": "chng", "core": false, "effect": {"chng": -7}, "text": "Those who defend continuity are really defending the interests continuity serves."}, {"id": "cult01", "axis": "cult", "core": true, "effect": {"cult": -9}, "text": "The traditional family structure should be upheld as the social norm."}, {"id": "cult02", "axis": "cult", "core": true, "effect": {"cult": -8}, "text": "Established sexual morality should be maintained and publicly upheld."}, {"id": "cult03", "axis": "cult", "core": false, "effect": {"cult": -8}, "text": "Long-standing cultural and religious customs deserve deference even when they constrain individuals."}, {"id": "cult04", "axis": "cult", "core": false, "effect": {"cult": -7}, "text": "Changes in gender roles over recent decades have gone too far."}, {"id": "cult05", "axis": "cult", "core": true, "effect": {"cult": 9}, "text": "Individuals should be free to define their own identity and way of life without social sanction."}, {"id": "cult06", "axis": "cult", "core": true, "effect": {"cult": 8}, "text": "Inherited moral codes should be revised whenever they conflict with individual freedom."}, {"id": "cult07", "axis": "cult", "core": false, "effect": {"cult": 8}, "text": "Society should actively work to dismantle traditional social hierarchies in everyday life."}, {"id": "cult08", "axis": "cult", "core": false, "effect": {"cult": 7}, "text": "Public morality should keep pace with changing social attitudes rather than resist them."}, {"id": "econ01", "axis": "econ", "core": true, "effect": {"econ": 10}, "text": "Competition between privately owned firms is the most reliable engine of prosperity."}, {"id": "econ02", "axis": "econ", "core": true, "effect": {"econ": 10}, "text": "Wealth accumulated through business success is legitimately earned and should not be redistributed."}, {"id": "econ03", "axis": "econ", "core": true, "effect": {"econ": 9}, "text": "Price signals allocate resources better than any planning body could."}, {"id": "econ04", "axis": "econ", "core": false, "effect": {"econ": 7}, "text": "Passing private wealth to one's children across generations is legitimate."}, {"id": "econ05", "axis": "econ", "core": false, "effect": {"econ": 8}, "text": "Most industries currently in state hands would be run better privately."}, {"id": "econ06", "axis": "econ", "core": true, "effect": {"econ": -10}, "text": "The commanding heights of the economy \u2014 energy, transport, heavy industry \u2014 should be publicly owned."}, {"id": "econ07", "axis": "econ", "core": true, "effect": {"econ": -10}, "text": "Employment for wages is inherently exploitative, whatever the wage level."}, {"id": "econ08", "axis": "econ", "core": true, "effect": {"econ": -9}, "text": "Production should be organised to meet needs directly, not to be sold for profit."}, {"id": "econ09", "axis": "econ", "core": false, "effect": {"econ": -7}, "text": "The gap between the highest and lowest incomes should be capped by law."}, {"id": "econ10", "axis": "econ", "core": false, "effect": {"econ": -8}, "text": "Land should not be privately owned as a commodity."}, {"id": "econ11", "axis": "econ", "core": true, "effect": {"econ": -7}, "text": "Key industries should be taken into public ownership even when they are running profitably.", "note": "added v0.2: mid-range discriminator"}, {"id": "econ12", "axis": "econ", "core": false, "effect": {"econ": -6}, "text": "Workers should have a legally guaranteed share of control over the firms that employ them.", "note": "added v0.2: mid-range discriminator"}, {"id": "econ13", "axis": "econ", "core": true, "effect": {"econ": 7}, "text": "A well-regulated market economy with a strong welfare state is preferable to public ownership.", "note": "added v0.2: mid-range discriminator"}, {"id": "econ14", "axis": "econ", "core": false, "effect": {"econ": 6}, "text": "Redistributing income through taxation is preferable to changing who owns productive property.", "note": "added v0.2: mid-range discriminator"}, {"id": "impe01", "axis": "impe", "core": true, "effect": {"impe": 10}, "text": "A powerful state is entitled to secure its interests abroad by force."}, {"id": "impe02", "axis": "impe", "core": true, "effect": {"impe": 10}, "text": "Some nations are fit to lead others, and the world order should reflect this."}, {"id": "impe03", "axis": "impe", "core": false, "effect": {"impe": 10}, "text": "Territorial expansion is a legitimate expression of national vitality."}, {"id": "impe04", "axis": "impe", "core": true, "effect": {"impe": 8}, "text": "Military intervention abroad is justified when it serves the intervening nation's interests."}, {"id": "impe05", "axis": "impe", "core": false, "effect": {"impe": 8}, "text": "Great powers naturally have spheres of influence that smaller states must respect."}, {"id": "impe06", "axis": "impe", "core": true, "effect": {"impe": -10}, "text": "The wealth of the developed world rests on continued extraction of value from the periphery."}, {"id": "impe07", "axis": "impe", "core": true, "effect": {"impe": -9}, "text": "Armed resistance to foreign occupation is a legitimate response to illegitimate force."}, {"id": "impe08", "axis": "impe", "core": true, "effect": {"impe": -9}, "text": "A government that serves a foreign imperial power against its own people forfeits its legitimacy."}, {"id": "impe09", "axis": "impe", "core": false, "effect": {"impe": -9}, "text": "National liberation struggles in the periphery are a central front of world politics, not a peripheral concern."}, {"id": "impe10", "axis": "impe", "core": false, "effect": {"impe": -9}, "text": "Sanctions and debt are instruments of domination as much as armies are."}, {"id": "legi01", "axis": "legi", "core": true, "effect": {"legi": 10}, "text": "Political authority is ultimately answerable to divine law, not to any human assembly."}, {"id": "legi02", "axis": "legi", "core": true, "effect": {"legi": 10}, "text": "Legislation that contradicts revealed law is illegitimate regardless of how it was passed."}, {"id": "legi03", "axis": "legi", "core": true, "effect": {"legi": 9}, "text": "Religious scholars should hold formal power to review the state's decisions."}, {"id": "legi04", "axis": "legi", "core": false, "effect": {"legi": 9}, "text": "A state without a religious foundation cannot command genuine obedience."}, {"id": "legi05", "axis": "legi", "core": false, "effect": {"legi": 9}, "text": "Public life should be ordered according to a single revealed moral code."}, {"id": "legi06", "axis": "legi", "core": true, "effect": {"legi": 8}, "text": "The clergy are a more trustworthy check on rulers than any constitution."}, {"id": "legi07", "axis": "legi", "core": false, "effect": {"legi": 7}, "text": "Religious institutions should be funded and privileged by the state."}, {"id": "legi08", "axis": "legi", "core": false, "effect": {"legi": 8}, "text": "A sacred order stands above politics and sets its limits."}, {"id": "legi09", "axis": "legi", "core": true, "effect": {"legi": -10}, "text": "Law derives its authority solely from human beings, and from nothing above them."}, {"id": "legi10", "axis": "legi", "core": true, "effect": {"legi": -9}, "text": "Religious institutions should have no formal role in government whatsoever."}, {"id": "legi11", "axis": "legi", "core": true, "effect": {"legi": -9}, "text": "Religious teaching is too often used to make people accept injustice they would otherwise resist."}, {"id": "legi12", "axis": "legi", "core": true, "effect": {"legi": -9}, "text": "The state should treat all metaphysical claims as private matters with no political standing."}, {"id": "legi13", "axis": "legi", "core": false, "effect": {"legi": -8}, "text": "Political questions should be settled by material analysis, not by scripture."}, {"id": "legi14", "axis": "legi", "core": false, "effect": {"legi": -8}, "text": "A religious ruling class is a ruling class like any other."}, {"id": "legi15", "axis": "legi", "core": false, "effect": {"legi": -8}, "text": "Public policy should never appeal to divine sanction as its justification."}, {"id": "legi16", "axis": "legi", "core": false, "effect": {"legi": -9}, "text": "Clerical influence over the state should be actively removed where it exists."}, {"id": "soli01", "axis": "soli", "core": true, "effect": {"soli": 10}, "text": "The bonds between members of a nation matter more than the bonds between workers of different nations."}, {"id": "soli02", "axis": "soli", "core": true, "effect": {"soli": 10}, "text": "A people sharing common descent and culture is the natural political unit."}, {"id": "soli03", "axis": "soli", "core": true, "effect": {"soli": 9}, "text": "Loyalty to one's country should override loyalty to any international movement."}, {"id": "soli04", "axis": "soli", "core": false, "effect": {"soli": 9}, "text": "Conflict between classes within a nation is a distraction from the nation's common interest."}, {"id": "soli05", "axis": "soli", "core": false, "effect": {"soli": 7}, "text": "Large-scale immigration dissolves the solidarity a political community depends on."}, {"id": "soli06", "axis": "soli", "core": true, "effect": {"soli": -10}, "text": "A worker has more in common with a foreign worker than with an employer of their own nationality."}, {"id": "soli07", "axis": "soli", "core": true, "effect": {"soli": -9}, "text": "Nations are historical constructions that will dissolve as class society is overcome."}, {"id": "soli08", "axis": "soli", "core": true, "effect": {"soli": -10}, "text": "Appeals to a shared 'national interest' usually mask the particular interests of that nation's ruling class."}, {"id": "soli09", "axis": "soli", "core": false, "effect": {"soli": -8}, "text": "Borders serve mainly to divide those who would otherwise share a common interest."}, {"id": "soli10", "axis": "soli", "core": false, "effect": {"soli": -8}, "text": "Appeals to national unity are usually a means of suppressing internal conflict."}]}, "module2": {"buckets": {"1": {"meta": {"module": 2, "bucketId": 1, "bucket": "Marxism-Leninism / Communism", "version": "0.1-draft", "questionCount": 96, "shortFormCount": 48, "scoring": {"answerScale": [{"label": "Strongly Agree", "mult": 1.0}, {"label": "Agree", "mult": 0.5}, {"label": "Neutral / Unsure", "mult": 0.0}, {"label": "Disagree", "mult": -0.5}, {"label": "Strongly Disagree", "mult": -1.0}], "formula": "raw[axis] = sum(mult * effect[axis]); max[axis] = sum(abs(effect[axis])); score[axis] = 100 * (max + raw) / (2 * max)"}, "presentation": "Stored grouped by axis for maintainability. The app must SHUFFLE at runtime with a fixed seed so consecutive items do not come from the same axis."}, "axes": [{"key": "road", "name": "Route to Power", "negPole": "Armed Rupture", "posPole": "Peaceful / Parliamentary Road"}, {"key": "subj", "name": "Revolutionary Subject", "negPole": "Industrial Proletariat", "posPole": "Peasantry & Rural Periphery"}, {"key": "vang", "name": "Vanguard Discipline", "negPole": "Mass-Democratic / Pluralist", "posPole": "Monolithic Cadre Party"}, {"key": "aes", "name": "AES Defence", "negPole": "Critical / Deformed-or-Revisionist", "posPole": "Defend the Socialist Camp"}, {"key": "cont", "name": "Continuous Revolution", "negPole": "Productive-Forces Primacy", "posPole": "Class Struggle Under Socialism"}, {"key": "mech", "name": "Economic Mechanism", "negPole": "Comprehensive Central Planning", "posPole": "Market & Enterprise Autonomy"}, {"key": "intl", "name": "Internationalist Scope", "negPole": "Socialism in One Country", "posPole": "Permanent World Revolution"}, {"key": "lead", "name": "Leadership Principle", "negPole": "Collective / Institutional", "posPole": "Guiding Thought of One Leader"}], "subIdeologies": [{"name": "Marxism-Leninism (orthodox/Stalinist)", "umbrella": false, "anchor": {"road": 15, "subj": 30, "vang": 88, "aes": 78, "cont": 40, "mech": 12, "intl": 25, "lead": 85}}, {"name": "Trotskyism / Left Opposition", "umbrella": false, "anchor": {"road": 25, "subj": 18, "vang": 55, "aes": 18, "cont": 55, "mech": 28, "intl": 96, "lead": 22}}, {"name": "Maoism", "umbrella": false, "anchor": {"road": 12, "subj": 80, "vang": 80, "aes": 60, "cont": 88, "mech": 25, "intl": 55, "lead": 85}}, {"name": "Marxism-Leninism-Maoism (Gonzalo)", "umbrella": false, "anchor": {"road": 0, "subj": 90, "vang": 99, "aes": 35, "cont": 96, "mech": 10, "intl": 70, "lead": 99}}, {"name": "Hoxhaism (Anti-Revisionist)", "umbrella": false, "anchor": {"road": 12, "subj": 35, "vang": 92, "aes": 22, "cont": 62, "mech": 4, "intl": 33, "lead": 78}}, {"name": "Titoism (self-management)", "umbrella": false, "anchor": {"road": 32, "subj": 42, "vang": 58, "aes": 48, "cont": 28, "mech": 82, "intl": 48, "lead": 76}}, {"name": "Castro-Guevarism", "umbrella": false, "anchor": {"road": 5, "subj": 66, "vang": 68, "aes": 66, "cont": 60, "mech": 18, "intl": 88, "lead": 80}}, {"name": "Ho Chi Minh Thought", "umbrella": false, "anchor": {"road": 22, "subj": 76, "vang": 78, "aes": 74, "cont": 42, "mech": 32, "intl": 28, "lead": 72}}, {"name": "Kim Il-Sungism / Juche", "umbrella": false, "anchor": {"road": 15, "subj": 68, "vang": 96, "aes": 52, "cont": 48, "mech": 8, "intl": 2, "lead": 99}}, {"name": "Prachanda Path", "umbrella": false, "anchor": {"road": 38, "subj": 84, "vang": 72, "aes": 50, "cont": 72, "mech": 38, "intl": 55, "lead": 84}}, {"name": "Dengism / Reform Communism", "umbrella": false, "anchor": {"road": 48, "subj": 45, "vang": 82, "aes": 76, "cont": 6, "mech": 94, "intl": 18, "lead": 42}}, {"name": "Khrushchevism / De-Stalinization", "umbrella": false, "anchor": {"road": 62, "subj": 28, "vang": 60, "aes": 66, "cont": 22, "mech": 38, "intl": 62, "lead": 25}}, {"name": "Brezhnevism / Developed Socialism", "umbrella": false, "anchor": {"road": 45, "subj": 26, "vang": 86, "aes": 97, "cont": 10, "mech": 20, "intl": 45, "lead": 52}}, {"name": "Eurocommunism", "umbrella": false, "anchor": {"road": 95, "subj": 22, "vang": 26, "aes": 28, "cont": 32, "mech": 72, "intl": 42, "lead": 12}}, {"name": "Naxalism", "umbrella": false, "anchor": {"road": 0, "subj": 96, "vang": 88, "aes": 40, "cont": 70, "mech": 20, "intl": 35, "lead": 55}}, {"name": "National Bolshevism", "umbrella": false, "anchor": {"road": 25, "subj": 52, "vang": 82, "aes": 55, "cont": 34, "mech": 46, "intl": 4, "lead": 90}}, {"name": "Barracks Communism", "umbrella": true, "anchor": {"road": 20, "subj": 50, "vang": 95, "aes": 45, "cont": 18, "mech": 2, "intl": 26, "lead": 76}}, {"name": "Posadism", "umbrella": false, "anchor": {"road": 22, "subj": 24, "vang": 48, "aes": 40, "cont": 62, "mech": 18, "intl": 99, "lead": 68}}], "questions": [{"id": "road01", "axis": "road", "core": true, "effect": {"road": 10}, "text": "A communist party can come to power through elections and hold it without an armed seizure."}, {"id": "road02", "axis": "road", "core": true, "effect": {"road": 9}, "text": "Where a parliament exists, contesting it seriously is a better use of cadre than preparing for armed struggle."}, {"id": "road03", "axis": "road", "core": true, "effect": {"road": 8}, "text": "A negotiated transfer of power is preferable to civil war, even at the cost of real concessions."}, {"id": "road04", "axis": "road", "core": false, "effect": {"road": 10}, "text": "The existing army and police can be won over and reformed rather than smashed."}, {"id": "road05", "axis": "road", "core": false, "effect": {"road": 8}, "text": "Signing a peace accord and entering government can be a revolutionary act rather than a capitulation."}, {"id": "road06", "axis": "road", "core": false, "effect": {"road": 7}, "text": "A broad electoral alliance with non-communist parties is worth the programmatic compromises it requires."}, {"id": "road07", "axis": "road", "core": true, "effect": {"road": -10}, "text": "No ruling class has ever given up state power without being forced, and none ever will."}, {"id": "road08", "axis": "road", "core": true, "effect": {"road": -9}, "text": "Building an armed force is the central task of a revolutionary party, not one task among several."}, {"id": "road09", "axis": "road", "core": true, "effect": {"road": -8}, "text": "Standing in elections is only ever worthwhile as a way of exposing them."}, {"id": "road10", "axis": "road", "core": false, "effect": {"road": -10}, "text": "The standing army and the police must be dismantled outright, never inherited."}, {"id": "road11", "axis": "road", "core": false, "effect": {"road": -8}, "text": "A party that has not prepared for illegality will be destroyed the moment it becomes dangerous."}, {"id": "road12", "axis": "road", "core": false, "effect": {"road": -7}, "text": "Every peaceful road to socialism attempted so far has ended in the movement's defeat."}, {"id": "subj01", "axis": "subj", "core": true, "effect": {"subj": 10}, "text": "The peasantry, not the industrial working class, is the main force of revolution across most of the world."}, {"id": "subj02", "axis": "subj", "core": true, "effect": {"subj": 9}, "text": "Revolution advances by building base areas in the countryside and encircling the cities from them."}, {"id": "subj03", "axis": "subj", "core": true, "effect": {"subj": 8}, "text": "The land question is the decisive question of the revolution."}, {"id": "subj04", "axis": "subj", "core": false, "effect": {"subj": 10}, "text": "In a semi-feudal country the urban proletariat is far too small to lead on its own."}, {"id": "subj05", "axis": "subj", "core": false, "effect": {"subj": 8}, "text": "The most reliable cadre are recruited from the villages rather than the factories."}, {"id": "subj06", "axis": "subj", "core": false, "effect": {"subj": 7}, "text": "Rural poverty produces a sharper and more durable class hatred than industrial wage labour does."}, {"id": "subj07", "axis": "subj", "core": true, "effect": {"subj": -10}, "text": "Only the industrial working class can lead a socialist revolution; other classes can at most follow it."}, {"id": "subj08", "axis": "subj", "core": true, "effect": {"subj": -9}, "text": "A revolution with a rural base ends in peasant war, not in proletarian power."}, {"id": "subj09", "axis": "subj", "core": true, "effect": {"subj": -8}, "text": "The decisive battles are fought in the cities, where production and the state are concentrated."}, {"id": "subj10", "axis": "subj", "core": false, "effect": {"subj": -10}, "text": "Socialism presupposes large-scale industry and the class that large-scale industry creates."}, {"id": "subj11", "axis": "subj", "core": false, "effect": {"subj": -8}, "text": "Organising in the workplaces takes priority over organising in the countryside."}, {"id": "subj12", "axis": "subj", "core": false, "effect": {"subj": -7}, "text": "What the peasantry wants is land of its own, and that is not a socialist demand."}, {"id": "vang01", "axis": "vang", "core": true, "effect": {"vang": 10}, "text": "Once the party has settled a line, no member may argue against it in public."}, {"id": "vang02", "axis": "vang", "core": true, "effect": {"vang": 9}, "text": "Organised factions inside the party must be prohibited outright."}, {"id": "vang03", "axis": "vang", "core": true, "effect": {"vang": 8}, "text": "The party should be a selected body of tested cadre, not a mass membership open to anyone."}, {"id": "vang04", "axis": "vang", "core": false, "effect": {"vang": 10}, "text": "Party decisions must bind lower bodies absolutely, with no appeal to the membership at large."}, {"id": "vang05", "axis": "vang", "core": false, "effect": {"vang": 8}, "text": "Ideological uniformity is a source of strength in a revolutionary party, not a weakness."}, {"id": "vang06", "axis": "vang", "core": false, "effect": {"vang": 7}, "text": "Removing unreliable elements from the ranks is a normal and necessary part of party life."}, {"id": "vang07", "axis": "vang", "core": true, "effect": {"vang": -10}, "text": "The right to form organised tendencies within the party must be permanent and unconditional."}, {"id": "vang08", "axis": "vang", "core": true, "effect": {"vang": -9}, "text": "Party leaderships should be openly contested and removable by the membership at any time."}, {"id": "vang09", "axis": "vang", "core": true, "effect": {"vang": -8}, "text": "Disagreements inside a revolutionary party should be argued out in public, in front of the class."}, {"id": "vang10", "axis": "vang", "core": false, "effect": {"vang": -10}, "text": "Other working-class parties should be free to exist and compete after the revolution."}, {"id": "vang11", "axis": "vang", "core": false, "effect": {"vang": -8}, "text": "A party that suppresses internal disagreement will make worse decisions, not better ones."}, {"id": "vang12", "axis": "vang", "core": false, "effect": {"vang": -7}, "text": "Trade unions and mass organisations should keep real independence from the party that leads them."}, {"id": "aes01", "axis": "aes", "core": true, "effect": {"aes": 10}, "text": "The socialist states of the twentieth century were, on the whole, genuine workers' states worth defending."}, {"id": "aes02", "axis": "aes", "core": true, "effect": {"aes": 9}, "text": "Criticism of existing socialist states mainly serves imperialism, whatever the critic intends."}, {"id": "aes03", "axis": "aes", "core": true, "effect": {"aes": 8}, "text": "The achievements of the socialist camp outweigh its errors by a wide margin."}, {"id": "aes04", "axis": "aes", "core": false, "effect": {"aes": 10}, "text": "Where a socialist state and an imperialist power come into conflict, one takes the socialist side without conditions."}, {"id": "aes05", "axis": "aes", "core": false, "effect": {"aes": 8}, "text": "The collapse of the Soviet Union was a defeat for the working class of the entire world."}, {"id": "aes06", "axis": "aes", "core": false, "effect": {"aes": 7}, "text": "States that describe themselves as socialist today deserve the movement's active support."}, {"id": "aes07", "axis": "aes", "core": true, "effect": {"aes": -10}, "text": "Most states that called themselves socialist had long since stopped being workers' states."}, {"id": "aes08", "axis": "aes", "core": true, "effect": {"aes": -9}, "text": "A bureaucratic caste ruled in the name of the working class while excluding it from power."}, {"id": "aes09", "axis": "aes", "core": true, "effect": {"aes": -8}, "text": "Defending existing socialist states uncritically has cost the movement more than any enemy has."}, {"id": "aes10", "axis": "aes", "core": false, "effect": {"aes": -10}, "text": "Past a certain point the ruling parties of the socialist camp went over to revisionism."}, {"id": "aes11", "axis": "aes", "core": false, "effect": {"aes": -8}, "text": "State ownership on its own does not make a country socialist."}, {"id": "aes12", "axis": "aes", "core": false, "effect": {"aes": -7}, "text": "The socialist camp should be judged by exactly the standards applied to any other state."}, {"id": "cont01", "axis": "cont", "core": true, "effect": {"cont": 10}, "text": "Classes and class struggle persist under socialism and can restore capitalism if they are not fought."}, {"id": "cont02", "axis": "cont", "core": true, "effect": {"cont": 9}, "text": "A new bourgeoisie can form inside the ruling party itself."}, {"id": "cont03", "axis": "cont", "core": true, "effect": {"cont": 8}, "text": "The masses must be mobilised to criticise and overturn officials, even at the cost of disorder."}, {"id": "cont04", "axis": "cont", "core": false, "effect": {"cont": 10}, "text": "Transforming consciousness and social relations matters as much as raising output does."}, {"id": "cont05", "axis": "cont", "core": false, "effect": {"cont": 8}, "text": "Periodic upheavals from below are necessary to stop the state from hardening into a caste."}, {"id": "cont06", "axis": "cont", "core": false, "effect": {"cont": 7}, "text": "Technical experts and managers become a privileged stratum unless they are constantly checked."}, {"id": "cont07", "axis": "cont", "core": true, "effect": {"cont": -10}, "text": "The main task after taking power is developing the productive forces, not further class struggle."}, {"id": "cont08", "axis": "cont", "core": true, "effect": {"cont": -9}, "text": "Once the means of production are socialised, the class question is essentially settled."}, {"id": "cont09", "axis": "cont", "core": true, "effect": {"cont": -8}, "text": "Mass campaigns against officials disrupt production and set the whole economy back."}, {"id": "cont10", "axis": "cont", "core": false, "effect": {"cont": -10}, "text": "Poverty, not insufficient revolutionary consciousness, is the main obstacle to socialism."}, {"id": "cont11", "axis": "cont", "core": false, "effect": {"cont": -8}, "text": "Steady administration serves the working class better than permanent upheaval does."}, {"id": "cont12", "axis": "cont", "core": false, "effect": {"cont": -7}, "text": "Raising living standards is the strongest argument socialism can make."}, {"id": "mech01", "axis": "mech", "core": true, "effect": {"mech": 10}, "text": "Markets and private enterprise can be used for a long period under the direction of a socialist state."}, {"id": "mech02", "axis": "mech", "core": true, "effect": {"mech": 9}, "text": "Enterprises should set much of their own output, pricing, and investment."}, {"id": "mech03", "axis": "mech", "core": true, "effect": {"mech": 8}, "text": "Foreign investment can be admitted on terms set by a socialist state without endangering it."}, {"id": "mech04", "axis": "mech", "core": false, "effect": {"mech": 10}, "text": "Competition between socialist enterprises improves efficiency more than commands from above do."}, {"id": "mech05", "axis": "mech", "core": false, "effect": {"mech": 8}, "text": "Some inequality of income is acceptable where it raises overall output."}, {"id": "mech06", "axis": "mech", "core": false, "effect": {"mech": 7}, "text": "Self-management of individual enterprises is preferable to direction by central ministries."}, {"id": "mech07", "axis": "mech", "core": true, "effect": {"mech": -10}, "text": "The whole economy should follow a single plan, with no market in the means of production."}, {"id": "mech08", "axis": "mech", "core": true, "effect": {"mech": -9}, "text": "A durable turn back toward market allocation under socialism risks becoming a slide toward capitalist restoration."}, {"id": "mech09", "axis": "mech", "core": true, "effect": {"mech": -8}, "text": "Prices should be set by the plan according to need, not by supply and demand."}, {"id": "mech10", "axis": "mech", "core": false, "effect": {"mech": -10}, "text": "Private enterprise should be eliminated altogether, not tolerated in a subordinate role."}, {"id": "mech11", "axis": "mech", "core": false, "effect": {"mech": -8}, "text": "Wage differentials should be compressed as far as production allows."}, {"id": "mech12", "axis": "mech", "core": false, "effect": {"mech": -7}, "text": "Trade with capitalist countries should be minimised in favour of self-reliance."}, {"id": "intl01", "axis": "intl", "core": true, "effect": {"intl": 10}, "text": "Socialism cannot be completed in a single country; it stands or falls internationally."}, {"id": "intl02", "axis": "intl", "core": true, "effect": {"intl": 9}, "text": "A socialist state's foreign policy should be subordinated to spreading revolution abroad."}, {"id": "intl03", "axis": "intl", "core": true, "effect": {"intl": 8}, "text": "The revolution must be carried forward without pausing at any national stage."}, {"id": "intl04", "axis": "intl", "core": false, "effect": {"intl": 10}, "text": "A workers' state that puts its own diplomatic interests first has already begun to degenerate."}, {"id": "intl05", "axis": "intl", "core": false, "effect": {"intl": 8}, "text": "Building an international organisation matters more than consolidating any one national party."}, {"id": "intl06", "axis": "intl", "core": false, "effect": {"intl": 7}, "text": "Borders are an obstacle the revolution has to dissolve, not a framework to work within."}, {"id": "intl07", "axis": "intl", "core": true, "effect": {"intl": -10}, "text": "A single country can build socialism on its own, whatever happens elsewhere."}, {"id": "intl08", "axis": "intl", "core": true, "effect": {"intl": -9}, "text": "Self-reliance is the first duty of a revolutionary state; outside assistance is a bonus."}, {"id": "intl09", "axis": "intl", "core": true, "effect": {"intl": -8}, "text": "Each country's revolution must follow its own road, determined by its own party."}, {"id": "intl10", "axis": "intl", "core": false, "effect": {"intl": -10}, "text": "Exporting revolution wastes resources the country needs to defend and develop itself."}, {"id": "intl11", "axis": "intl", "core": false, "effect": {"intl": -8}, "text": "A socialist state should make whatever diplomatic arrangements its security requires."}, {"id": "intl12", "axis": "intl", "core": false, "effect": {"intl": -7}, "text": "Loyalty to one's nation and loyalty to the revolution point in the same direction."}, {"id": "lead01", "axis": "lead", "core": true, "effect": {"lead": 10}, "text": "A revolution needs one recognised leader whose thought guides the whole movement."}, {"id": "lead02", "axis": "lead", "core": true, "effect": {"lead": 9}, "text": "A leader's contribution should be named as a distinct development of Marxism."}, {"id": "lead03", "axis": "lead", "core": true, "effect": {"lead": 8}, "text": "Public veneration of the leader strengthens the movement's cohesion."}, {"id": "lead04", "axis": "lead", "core": false, "effect": {"lead": 10}, "text": "Where the leader and the central committee disagree, the leader is usually right."}, {"id": "lead05", "axis": "lead", "core": false, "effect": {"lead": 8}, "text": "A movement with no authoritative individual leader falls into indecision."}, {"id": "lead06", "axis": "lead", "core": false, "effect": {"lead": 7}, "text": "The leader embodies the continuity of the revolution across generations."}, {"id": "lead07", "axis": "lead", "core": true, "effect": {"lead": -10}, "text": "No individual should ever be placed above the party's collective bodies."}, {"id": "lead08", "axis": "lead", "core": true, "effect": {"lead": -9}, "text": "Structuring the movement's authority around one leader's personal standing, however capable they are, leaves it fragile once that leader is gone."}, {"id": "lead09", "axis": "lead", "core": true, "effect": {"lead": -8}, "text": "Naming a doctrine after a living leader is a warning sign, not a theoretical advance."}, {"id": "lead10", "axis": "lead", "core": false, "effect": {"lead": -10}, "text": "Leadership positions should rotate and remain accountable to elected bodies."}, {"id": "lead11", "axis": "lead", "core": false, "effect": {"lead": -8}, "text": "Theory belongs to the movement as a whole, never to any single thinker."}, {"id": "lead12", "axis": "lead", "core": false, "effect": {"lead": -7}, "text": "A leader's personal authority should never exceed the office they hold."}]}, "2": {"meta": {"module": 2, "bucketId": 2, "bucket": "Left-Communism / Communization", "version": "0.1-draft", "questionCount": 96, "shortFormCount": 48, "scoring": {"answerScale": [{"label": "Strongly Agree", "mult": 1.0}, {"label": "Agree", "mult": 0.5}, {"label": "Neutral / Unsure", "mult": 0.0}, {"label": "Disagree", "mult": -0.5}, {"label": "Strongly Disagree", "mult": -1.0}], "formula": "raw[axis] = sum(mult * effect[axis]); max[axis] = sum(abs(effect[axis])); score[axis] = 100 * (max + raw) / (2 * max)"}, "presentation": "Stored grouped by axis for maintainability. The app must SHUFFLE at runtime with a fixed seed so consecutive items do not come from the same axis."}, "axes": [{"key": "org", "name": "Organisational Form", "negPole": "Formal Party / Organic Centralism", "posPole": "Spontaneous Self-Organisation"}, {"key": "prog", "name": "Programme Fixity", "negPole": "Invariant Programme", "posPole": "Historically Open / Self-Revising"}, {"key": "comz", "name": "Communisation Immediacy", "negPole": "Transitional Workers' Power First", "posPole": "Immediate Abolition of Value & Work"}, {"key": "site", "name": "Site of Struggle", "negPole": "Point of Production", "posPole": "Everyday Life & Social Reproduction"}, {"key": "unio", "name": "Union Question", "negPole": "Unions as Revolutionary Vehicle", "posPole": "Unions as Organs of Capital"}, {"key": "parl", "name": "Electoral Tactic", "negPole": "Strict Abstentionism", "posPole": "Revolutionary Parliamentarism"}, {"key": "natl", "name": "National Question", "negPole": "Anti-Colonial Struggles Supportable", "posPole": "No Support for Any National Struggle"}, {"key": "insu", "name": "Form of Action", "negPole": "Mass Strike / Class Movement", "posPole": "Minoritarian Direct Action"}], "subIdeologies": [{"name": "Council Communism (Pannekoek, Gorter)", "umbrella": false, "anchor": {"org": 92, "prog": 55, "comz": 42, "site": 12, "unio": 88, "parl": 4, "natl": 80, "insu": 10}}, {"name": "Bordigism (Italian Left)", "umbrella": false, "anchor": {"org": 2, "prog": 2, "comz": 12, "site": 22, "unio": 42, "parl": 0, "natl": 30, "insu": 15}}, {"name": "Luxemburgism", "umbrella": false, "anchor": {"org": 58, "prog": 62, "comz": 28, "site": 18, "unio": 28, "parl": 78, "natl": 88, "insu": 4}}, {"name": "Communization Theory", "umbrella": false, "anchor": {"org": 86, "prog": 88, "comz": 98, "site": 82, "unio": 94, "parl": 2, "natl": 92, "insu": 58}}, {"name": "Autonomism / Operaismo", "umbrella": false, "anchor": {"org": 80, "prog": 90, "comz": 78, "site": 66, "unio": 90, "parl": 6, "natl": 58, "insu": 72}}, {"name": "Situationism (Debord, SI)", "umbrella": false, "anchor": {"org": 78, "prog": 80, "comz": 45, "site": 97, "unio": 88, "parl": 0, "natl": 65, "insu": 45}}, {"name": "De Leonism", "umbrella": false, "anchor": {"org": 18, "prog": 18, "comz": 24, "site": 2, "unio": 0, "parl": 72, "natl": 60, "insu": 8}}, {"name": "Impossibilism (SPGB)", "umbrella": false, "anchor": {"org": 26, "prog": 14, "comz": 34, "site": 26, "unio": 62, "parl": 97, "natl": 92, "insu": 2}}, {"name": "Council-ist Trotskyism (Castoriadis)", "umbrella": false, "anchor": {"org": 72, "prog": 96, "comz": 52, "site": 48, "unio": 74, "parl": 12, "natl": 76, "insu": 20}}, {"name": "Insurrectionary / Anti-Work Communism", "umbrella": false, "anchor": {"org": 96, "prog": 80, "comz": 92, "site": 86, "unio": 96, "parl": 0, "natl": 70, "insu": 99}}, {"name": "Ultra-leftism (umbrella)", "umbrella": true, "anchor": {"org": 80, "prog": 70, "comz": 70, "site": 60, "unio": 85, "parl": 5, "natl": 78, "insu": 55}}], "questions": [{"id": "org01", "axis": "org", "core": true, "effect": {"org": 10}, "text": "Revolutionary consciousness arises from the class's own activity, not from a party that brings it in from outside."}, {"id": "org02", "axis": "org", "core": true, "effect": {"org": 9}, "text": "Councils elected and recallable on the shop floor are the only legitimate organs of proletarian power."}, {"id": "org03", "axis": "org", "core": true, "effect": {"org": 8}, "text": "Fixed leadership positions reproduce the separation between leaders and led that the revolution exists to abolish."}, {"id": "org04", "axis": "org", "core": false, "effect": {"org": 10}, "text": "Delegation should be so immediate and revocable that no delegate ever becomes a fixture."}, {"id": "org05", "axis": "org", "core": false, "effect": {"org": 8}, "text": "The class does not need a general staff; it needs to recognise its own power."}, {"id": "org06", "axis": "org", "core": false, "effect": {"org": 7}, "text": "Organisational forms should dissolve back into the class the moment their task is done."}, {"id": "org07", "axis": "org", "core": true, "effect": {"org": -10}, "text": "A single centralised organisation, organically unified around one programme, is what turns scattered militancy into a revolution."}, {"id": "org08", "axis": "org", "core": true, "effect": {"org": -9}, "text": "Without a party the class can win a strike, but not a revolution."}, {"id": "org09", "axis": "org", "core": true, "effect": {"org": -8}, "text": "Discipline flowing from an organic centre is a strength, not a defect, of a revolutionary organisation."}, {"id": "org10", "axis": "org", "core": false, "effect": {"org": -10}, "text": "Councils without a party to give them a programme drift and dissolve."}, {"id": "org11", "axis": "org", "core": false, "effect": {"org": -8}, "text": "Centralism is not the enemy of the working class; disorganisation is."}, {"id": "org12", "axis": "org", "core": false, "effect": {"org": -7}, "text": "The organisation exists prior to and independent of the immediate mood of the class, and must."}, {"id": "prog01", "axis": "prog", "core": true, "effect": {"prog": 10}, "text": "The programme should be rewritten as the movement's practice reveals new possibilities."}, {"id": "prog02", "axis": "prog", "core": true, "effect": {"prog": 9}, "text": "No text handed down from an earlier period can bind revolutionaries in the present."}, {"id": "prog03", "axis": "prog", "core": true, "effect": {"prog": 8}, "text": "Theory develops through the struggle itself, not through fidelity to a founding document."}, {"id": "prog04", "axis": "prog", "core": false, "effect": {"prog": 10}, "text": "A programme fixed in the past cannot anticipate the forms communisation will actually take."}, {"id": "prog05", "axis": "prog", "core": false, "effect": {"prog": 8}, "text": "Openness to revision is a sign of a living theory, not of opportunism."}, {"id": "prog06", "axis": "prog", "core": false, "effect": {"prog": 7}, "text": "Each cycle of struggles produces its own theoretical questions that earlier texts could not have posed."}, {"id": "prog07", "axis": "prog", "core": true, "effect": {"prog": -10}, "text": "The invariant core of the communist programme was established long ago and cannot be revised without abandoning it."}, {"id": "prog08", "axis": "prog", "core": true, "effect": {"prog": -9}, "text": "What looks like theoretical innovation is usually the old opportunism finding new words."}, {"id": "prog09", "axis": "prog", "core": true, "effect": {"prog": -8}, "text": "A movement that keeps revising its basic positions has no basis on which to build continuity."}, {"id": "prog10", "axis": "prog", "core": false, "effect": {"prog": -10}, "text": "The party's theses are the fixed compass by which every new development is judged."}, {"id": "prog11", "axis": "prog", "core": false, "effect": {"prog": -8}, "text": "Adapting the programme to the mood of the moment is how revolutionary movements are lost."}, {"id": "prog12", "axis": "prog", "core": false, "effect": {"prog": -7}, "text": "Loyalty to the founding texts is what distinguishes a real communist current from its impostors."}, {"id": "comz01", "axis": "comz", "core": true, "effect": {"comz": 10}, "text": "The abolition of value, wage labour, and the state must begin immediately, in the revolution itself, not after a transition."}, {"id": "comz02", "axis": "comz", "core": true, "effect": {"comz": 9}, "text": "Waiting for a workers' state to wither away has always meant the state does not wither."}, {"id": "comz03", "axis": "comz", "core": true, "effect": {"comz": 8}, "text": "Communism is a set of immediate measures, not a distant end-state to be built toward."}, {"id": "comz04", "axis": "comz", "core": false, "effect": {"comz": 10}, "text": "Any period of continued wage labour under a revolutionary government reproduces capitalist social relations."}, {"id": "comz05", "axis": "comz", "core": false, "effect": {"comz": 8}, "text": "The revolution either abolishes exchange at the outset or it isn't a communist revolution at all."}, {"id": "comz06", "axis": "comz", "core": false, "effect": {"comz": 7}, "text": "Producing for need rather than for exchange has to start on day one, not after a period of accumulation."}, {"id": "comz07", "axis": "comz", "core": true, "effect": {"comz": -10}, "text": "A transitional period of workers' state power is necessary before value and wage labour can be abolished."}, {"id": "comz08", "axis": "comz", "core": true, "effect": {"comz": -9}, "text": "Trying to abolish exchange immediately, before production has developed, produces only generalised scarcity."}, {"id": "comz09", "axis": "comz", "core": true, "effect": {"comz": -8}, "text": "The dictatorship of the proletariat is a real stage, not a formula to be skipped over."}, {"id": "comz10", "axis": "comz", "core": false, "effect": {"comz": -10}, "text": "Communism has to be built up through planned development, not declared into existence overnight."}, {"id": "comz11", "axis": "comz", "core": false, "effect": {"comz": -8}, "text": "Without a period of proletarian state power, the old ruling class simply retakes what was taken from it."}, {"id": "comz12", "axis": "comz", "core": false, "effect": {"comz": -7}, "text": "The idea that communism can be achieved in a single stroke underestimates what it takes to reorganise production."}, {"id": "site01", "axis": "site", "core": true, "effect": {"site": 10}, "text": "Reproducing daily life outside the wage relation is as much a terrain of struggle as the factory floor."}, {"id": "site02", "axis": "site", "core": true, "effect": {"site": 9}, "text": "The revolution has to transform housework, care, and consumption, not just the point of production."}, {"id": "site03", "axis": "site", "core": true, "effect": {"site": 8}, "text": "Struggles in the neighbourhood and the household are not secondary to the strike; they are part of the same struggle."}, {"id": "site04", "axis": "site", "core": false, "effect": {"site": 10}, "text": "Capital organises life outside the workplace as thoroughly as it organises work, and both have to be contested."}, {"id": "site05", "axis": "site", "core": false, "effect": {"site": 8}, "text": "A revolution that changes ownership of the factories but leaves domestic and social reproduction untouched has changed less than it thinks."}, {"id": "site06", "axis": "site", "core": false, "effect": {"site": 7}, "text": "The community, not only the workplace, is where the working class actually lives its condition."}, {"id": "site07", "axis": "site", "core": true, "effect": {"site": -10}, "text": "The wage relation at the point of production is the foundation everything else rests on; struggles elsewhere are secondary to it."}, {"id": "site08", "axis": "site", "core": true, "effect": {"site": -9}, "text": "Whoever controls production controls the rest of social life as a consequence."}, {"id": "site09", "axis": "site", "core": true, "effect": {"site": -8}, "text": "Focusing on lifestyle and everyday life is a retreat from the discipline of class struggle at work."}, {"id": "site10", "axis": "site", "core": false, "effect": {"site": -10}, "text": "The factory remains the decisive site because that is where surplus value is actually extracted."}, {"id": "site11", "axis": "site", "core": false, "effect": {"site": -8}, "text": "Struggles over consumption and daily life rarely generalise the way strikes at the point of production do."}, {"id": "site12", "axis": "site", "core": false, "effect": {"site": -7}, "text": "Organising the workplace is harder and more decisive than organising the neighbourhood, and should be prioritised."}, {"id": "unio01", "axis": "unio", "core": true, "effect": {"unio": 10}, "text": "Trade unions today function to manage and contain working-class discontent on capital's behalf."}, {"id": "unio02", "axis": "unio", "core": true, "effect": {"unio": 9}, "text": "A union's job is to negotiate the price of labour power, which means administering exploitation, not ending it."}, {"id": "unio03", "axis": "unio", "core": true, "effect": {"unio": 8}, "text": "Union bureaucracies have interests of their own that diverge from the rank and file's."}, {"id": "unio04", "axis": "unio", "core": false, "effect": {"unio": 10}, "text": "The more successfully a union is integrated into collective bargaining, the less capable it is of revolutionary action."}, {"id": "unio05", "axis": "unio", "core": false, "effect": {"unio": 8}, "text": "Permanent union structures tend to outlive their usefulness and become obstacles to wildcat action."}, {"id": "unio06", "axis": "unio", "core": false, "effect": {"unio": 7}, "text": "Workers acting outside and against their own unions is sometimes the only way forward."}, {"id": "unio07", "axis": "unio", "core": true, "effect": {"unio": -10}, "text": "Mass unions remain the indispensable organisational vehicle through which the working class builds its power."}, {"id": "unio08", "axis": "unio", "core": true, "effect": {"unio": -9}, "text": "Abandoning the unions cedes the largest existing workers' organisations to the class enemy for nothing."}, {"id": "unio09", "axis": "unio", "core": true, "effect": {"unio": -8}, "text": "Building rank-and-file strength inside the unions is more realistic than trying to bypass them."}, {"id": "unio10", "axis": "unio", "core": false, "effect": {"unio": -10}, "text": "A union, whatever its bureaucracy's faults, still organises workers on a scale nothing else does."}, {"id": "unio11", "axis": "unio", "core": false, "effect": {"unio": -8}, "text": "Syndicalist strategy has a real record of building working-class power that dismissing the unions ignores."}, {"id": "unio12", "axis": "unio", "core": false, "effect": {"unio": -7}, "text": "Even a compromised union is a better base for organising than none at all."}, {"id": "parl01", "axis": "parl", "core": true, "effect": {"parl": 10}, "text": "Standing candidates for parliament can be used to build revolutionary organisation and propaganda even without illusions in the state."}, {"id": "parl02", "axis": "parl", "core": true, "effect": {"parl": 9}, "text": "Winning a parliamentary majority is one legitimate route among others to transforming society."}, {"id": "parl03", "axis": "parl", "core": true, "effect": {"parl": 8}, "text": "Revolutionaries should use every legal opening, including elections, that helps organise the class."}, {"id": "parl04", "axis": "parl", "core": false, "effect": {"parl": 10}, "text": "A seat in parliament gives a platform that street agitation alone cannot reach."}, {"id": "parl05", "axis": "parl", "core": false, "effect": {"parl": 8}, "text": "Refusing all engagement with representative institutions cuts revolutionaries off from millions of workers who still vote."}, {"id": "parl06", "axis": "parl", "core": false, "effect": {"parl": 7}, "text": "Participating in elections tactically does not commit a movement to parliamentary illusions."}, {"id": "parl07", "axis": "parl", "core": true, "effect": {"parl": -10}, "text": "Parliament is a capitalist institution that cannot be used for revolutionary ends, however tactically it is approached."}, {"id": "parl08", "axis": "parl", "core": true, "effect": {"parl": -9}, "text": "Voting confirms the fiction that the state represents the interests of those it rules over."}, {"id": "parl09", "axis": "parl", "core": true, "effect": {"parl": -8}, "text": "Every experience of workers' parties entering parliament has ended in their absorption into the system."}, {"id": "parl10", "axis": "parl", "core": false, "effect": {"parl": -10}, "text": "Abstention from elections is a matter of principle, not a tactic to be weighed case by case."}, {"id": "parl11", "axis": "parl", "core": false, "effect": {"parl": -8}, "text": "A revolutionary organisation that contests elections has already accepted the terrain the state has set for it."}, {"id": "parl12", "axis": "parl", "core": false, "effect": {"parl": -7}, "text": "Direct action outside all institutional channels is the only form of politics that hasn't been recuperated."}, {"id": "natl01", "axis": "natl", "core": true, "effect": {"natl": -10}, "text": "Anti-colonial and national liberation struggles deserve support as blows against imperialism, whatever their internal class content."}, {"id": "natl02", "axis": "natl", "core": true, "effect": {"natl": -9}, "text": "Backing a national liberation movement against a colonial power is a defensible tactical choice for internationalists."}, {"id": "natl03", "axis": "natl", "core": true, "effect": {"natl": -8}, "text": "National liberation struggles, whatever their limits, weaken the world system revolutionaries are trying to overthrow."}, {"id": "natl04", "axis": "natl", "core": false, "effect": {"natl": -10}, "text": "Solidarity with the colonised is owed even when the movement leading the struggle is not itself communist."}, {"id": "natl05", "axis": "natl", "core": false, "effect": {"natl": -8}, "text": "Refusing to distinguish coloniser from colonised in the name of pure class politics ends up serving the coloniser."}, {"id": "natl06", "axis": "natl", "core": false, "effect": {"natl": -7}, "text": "A national liberation struggle can be a genuine front of the wider struggle against capital."}, {"id": "natl07", "axis": "natl", "core": true, "effect": {"natl": 10}, "text": "The nation is a bourgeois category, and no national struggle, colonial or otherwise, is a proletarian one."}, {"id": "natl08", "axis": "natl", "core": true, "effect": {"natl": 9}, "text": "Support for national liberation always ends up subordinating class struggle to a new nationalist ruling class."}, {"id": "natl09", "axis": "natl", "core": true, "effect": {"natl": 8}, "text": "Every national liberation movement in power has built a new state that exploits its own working class."}, {"id": "natl10", "axis": "natl", "core": false, "effect": {"natl": 10}, "text": "Internationalism means refusing all national flags, including those raised against colonialism."}, {"id": "natl11", "axis": "natl", "core": false, "effect": {"natl": 8}, "text": "A struggle organised around the nation cannot, by its nature, point toward the abolition of classes."}, {"id": "natl12", "axis": "natl", "core": false, "effect": {"natl": 7}, "text": "Solidarity should go to the proletariat inside a colonised country, never to the movement claiming to speak for the nation as a whole."}, {"id": "insu01", "axis": "insu", "core": true, "effect": {"insu": -10}, "text": "Mass strikes that draw in the whole class are the movement's most powerful weapon."}, {"id": "insu02", "axis": "insu", "core": true, "effect": {"insu": -9}, "text": "The revolution will be made by the broad movement of the class, not by any smaller group acting on its behalf."}, {"id": "insu03", "axis": "insu", "core": true, "effect": {"insu": -8}, "text": "A generalised strike, spreading through solidarity rather than leadership, is the model of revolutionary action."}, {"id": "insu04", "axis": "insu", "core": false, "effect": {"insu": -10}, "text": "Building toward a mass strike is more valuable than any isolated action a small group could carry out."}, {"id": "insu05", "axis": "insu", "core": false, "effect": {"insu": -8}, "text": "The class moves as a class or it doesn't move at all; there is no substitute for its numbers."}, {"id": "insu06", "axis": "insu", "core": false, "effect": {"insu": -7}, "text": "Wide participation, even if less disciplined, beats a small group's more coordinated action."}, {"id": "insu07", "axis": "insu", "core": true, "effect": {"insu": 10}, "text": "Small groups willing to act decisively can break an impasse that a mass movement, waiting for consensus, cannot."}, {"id": "insu08", "axis": "insu", "core": true, "effect": {"insu": 9}, "text": "Riot, sabotage, and expropriation are legitimate tactics regardless of whether the broader class is yet moving."}, {"id": "insu09", "axis": "insu", "core": true, "effect": {"insu": 8}, "text": "Waiting for a mass movement to arrive before acting means never acting at all."}, {"id": "insu10", "axis": "insu", "core": false, "effect": {"insu": 10}, "text": "A determined minority that acts can open possibilities a passive majority never would have found on its own."}, {"id": "insu11", "axis": "insu", "core": false, "effect": {"insu": 8}, "text": "Direct, immediate action matters more than building the numbers for a hypothetical future mass strike."}, {"id": "insu12", "axis": "insu", "core": false, "effect": {"insu": 7}, "text": "Insurrectionary action doesn't need to wait for the working class as a whole to be ready."}]}, "3": {"meta": {"module": 2, "bucketId": 3, "bucket": "Anarchism", "version": "0.1-draft", "questionCount": 96, "shortFormCount": 48, "scoring": {"answerScale": [{"label": "Strongly Agree", "mult": 1.0}, {"label": "Agree", "mult": 0.5}, {"label": "Neutral / Unsure", "mult": 0.0}, {"label": "Disagree", "mult": -0.5}, {"label": "Strongly Disagree", "mult": -1.0}], "formula": "raw[axis] = sum(mult * effect[axis]); max[axis] = sum(abs(effect[axis])); score[axis] = 100 * (max + raw) / (2 * max)"}, "presentation": "Stored grouped by axis for maintainability. The app must SHUFFLE at runtime with a fixed seed so consecutive items do not come from the same axis."}, "axes": [{"key": "vehi", "name": "Organisational Vehicle", "negPole": "Mass Union / Syndicate", "posPole": "Affinity Group / Informal Network"}, {"key": "disc", "name": "Organisational Discipline", "negPole": "Synthesis / Loose Federation", "posPole": "Programmatic Unity & Collective Responsibility"}, {"key": "prop", "name": "Property Form", "negPole": "Full Communism / To Each by Need", "posPole": "Individual Possession & Exchange"}, {"key": "viol", "name": "Means", "negPole": "Strict Nonviolence", "posPole": "Insurrectionary Force"}, {"key": "tech", "name": "Technology & Civilisation", "negPole": "Embrace Industry & Technology", "posPole": "Reject Civilisation"}, {"key": "pref", "name": "Strategy", "negPole": "Prefigurative Counter-Institutions", "posPole": "Destructive Rupture, No Blueprint"}, {"key": "muni", "name": "Territorial Politics", "negPole": "Reject All Governmental Forms", "posPole": "Confederated Municipal Assemblies"}, {"key": "oppr", "name": "Analytical Primacy", "negPole": "Class Struggle Primary", "posPole": "Intersecting Dominations Primary"}], "subIdeologies": [{"name": "Anarcho-Communism (Kropotkin)", "umbrella": false, "anchor": {"vehi": 40, "disc": 40, "prop": 2, "viol": 60, "tech": 15, "pref": 35, "muni": 45, "oppr": 20}}, {"name": "Anarcho-Syndicalism", "umbrella": false, "anchor": {"vehi": 2, "disc": 62, "prop": 15, "viol": 50, "tech": 5, "pref": 20, "muni": 25, "oppr": 3}}, {"name": "Collectivist Anarchism (Bakunin)", "umbrella": false, "anchor": {"vehi": 22, "disc": 68, "prop": 32, "viol": 72, "tech": 10, "pref": 30, "muni": 40, "oppr": 8}}, {"name": "Mutualism (Proudhon)", "umbrella": false, "anchor": {"vehi": 55, "disc": 18, "prop": 92, "viol": 22, "tech": 20, "pref": 5, "muni": 55, "oppr": 35}}, {"name": "Individualist Anarchism (Stirner)", "umbrella": false, "anchor": {"vehi": 94, "disc": 2, "prop": 96, "viol": 55, "tech": 30, "pref": 62, "muni": 5, "oppr": 58}}, {"name": "Platformism (Makhno/Arshinov)", "umbrella": false, "anchor": {"vehi": 15, "disc": 94, "prop": 8, "viol": 55, "tech": 8, "pref": 20, "muni": 35, "oppr": 10}}, {"name": "Especifismo", "umbrella": false, "anchor": {"vehi": 50, "disc": 96, "prop": 10, "viol": 55, "tech": 8, "pref": 30, "muni": 55, "oppr": 32}}, {"name": "Green / Eco-Anarchism", "umbrella": false, "anchor": {"vehi": 70, "disc": 30, "prop": 20, "viol": 55, "tech": 78, "pref": 30, "muni": 58, "oppr": 60}}, {"name": "Anarcho-Primitivism (Zerzan)", "umbrella": false, "anchor": {"vehi": 88, "disc": 4, "prop": 42, "viol": 76, "tech": 100, "pref": 72, "muni": 4, "oppr": 66}}, {"name": "Social Ecology / Communalism", "umbrella": false, "anchor": {"vehi": 45, "disc": 60, "prop": 10, "viol": 28, "tech": 30, "pref": 6, "muni": 98, "oppr": 52}}, {"name": "Post-Left Anarchy", "umbrella": false, "anchor": {"vehi": 90, "disc": 2, "prop": 60, "viol": 70, "tech": 66, "pref": 88, "muni": 2, "oppr": 72}}, {"name": "Insurrectionary Anarchism", "umbrella": false, "anchor": {"vehi": 96, "disc": 4, "prop": 14, "viol": 99, "tech": 60, "pref": 96, "muni": 2, "oppr": 55}}, {"name": "Anarcha-Feminism", "umbrella": false, "anchor": {"vehi": 52, "disc": 35, "prop": 14, "viol": 42, "tech": 24, "pref": 45, "muni": 42, "oppr": 92}}, {"name": "Christian Anarchism (Tolstoy)", "umbrella": false, "anchor": {"vehi": 80, "disc": 12, "prop": 14, "viol": 4, "tech": 62, "pref": 26, "muni": 12, "oppr": 66}}, {"name": "Anarcho-Pacifism", "umbrella": false, "anchor": {"vehi": 58, "disc": 28, "prop": 32, "viol": 0, "tech": 45, "pref": 18, "muni": 42, "oppr": 52}}, {"name": "Queer Anarchism", "umbrella": false, "anchor": {"vehi": 82, "disc": 18, "prop": 24, "viol": 60, "tech": 34, "pref": 68, "muni": 22, "oppr": 97}}, {"name": "Black Anarchism", "umbrella": false, "anchor": {"vehi": 50, "disc": 55, "prop": 8, "viol": 78, "tech": 20, "pref": 45, "muni": 55, "oppr": 80}}], "questions": [{"id": "vehi01", "axis": "vehi", "core": true, "effect": {"vehi": 10}, "text": "Small groups of trusted comrades acting on shared affinity are a more honest basis for organising than any mass structure."}, {"id": "vehi02", "axis": "vehi", "core": true, "effect": {"vehi": 9}, "text": "Formal, large-membership organisations tend to develop the very hierarchies anarchists are trying to abolish."}, {"id": "vehi03", "axis": "vehi", "core": true, "effect": {"vehi": 8}, "text": "An affinity group can move faster and stay truer to its principles than a mass union ever could."}, {"id": "vehi04", "axis": "vehi", "core": false, "effect": {"vehi": 10}, "text": "Informal networks of relationships are a more resilient basis for revolutionary organising than any formal structure."}, {"id": "vehi05", "axis": "vehi", "core": false, "effect": {"vehi": 8}, "text": "The intimacy of a small group protects against the bureaucratic drift that larger organisations can't avoid."}, {"id": "vehi06", "axis": "vehi", "core": false, "effect": {"vehi": 7}, "text": "Building loose, overlapping networks beats building one large durable organisation."}, {"id": "vehi07", "axis": "vehi", "core": true, "effect": {"vehi": -10}, "text": "A mass union rooted in the workplace is the only vehicle with the numbers to actually confront capital."}, {"id": "vehi08", "axis": "vehi", "core": true, "effect": {"vehi": -9}, "text": "Organising has to scale to the size of the working class, which means building large membership structures."}, {"id": "vehi09", "axis": "vehi", "core": true, "effect": {"vehi": -8}, "text": "Small affinity groups can be principled, but they will never have the leverage a mass organisation has."}, {"id": "vehi10", "axis": "vehi", "core": false, "effect": {"vehi": -10}, "text": "The union floor, not the affinity group, is where most workers actually encounter anarchist ideas."}, {"id": "vehi11", "axis": "vehi", "core": false, "effect": {"vehi": -8}, "text": "Durable mass organisation, not informal networking, is what turns sympathy into a movement."}, {"id": "vehi12", "axis": "vehi", "core": false, "effect": {"vehi": -7}, "text": "A revolutionary union federation can mobilise numbers that no network of small groups can match."}, {"id": "disc01", "axis": "disc", "core": true, "effect": {"disc": 10}, "text": "An anarchist organisation should unite around a single strategic programme that binds every member."}, {"id": "disc02", "axis": "disc", "core": true, "effect": {"disc": 9}, "text": "Collective responsibility for the organisation's decisions is a serious commitment members should be held to."}, {"id": "disc03", "axis": "disc", "core": true, "effect": {"disc": 8}, "text": "A federation that tolerates real disagreement over strategy and ideology among its affiliates ends up capable of nothing."}, {"id": "disc04", "axis": "disc", "core": false, "effect": {"disc": 10}, "text": "Tactical unity across an organisation matters more than accommodating every internal disagreement."}, {"id": "disc05", "axis": "disc", "core": false, "effect": {"disc": 8}, "text": "An organisation strong enough to act needs agreed positions its members are expected to defend."}, {"id": "disc06", "axis": "disc", "core": false, "effect": {"disc": 7}, "text": "Programmatic coherence is what let some anarchist organisations act decisively where looser ones couldn't."}, {"id": "disc07", "axis": "disc", "core": true, "effect": {"disc": -10}, "text": "A federation should be a loose space where different anarchist tendencies coexist without a single binding programme."}, {"id": "disc08", "axis": "disc", "core": true, "effect": {"disc": -9}, "text": "Requiring ideological and tactical unity narrows a federation into a sect."}, {"id": "disc09", "axis": "disc", "core": true, "effect": {"disc": -8}, "text": "Anarchist organisation should preserve the autonomy of each group and current within it, not override it."}, {"id": "disc10", "axis": "disc", "core": false, "effect": {"disc": -10}, "text": "A synthesis of communists, syndicalists, and individualists in one federation is a strength, not a weakness."}, {"id": "disc11", "axis": "disc", "core": false, "effect": {"disc": -8}, "text": "Binding collective responsibility on individual members contradicts anarchism's basic commitments."}, {"id": "disc12", "axis": "disc", "core": false, "effect": {"disc": -7}, "text": "The looser the federation, the more genuinely anarchist its internal life remains."}, {"id": "prop01", "axis": "prop", "core": true, "effect": {"prop": -10}, "text": "Goods should be distributed according to need, with no accounting of what any individual contributed."}, {"id": "prop02", "axis": "prop", "core": true, "effect": {"prop": -9}, "text": "Money and exchange between individuals should be abolished, not merely redistributed more fairly."}, {"id": "prop03", "axis": "prop", "core": true, "effect": {"prop": -8}, "text": "Even labour itself should not be measured or exchanged once scarcity is overcome."}, {"id": "prop04", "axis": "prop", "core": false, "effect": {"prop": -10}, "text": "Full communism, not mutual exchange, is the goal a genuinely free society should aim at."}, {"id": "prop05", "axis": "prop", "core": false, "effect": {"prop": -8}, "text": "Once production is collectivised, the next step is abolishing exchange between individuals altogether."}, {"id": "prop06", "axis": "prop", "core": false, "effect": {"prop": -7}, "text": "A free society has no need to track who produced what."}, {"id": "prop07", "axis": "prop", "core": true, "effect": {"prop": 10}, "text": "Individuals should hold and freely exchange the product of their own labour rather than pool it into a common stock."}, {"id": "prop08", "axis": "prop", "core": true, "effect": {"prop": 9}, "text": "Mutual credit between free associations of producers is a fairer basis for exchange than pooling everything in common."}, {"id": "prop09", "axis": "prop", "core": true, "effect": {"prop": 8}, "text": "Possession of what one uses and produces is legitimate; ownership of what one doesn't is not."}, {"id": "prop10", "axis": "prop", "core": false, "effect": {"prop": 10}, "text": "A market of small producers exchanging freely, without capital

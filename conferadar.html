tive commitments."}, {"id": "econ12", "axis": "econ", "core": false, "effect": {"econ": -7}, "text": "The state should mainly get out of the way and let markets and individual enterprise do the work."}, {"id": "forp01", "axis": "forp", "core": true, "effect": {"forp": 10}, "text": "A country should actively use its power abroad to defend its interests and allies, even through military means."}, {"id": "forp02", "axis": "forp", "core": true, "effect": {"forp": 9}, "text": "Standing by while threats to the international order grow unchecked is itself a dangerous policy."}, {"id": "forp03", "axis": "forp", "core": true, "effect": {"forp": 8}, "text": "Strength and willingness to act abroad deters aggression better than restraint does."}, {"id": "forp04", "axis": "forp", "core": false, "effect": {"forp": 10}, "text": "A great power has responsibilities beyond its own borders that sometimes require intervention."}, {"id": "forp05", "axis": "forp", "core": false, "effect": {"forp": 8}, "text": "Isolationism leaves a vacuum that hostile powers are happy to fill."}, {"id": "forp06", "axis": "forp", "core": false, "effect": {"forp": 7}, "text": "Credible military commitments abroad are a core part of national strength."}, {"id": "forp07", "axis": "forp", "core": true, "effect": {"forp": -10}, "text": "Foreign wars and entanglements rarely serve the actual national interest and should be avoided."}, {"id": "forp08", "axis": "forp", "core": true, "effect": {"forp": -9}, "text": "A country's first duty is to its own people, not to policing the rest of the world."}, {"id": "forp09", "axis": "forp", "core": true, "effect": {"forp": -8}, "text": "Restraint abroad conserves the resources and cohesion a nation needs at home."}, {"id": "forp10", "axis": "forp", "core": false, "effect": {"forp": -10}, "text": "Nation-building efforts overseas have mostly failed and shouldn't be repeated."}, {"id": "forp11", "axis": "forp", "core": false, "effect": {"forp": -8}, "text": "A modest, defensive foreign policy serves the nation better than an interventionist one."}, {"id": "forp12", "axis": "forp", "core": false, "effect": {"forp": -7}, "text": "Foreign entanglements distract from and drain resources away from problems at home."}, {"id": "reli01", "axis": "reli", "core": true, "effect": {"reli": -10}, "text": "Public life can be conducted on shared civic and moral terms without appeal to any particular religious tradition."}, {"id": "reli02", "axis": "reli", "core": true, "effect": {"reli": -9}, "text": "A pluralist society is better served by secular civic institutions than by religiously grounded ones."}, {"id": "reli03", "axis": "reli", "core": true, "effect": {"reli": -8}, "text": "Conservatism does not require religious belief; a secular tradition of prudence and order is enough."}, {"id": "reli04", "axis": "reli", "core": false, "effect": {"reli": -10}, "text": "Public policy should be justified in terms accessible to believers and non-believers alike."}, {"id": "reli05", "axis": "reli", "core": false, "effect": {"reli": -8}, "text": "Religious institutions should stay out of formal political power, whatever moral influence they retain informally."}, {"id": "reli06", "axis": "reli", "core": false, "effect": {"reli": -7}, "text": "A conservative order can rest on custom and civic virtue without needing a religious foundation."}, {"id": "reli07", "axis": "reli", "core": true, "effect": {"reli": 10}, "text": "A society's moral order should be explicitly grounded in religious faith and tradition."}, {"id": "reli08", "axis": "reli", "core": true, "effect": {"reli": 9}, "text": "Religious institutions and teaching deserve a formal, protected place in public life."}, {"id": "reli09", "axis": "reli", "core": true, "effect": {"reli": 8}, "text": "A nation's laws and public morality lose their foundation once they're cut off from religious grounding."}, {"id": "reli10", "axis": "reli", "core": false, "effect": {"reli": 10}, "text": "Faith communities should have real influence over policies touching family, life, and public morality."}, {"id": "reli11", "axis": "reli", "core": false, "effect": {"reli": 8}, "text": "A confessional foundation gives a society's moral order a stability that secular reasoning alone cannot."}, {"id": "reli12", "axis": "reli", "core": false, "effect": {"reli": 7}, "text": "Public education and law should reflect the religious tradition of the community, not stand apart from it."}, {"id": "iden01", "axis": "iden", "core": true, "effect": {"iden": -10}, "text": "National identity should be open to anyone who embraces the country's civic institutions and values, regardless of ancestry."}, {"id": "iden02", "axis": "iden", "core": true, "effect": {"iden": -9}, "text": "Shared commitment to a country's constitution and civic culture, not shared ancestry, is what makes someone a member of the nation."}, {"id": "iden03", "axis": "iden", "core": true, "effect": {"iden": -8}, "text": "Immigrants who adopt the nation's institutions and civic values are as fully members of it as anyone born there."}, {"id": "iden04", "axis": "iden", "core": false, "effect": {"iden": -10}, "text": "A nation is best understood as a community of citizens united by law and creed."}, {"id": "iden05", "axis": "iden", "core": false, "effect": {"iden": -8}, "text": "What binds a nation together is allegiance to its principles, not descent from a common stock."}, {"id": "iden06", "axis": "iden", "core": false, "effect": {"iden": -7}, "text": "Citizenship, properly earned, confers full national belonging regardless of ethnic background."}, {"id": "iden07", "axis": "iden", "core": true, "effect": {"iden": 10}, "text": "A nation is fundamentally a people with a shared ancestry, culture, and history, not just a set of institutions."}, {"id": "iden08", "axis": "iden", "core": true, "effect": {"iden": 9}, "text": "Large-scale demographic change poses a real threat to a nation's cultural continuity."}, {"id": "iden09", "axis": "iden", "core": true, "effect": {"iden": 8}, "text": "A country's historic ethnic and cultural core deserves special protection and priority."}, {"id": "iden10", "axis": "iden", "core": false, "effect": {"iden": 10}, "text": "National identity is inherited, not simply chosen by anyone who adopts the country's institutions."}, {"id": "iden11", "axis": "iden", "core": false, "effect": {"iden": 8}, "text": "Preserving a nation's traditional cultural character is a legitimate goal of immigration policy."}, {"id": "iden12", "axis": "iden", "core": false, "effect": {"iden": 7}, "text": "A common ancestry and cultural inheritance are what make a people a nation, more than any legal document."}, {"id": "chng01", "axis": "chng", "core": true, "effect": {"chng": -10}, "text": "Institutions should be reformed gradually and cautiously, correcting flaws without discarding what works."}, {"id": "chng02", "axis": "chng", "core": true, "effect": {"chng": -9}, "text": "Prudent, incremental adjustment is the responsible conservative approach to a changing world."}, {"id": "chng03", "axis": "chng", "core": true, "effect": {"chng": -8}, "text": "Change should be tested and reversible, not sweeping and irreversible."}, {"id": "chng04", "axis": "chng", "core": false, "effect": {"chng": -10}, "text": "A conservative should be willing to reform institutions that have genuinely stopped serving their purpose."}, {"id": "chng05", "axis": "chng", "core": false, "effect": {"chng": -8}, "text": "Careful, piecemeal improvement respects both the wisdom of the past and the needs of the present."}, {"id": "chng06", "axis": "chng", "core": false, "effect": {"chng": -7}, "text": "Conservatism at its best manages change rather than simply resisting it."}, {"id": "chng07", "axis": "chng", "core": true, "effect": {"chng": 10}, "text": "Society has drifted so far from its proper order that a real restoration, not just gradual correction, is needed."}, {"id": "chng08", "axis": "chng", "core": true, "effect": {"chng": 9}, "text": "Many of the last century's changes were net losses that deserve to be reversed, not merely managed."}, {"id": "chng09", "axis": "chng", "core": true, "effect": {"chng": 8}, "text": "Cautious reform is inadequate when the institutions themselves have been captured by the wrong values."}, {"id": "chng10", "axis": "chng", "core": false, "effect": {"chng": 10}, "text": "A return to an earlier, sounder order is a legitimate political goal, not mere nostalgia."}, {"id": "chng11", "axis": "chng", "core": false, "effect": {"chng": 8}, "text": "What's needed now is restoration, not incremental adjustment within a fundamentally compromised system."}, {"id": "chng12", "axis": "chng", "core": false, "effect": {"chng": 7}, "text": "Gradualism is too slow a response to how far things have already gone wrong."}, {"id": "stat01", "axis": "stat", "core": true, "effect": {"stat": -10}, "text": "Government should be kept small, with most decisions left to individuals, families, and local communities."}, {"id": "stat02", "axis": "stat", "core": true, "effect": {"stat": -9}, "text": "Centralised state power, even used for conservative ends, tends to outgrow its original purpose."}, {"id": "stat03", "axis": "stat", "core": true, "effect": {"stat": -8}, "text": "A conservative should be as wary of an activist state as of a radical one."}, {"id": "stat04", "axis": "stat", "core": false, "effect": {"stat": -10}, "text": "Power should be devolved downward whenever possible, away from central government."}, {"id": "stat05", "axis": "stat", "core": false, "effect": {"stat": -8}, "text": "Local and voluntary institutions handle most social problems better than a central bureaucracy does."}, {"id": "stat06", "axis": "stat", "core": false, "effect": {"stat": -7}, "text": "The instinct to expand state authority, whatever the intent behind it, deserves conservative suspicion."}, {"id": "stat07", "axis": "stat", "core": true, "effect": {"stat": 10}, "text": "A strong, capable central state is necessary to defend the national order and enforce its values."}, {"id": "stat08", "axis": "stat", "core": true, "effect": {"stat": 9}, "text": "Conservatives should be willing to use state power decisively, not just resist its growth."}, {"id": "stat09", "axis": "stat", "core": true, "effect": {"stat": 8}, "text": "Effective governance sometimes requires a strong executive able to act without being bogged down by every institutional check."}, {"id": "stat10", "axis": "stat", "core": false, "effect": {"stat": 10}, "text": "A weak state cannot actually protect the traditions and order conservatives care about."}, {"id": "stat11", "axis": "stat", "core": false, "effect": {"stat": 8}, "text": "Directing state power toward explicitly conservative ends is a legitimate and necessary strategy."}, {"id": "stat12", "axis": "stat", "core": false, "effect": {"stat": 7}, "text": "Institutional gridlock is as much an enemy of good order as an overreaching state."}, {"id": "cpol01", "axis": "cpol", "core": true, "effect": {"cpol": -10}, "text": "Moral order in society is best sustained through persuasion, example, and civil institutions, not legal compulsion."}, {"id": "cpol02", "axis": "cpol", "core": true, "effect": {"cpol": -9}, "text": "The law should stay fairly neutral on questions of personal and family morality."}, {"id": "cpol03", "axis": "cpol", "core": true, "effect": {"cpol": -8}, "text": "Cultural and moral renewal has to come from within communities and institutions, not from legislation."}, {"id": "cpol04", "axis": "cpol", "core": false, "effect": {"cpol": -10}, "text": "Using the law to enforce a particular moral vision usually backfires and breeds resentment."}, {"id": "cpol05", "axis": "cpol", "core": false, "effect": {"cpol": -8}, "text": "Civil society \u2014 family, church, community \u2014 should carry the weight of moral formation, not the state."}, {"id": "cpol06", "axis": "cpol", "core": false, "effect": {"cpol": -7}, "text": "Persuasion within a free society is a more legitimate route to moral order than legal coercion."}, {"id": "cpol07", "axis": "cpol", "core": true, "effect": {"cpol": 10}, "text": "The law should actively uphold and enforce the community's moral and social order, not remain neutral on it."}, {"id": "cpol08", "axis": "cpol", "core": true, "effect": {"cpol": 9}, "text": "Legal enforcement of core moral norms \u2014 around family, life, and public decency \u2014 is a proper role of government."}, {"id": "cpol09", "axis": "cpol", "core": true, "effect": {"cpol": 8}, "text": "A society that refuses to legislate morality has already lost the fight over what its public order should be."}, {"id": "cpol10", "axis": "cpol", "core": false, "effect": {"cpol": 10}, "text": "Some questions of right and wrong are too important to leave to persuasion alone; the law has to take a side."}, {"id": "cpol11", "axis": "cpol", "core": false, "effect": {"cpol": 8}, "text": "Protecting the moral fabric of society sometimes requires using the law, not just cultural argument."}, {"id": "cpol12", "axis": "cpol", "core": false, "effect": {"cpol": 7}, "text": "A conservative government should be willing to legislate its moral convictions, not just hold them privately."}, {"id": "popu01", "axis": "popu", "core": true, "effect": {"popu": -10}, "text": "Experienced, established leaders and institutions should generally be trusted over popular anger at them."}, {"id": "popu02", "axis": "popu", "core": true, "effect": {"popu": -9}, "text": "Political stability depends on deference to competent, tested institutions rather than constant upheaval."}, {"id": "popu03", "axis": "popu", "core": true, "effect": {"popu": -8}, "text": "Conservatism is fundamentally about preserving established authority, not overturning it in the name of the people."}, {"id": "popu04", "axis": "popu", "core": false, "effect": {"popu": -10}, "text": "Elite expertise, however imperfect, usually outperforms populist mobilisation at actual governing."}, {"id": "popu05", "axis": "popu", "core": false, "effect": {"popu": -8}, "text": "A conservative should be suspicious of movements that promise to sweep away the existing establishment entirely."}, {"id": "popu06", "axis": "popu", "core": false, "effect": {"popu": -7}, "text": "Respect for established institutions and their leadership is itself a conservative virtue."}, {"id": "popu07", "axis": "popu", "core": true, "effect": {"popu": 10}, "text": "The existing political and cultural establishment has betrayed ordinary people and deserves to be swept aside."}, {"id": "popu08", "axis": "popu", "core": true, "effect": {"popu": 9}, "text": "Popular anger at entrenched elites is a legitimate and healthy political force, not something to be managed away."}, {"id": "popu09", "axis": "popu", "core": true, "effect": {"popu": 8}, "text": "Mobilising ordinary people against an unresponsive establishment is a legitimate conservative strategy."}, {"id": "popu10", "axis": "popu", "core": false, "effect": {"popu": 10}, "text": "Elites who no longer represent the nation's real interests and values have forfeited their claim to deference."}, {"id": "popu11", "axis": "popu", "core": false, "effect": {"popu": 8}, "text": "A movement that channels popular grievance against the establishment can be a genuinely conservative one."}, {"id": "popu12", "axis": "popu", "core": false, "effect": {"popu": 7}, "text": "Established institutions have drifted so far from the public they serve that they no longer deserve automatic trust."}]}, "8": {"meta": {"module": 2, "bucketId": 8, "bucket": "Fascism / Third Position / National-Populism", "version": "0.1-draft", "questionCount": 96, "shortFormCount": 48, "scoring": {"answerScale": [{"label": "Strongly Agree", "mult": 1.0}, {"label": "Agree", "mult": 0.5}, {"label": "Neutral / Unsure", "mult": 0.0}, {"label": "Disagree", "mult": -0.5}, {"label": "Strongly Disagree", "mult": -1.0}], "formula": "raw[axis] = sum(mult * effect[axis]); max[axis] = sum(abs(effect[axis])); score[axis] = 100 * (max + raw) / (2 * max)"}, "presentation": "Stored grouped by axis for maintainability. The app must SHUFFLE at runtime with a fixed seed so consecutive items do not come from the same axis."}, "axes": [{"key": "race", "name": "Basis of Belonging", "negPole": "Cultural / Statist Nationalism", "posPole": "Biological Racial Determinism"}, {"key": "econ", "name": "Economic Doctrine", "negPole": "Anti-Capitalist / Socialising", "posPole": "Alliance with Existing Capital"}, {"key": "reli", "name": "Religion", "negPole": "Secular / Neo-Pagan / Anti-Clerical", "posPole": "Confessional-Clerical"}, {"key": "regi", "name": "Regime Form", "negPole": "Authoritarian Conservative Order", "posPole": "Totalitarian Mass Party"}, {"key": "impe", "name": "External Ambition", "negPole": "Defensive Nationalism", "posPole": "Expansionist Empire"}, {"key": "myst", "name": "Register", "negPole": "Rationalist-Technocratic Statism", "posPole": "Palingenetic Myth & Rebirth"}, {"key": "corp", "name": "Economic Structure", "negPole": "Direct State Command", "posPole": "Corporatist / Syndical Intermediation"}, {"key": "mode", "name": "Modernity", "negPole": "Futurist / Pro-Industrial", "posPole": "Agrarian-Traditional / Anti-Modern"}], "subIdeologies": [{"name": "Italian Fascism (Mussolini)", "umbrella": false, "anchor": {"race": 25, "econ": 55, "reli": 35, "regi": 85, "impe": 88, "myst": 70, "corp": 85, "mode": 5}}, {"name": "Nazism / National Socialism", "umbrella": false, "anchor": {"race": 100, "econ": 60, "reli": 5, "regi": 98, "impe": 98, "myst": 80, "corp": 20, "mode": 30}}, {"name": "Falangism (Spain)", "umbrella": false, "anchor": {"race": 15, "econ": 30, "reli": 70, "regi": 55, "impe": 45, "myst": 65, "corp": 92, "mode": 45}}, {"name": "Austrofascism", "umbrella": false, "anchor": {"race": 10, "econ": 60, "reli": 96, "regi": 30, "impe": 10, "myst": 35, "corp": 88, "mode": 60}}, {"name": "Iron Guard / Legionarism", "umbrella": false, "anchor": {"race": 55, "econ": 40, "reli": 92, "regi": 75, "impe": 20, "myst": 99, "corp": 40, "mode": 70}}, {"name": "Francoism", "umbrella": false, "anchor": {"race": 20, "econ": 88, "reli": 90, "regi": 18, "impe": 25, "myst": 25, "corp": 70, "mode": 60}}, {"name": "Strasserism", "umbrella": false, "anchor": {"race": 80, "econ": 2, "reli": 15, "regi": 80, "impe": 40, "myst": 45, "corp": 60, "mode": 45}}, {"name": "National Syndicalism", "umbrella": false, "anchor": {"race": 20, "econ": 12, "reli": 25, "regi": 70, "impe": 35, "myst": 40, "corp": 97, "mode": 20}}, {"name": "Integralism (Brazil/Portugal)", "umbrella": false, "anchor": {"race": 5, "econ": 45, "reli": 82, "regi": 72, "impe": 20, "myst": 72, "corp": 78, "mode": 45}}, {"name": "Clerical Fascism", "umbrella": false, "anchor": {"race": 30, "econ": 74, "reli": 100, "regi": 35, "impe": 25, "myst": 78, "corp": 66, "mode": 70}}, {"name": "Showa Statism (Imperial Japan)", "umbrella": false, "anchor": {"race": 60, "econ": 66, "reli": 72, "regi": 32, "impe": 96, "myst": 45, "corp": 24, "mode": 20}}, {"name": "Ecofascism", "umbrella": false, "anchor": {"race": 86, "econ": 35, "reli": 20, "regi": 55, "impe": 18, "myst": 82, "corp": 20, "mode": 97}}, {"name": "Contemporary National-Populism", "umbrella": false, "anchor": {"race": 55, "econ": 72, "reli": 40, "regi": 12, "impe": 4, "myst": 15, "corp": 8, "mode": 35}}, {"name": "Third Position (umbrella)", "umbrella": true, "anchor": {"race": 50, "econ": 20, "reli": 45, "regi": 70, "impe": 35, "myst": 60, "corp": 70, "mode": 45}}], "questions": [{"id": "race01", "axis": "race", "core": true, "effect": {"race": 10}, "text": "Biological race is the deepest and most decisive fact determining a people's character and destiny."}, {"id": "race02", "axis": "race", "core": true, "effect": {"race": 9}, "text": "Racial purity is a value worth protecting through active state policy."}, {"id": "race03", "axis": "race", "core": true, "effect": {"race": 8}, "text": "A nation's strength ultimately rests on the biological quality of its people."}, {"id": "race04", "axis": "race", "core": false, "effect": {"race": 10}, "text": "Mixing of distinct races weakens the character and vitality of a nation."}, {"id": "race05", "axis": "race", "core": false, "effect": {"race": 8}, "text": "Some races are naturally suited to rule and others to be ruled."}, {"id": "race06", "axis": "race", "core": false, "effect": {"race": 7}, "text": "Blood and descent, not shared institutions, are what truly define who belongs to the nation."}, {"id": "race07", "axis": "race", "core": true, "effect": {"race": -10}, "text": "What defines the nation is shared culture, language, and history, not biology or bloodline."}, {"id": "race08", "axis": "race", "core": true, "effect": {"race": -9}, "text": "Anyone who fully embraces the nation's culture and struggle should be considered part of it, regardless of ancestry."}, {"id": "race09", "axis": "race", "core": true, "effect": {"race": -8}, "text": "Racial theory is a distraction from the real basis of national unity, which is cultural and political."}, {"id": "race10", "axis": "race", "core": false, "effect": {"race": -10}, "text": "The nation is a spiritual and cultural community, not a biological category."}, {"id": "race11", "axis": "race", "core": false, "effect": {"race": -8}, "text": "Racial hierarchy has no legitimate place in a properly ordered nationalist movement."}, {"id": "race12", "axis": "race", "core": false, "effect": {"race": -7}, "text": "National unity should be built on shared struggle and loyalty, not on ancestry."}, {"id": "econ01", "axis": "econ", "core": true, "effect": {"econ": -10}, "text": "Big finance and large capital are enemies of the nation as much as any external threat."}, {"id": "econ02", "axis": "econ", "core": true, "effect": {"econ": -9}, "text": "Interest-bearing capital and speculative finance should be broken and subordinated to national production."}, {"id": "econ03", "axis": "econ", "core": true, "effect": {"econ": -8}, "text": "A national revolution has to expropriate parasitic capital, not just discipline it."}, {"id": "econ04", "axis": "econ", "core": false, "effect": {"econ": -10}, "text": "Workers' material interests must be genuinely served, not just rhetorically invoked, by a nationalist movement."}, {"id": "econ05", "axis": "econ", "core": false, "effect": {"econ": -8}, "text": "Class privilege within the nation is as much an enemy as class privilege serving foreign interests."}, {"id": "econ06", "axis": "econ", "core": false, "effect": {"econ": -7}, "text": "The nation's revolution is incomplete if it leaves the existing economic elite untouched."}, {"id": "econ07", "axis": "econ", "core": true, "effect": {"econ": 10}, "text": "The nation's existing industrialists and business elite can be valuable allies against common enemies."}, {"id": "econ08", "axis": "econ", "core": true, "effect": {"econ": 9}, "text": "Private capital, properly aligned with national goals, should be preserved and used, not expropriated."}, {"id": "econ09", "axis": "econ", "core": true, "effect": {"econ": 8}, "text": "A strong national economy needs the cooperation of existing business elites, not their elimination."}, {"id": "econ10", "axis": "econ", "core": false, "effect": {"econ": 10}, "text": "Radical economic levelling threatens the social order a nationalist movement is trying to defend."}, {"id": "econ11", "axis": "econ", "core": false, "effect": {"econ": 8}, "text": "A movement that alienates capital and industry weakens itself for no strategic gain."}, {"id": "econ12", "axis": "econ", "core": false, "effect": {"econ": 7}, "text": "National strength is better built through alliance with existing economic power than through its destruction."}, {"id": "reli01", "axis": "reli", "core": true, "effect": {"reli": -10}, "text": "The nation's spiritual life should draw on pre-Christian myth and will, not on the churches."}, {"id": "reli02", "axis": "reli", "core": true, "effect": {"reli": -9}, "text": "Established religious institutions have grown too weak and universalist to serve as the nation's spiritual centre."}, {"id": "reli03", "axis": "reli", "core": true, "effect": {"reli": -8}, "text": "A national movement's true religion is the nation and the race, not any confessional church."}, {"id": "reli04", "axis": "reli", "core": false, "effect": {"reli": -10}, "text": "Clerical authority should be subordinated to the movement's own vision, not the reverse."}, {"id": "reli05", "axis": "reli", "core": false, "effect": {"reli": -8}, "text": "Christianity's emphasis on universal brotherhood conflicts with a movement built on national or racial struggle."}, {"id": "reli06", "axis": "reli", "core": false, "effect": {"reli": -7}, "text": "The state, not the church, should be the ultimate spiritual authority for the nation."}, {"id": "reli07", "axis": "reli", "core": true, "effect": {"reli": 10}, "text": "The nation's traditional church should be honoured as a pillar of the social order, not sidelined."}, {"id": "reli08", "axis": "reli", "core": true, "effect": {"reli": 9}, "text": "A movement should work with, not against, established religious authority and its institutions."}, {"id": "reli09", "axis": "reli", "core": true, "effect": {"reli": 8}, "text": "Religious faith and clerical support give a nationalist movement legitimacy it cannot generate on its own."}, {"id": "reli10", "axis": "reli", "core": false, "effect": {"reli": 10}, "text": "The clergy's moral authority should be respected and incorporated into the movement's public life."}, {"id": "reli11", "axis": "reli", "core": false, "effect": {"reli": 8}, "text": "A nationalist movement should present itself as the defender of traditional religion, not its rival."}, {"id": "reli12", "axis": "reli", "core": false, "effect": {"reli": 7}, "text": "Confessional loyalty and national loyalty should reinforce, not compete with, each other."}, {"id": "regi01", "axis": "regi", "core": true, "effect": {"regi": -10}, "text": "Existing conservative institutions and elites are useful, if limited, allies for restoring order."}, {"id": "regi02", "axis": "regi", "core": true, "effect": {"regi": -9}, "text": "An authoritarian government that preserves the social hierarchy is preferable to a mass revolutionary party."}, {"id": "regi03", "axis": "regi", "core": true, "effect": {"regi": -8}, "text": "Order and stability, delivered from above by a strong executive, matter more than mass mobilisation."}, {"id": "regi04", "axis": "regi", "core": false, "effect": {"regi": -10}, "text": "Working through existing institutions, even undemocratically, is more realistic than remaking society from below."}, {"id": "regi05", "axis": "regi", "core": false, "effect": {"regi": -8}, "text": "A traditional elite, properly empowered, can restore national order without needing a mass party apparatus."}, {"id": "regi06", "axis": "regi", "core": false, "effect": {"regi": -7}, "text": "Authoritarian rule that leaves most of society's structure intact is a workable and sufficient model."}, {"id": "regi07", "axis": "regi", "core": true, "effect": {"regi": 10}, "text": "The nation needs total mobilisation of society through a single mass party, not just an authoritarian government."}, {"id": "regi08", "axis": "regi", "core": true, "effect": {"regi": 9}, "text": "Every institution of society \u2014 youth, labour, culture \u2014 should be brought under the movement's organisation."}, {"id": "regi09", "axis": "regi", "core": true, "effect": {"regi": 8}, "text": "A revolutionary party has to permeate the whole of society, not just occupy the state."}, {"id": "regi10", "axis": "regi", "core": false, "effect": {"regi": 10}, "text": "Passive obedience to an authoritarian state is not enough; the population must be actively mobilised and organised."}, {"id": "regi11", "axis": "regi", "core": false, "effect": {"regi": 8}, "text": "The party, not the traditional state apparatus, should be the true centre of national life."}, {"id": "regi12", "axis": "regi", "core": false, "effect": {"regi": 7}, "text": "A totalising mass movement, not a conventional authoritarian government, is what national rebirth requires."}, {"id": "impe01", "axis": "impe", "core": true, "effect": {"impe": 10}, "text": "The nation's vitality is proven and renewed through expansion and the conquest of living space."}, {"id": "impe02", "axis": "impe", "core": true, "effect": {"impe": 9}, "text": "A great people is entitled to secure territory beyond its current borders by force if necessary."}, {"id": "impe03", "axis": "impe", "core": true, "effect": {"impe": 8}, "text": "National greatness naturally expresses itself in imperial ambition, not just self-defence."}, {"id": "impe04", "axis": "impe", "core": false, "effect": {"impe": 10}, "text": "Weaker neighbouring peoples and territories are legitimate objects of national expansion."}, {"id": "impe05", "axis": "impe", "core": false, "effect": {"impe": 8}, "text": "A nation that does not expand when it has the strength to do so is failing its own destiny."}, {"id": "impe06", "axis": "impe", "core": false, "effect": {"impe": 7}, "text": "War and conquest are not aberrations but expressions of a nation's vital strength."}, {"id": "impe07", "axis": "impe", "core": true, "effect": {"impe": -10}, "text": "The nation's goal should be securing and defending its existing homeland, not conquering new territory."}, {"id": "impe08", "axis": "impe", "core": true, "effect": {"impe": -9}, "text": "Expansionist ambition beyond the nation's own people and territory is a needless and costly overreach."}, {"id": "impe09", "axis": "impe", "core": true, "effect": {"impe": -8}, "text": "A defensive nationalism, focused on the homeland, is more sustainable than an expansionist one."}, {"id": "impe10", "axis": "impe", "core": false, "effect": {"impe": -10}, "text": "Foreign conquest drains the resources a movement needs to consolidate power at home."}, {"id": "impe11", "axis": "impe", "core": false, "effect": {"impe": -8}, "text": "National rebirth doesn't require empire; it requires securing what is already the nation's own."}, {"id": "impe12", "axis": "impe", "core": false, "effect": {"impe": -7}, "text": "A movement should renounce expansionist ambitions and focus entirely on domestic renewal."}, {"id": "myst01", "axis": "myst", "core": true, "effect": {"myst": 10}, "text": "The nation is reborn through myth, will, and struggle, not through rational administration alone."}, {"id": "myst02", "axis": "myst", "core": true, "effect": {"myst": 9}, "text": "A movement needs a unifying myth of national rebirth that goes beyond rational political argument."}, {"id": "myst03", "axis": "myst", "core": true, "effect": {"myst": 8}, "text": "Ritual, symbol, and collective ecstasy are legitimate and necessary tools of national mobilisation."}, {"id": "myst04", "axis": "myst", "core": false, "effect": {"myst": 10}, "text": "The leader's will and the nation's myth matter more to political success than technical policy."}, {"id": "myst05", "axis": "myst", "core": false, "effect": {"myst": 8}, "text": "A politics of pure rational calculation cannot generate the devotion a national movement needs."}, {"id": "myst06", "axis": "myst", "core": false, "effect": {"myst": 7}, "text": "Heroic struggle and sacrifice, not bureaucratic competence, define the movement's true character."}, {"id": "myst07", "axis": "myst", "core": true, "effect": {"myst": -10}, "text": "The movement's legitimacy should rest on efficient, rational administration of the state, not on myth or ritual."}, {"id": "myst08", "axis": "myst", "core": true, "effect": {"myst": -9}, "text": "Technocratic competence matters more to national strength than symbolism or collective myth."}, {"id": "myst09", "axis": "myst", "core": true, "effect": {"myst": -8}, "text": "A modern nationalist movement should present itself in the language of expertise and order, not mystical rebirth."}, {"id": "myst10", "axis": "myst", "core": false, "effect": {"myst": -10}, "text": "Practical results, not evocations of destiny or myth, are what actually build durable national strength."}, {"id": "myst11", "axis": "myst", "core": false, "effect": {"myst": -8}, "text": "Rational planning and administrative efficiency should take priority over appeals to myth and will."}, {"id": "myst12", "axis": "myst", "core": false, "effect": {"myst": -7}, "text": "A movement's success depends more on competent governance than on stirring collective symbolism."}, {"id": "corp01", "axis": "corp", "core": true, "effect": {"corp": 10}, "text": "The economy should be organised into corporate bodies representing employers and workers together under state coordination."}, {"id": "corp02", "axis": "corp", "core": true, "effect": {"corp": 9}, "text": "Sectoral councils, not direct state ministries, should manage the day-to-day running of industry."}, {"id": "corp03", "axis": "corp", "core": true, "effect": {"corp": 8}, "text": "Class conflict should be replaced by structured cooperation between capital and labour within each industry."}, {"id": "corp04", "axis": "corp", "core": false, "effect": {"corp": 10}, "text": "Corporatist bargaining bodies are a more stable economic model than either free markets or direct state control."}, {"id": "corp05", "axis": "corp", "core": false, "effect": {"corp": 8}, "text": "Organising the economy by trade and sector, rather than treating individuals as isolated units, better reflects the nation's organic structure."}, {"id": "corp06", "axis": "corp", "core": false, "effect": {"corp": 7}, "text": "A syndicalist structure of national production keeps economic decisions close to the industries themselves."}, {"id": "corp07", "axis": "corp", "core": true, "effect": {"corp": -10}, "text": "The state itself, not intermediary corporate bodies, should directly command and coordinate the economy."}, {"id": "corp08", "axis": "corp", "core": true, "effect": {"corp": -9}, "text": "Direct state control of production is more reliable than delegating economic coordination to sectoral councils."}, {"id": "corp09", "axis": "corp", "core": true, "effect": {"corp": -8}, "text": "Corporatist intermediary bodies dilute the authority the state needs to direct the nation's economy effectively."}, {"id": "corp10", "axis": "corp", "core": false, "effect": {"corp": -10}, "text": "A command economy run straight from the centre avoids the compromises corporatist bargaining requires."}, {"id": "corp11", "axis": "corp", "core": false, "effect": {"corp": -8}, "text": "Sectoral councils tend to become new vested interests that the state has to work around."}, {"id": "corp12", "axis": "corp", "core": false, "effect": {"corp": -7}, "text": "Centralised state command of production is the more disciplined and reliable economic model."}, {"id": "mode01", "axis": "mode", "core": true, "effect": {"mode": -10}, "text": "Technology, industry, and speed are expressions of the nation's vitality and should be embraced and celebrated."}, {"id": "mode02", "axis": "mode", "core": true, "effect": {"mode": -9}, "text": "A modern nationalist movement should present itself as futurist, not nostalgic for a rural past."}, {"id": "mode03", "axis": "mode", "core": true, "effect": {"mode": -8}, "text": "Industrial power and technological progress are sources of national strength worth actively pursuing."}, {"id": "mode04", "axis": "mode", "core": false, "effect": {"mode": -10}, "text": "The movement should associate itself with modernity, machines, and industrial dynamism."}, {"id": "mode05", "axis": "mode", "core": false, "effect": {"mode": -8}, "text": "A backward-looking, agrarian ideal has less to offer national renewal than embracing industrial modernity does."}, {"id": "mode06", "axis": "mode", "core": false, "effect": {"mode": -7}, "text": "Speed, machinery, and industrial production symbolise the nation's rebirth better than rural tradition does."}, {"id": "mode07", "axis": "mode", "core": true, "effect": {"mode": 10}, "text": "The nation's true character lies in its agrarian, pre-industrial roots, not in industrial modernity."}, {"id": "mode08", "axis": "mode", "core": true, "effect": {"mode": 9}, "text": "Industrial modernity has uprooted the nation from the soil and traditions that gave it strength."}, {"id": "mode09", "axis": "mode", "core": true, "effect": {"mode": 8}, "text": "A return to rural, traditional ways of life is central to genuine national renewal."}, {"id": "mode10", "axis": "mode", "core": false, "effect": {"mode": 10}, "text": "The movement should resist, not celebrate, the rootless and mechanised character of modern industrial life."}, {"id": "mode11", "axis": "mode", "core": false, "effect": {"mode": 8}, "text": "National rebirth means recovering a traditional, land-based way of life, not accelerating industrial modernity."}, {"id": "mode12", "axis": "mode", "core": false, "effect": {"mode": 7}, "text": "Urban, industrial modernity is a foreign imposition on the nation's authentic agrarian character."}]}, "9": {"meta": {"module": 2, "bucketId": 9, "bucket": "Monarchism / Reaction", "version": "0.1-draft", "questionCount": 96, "shortFormCount": 48, "scoring": {"answerScale": [{"label": "Strongly Agree", "mult": 1.0}, {"label": "Agree", "mult": 0.5}, {"label": "Neutral / Unsure", "mult": 0.0}, {"label": "Disagree", "mult": -0.5}, {"label": "Strongly Disagree", "mult": -1.0}], "formula": "raw[axis] = sum(mult * effect[axis]); max[axis] = sum(abs(effect[axis])); score[axis] = 100 * (max + raw) / (2 * max)"}, "presentation": "Stored grouped by axis for maintainability. The app must SHUFFLE at runtime with a fixed seed so consecutive items do not come from the same axis."}, "axes": [{"key": "sove", "name": "Sovereign Power", "negPole": "Ceremonial / Constrained Crown", "posPole": "Absolute Personal Sovereignty"}, {"key": "titl", "name": "Basis of Title", "negPole": "Dynastic Blood & Divine Right", "posPole": "Acclaim, Performance or Contract"}, {"key": "reli", "name": "Religion", "negPole": "Secular / Erastian", "posPole": "Confessional Throne-and-Altar"}, {"key": "orde", "name": "Social Order", "negPole": "Estate / Corporate Hierarchy", "posPole": "Legal Equality of Subjects"}, {"key": "cent", "name": "Territorial Form", "negPole": "Regional Privileges / Fueros", "posPole": "Unitary Absolutist Centralism"}, {"key": "econ", "name": "Economic Order", "negPole": "Agrarian-Corporatist", "posPole": "Commercial-Capitalist"}, {"key": "rout", "name": "Route to Restoration", "negPole": "Legal / Institutional", "posPole": "Coup, Rising or Rupture"}, {"key": "popu", "name": "Social Base", "negPole": "Elite / Aristocratic Politics", "posPole": "Mass Popular Base"}], "subIdeologies": [{"name": "Absolute Monarchism", "umbrella": false, "anchor": {"sove": 100, "titl": 12, "reli": 60, "orde": 30, "cent": 92, "econ": 40, "rout": 50, "popu": 12}}, {"name": "Constitutional Monarchism", "umbrella": false, "anchor": {"sove": 2, "titl": 60, "reli": 30, "orde": 88, "cent": 50, "econ": 75, "rout": 3, "popu": 30}}, {"name": "Legitimism (Bourbon)", "umbrella": false, "anchor": {"sove": 82, "titl": 0, "reli": 78, "orde": 8, "cent": 55, "econ": 18, "rout": 25, "popu": 8}}, {"name": "Orleanism", "umbrella": false, "anchor": {"sove": 25, "titl": 45, "reli": 40, "orde": 65, "cent": 60, "econ": 92, "rout": 20, "popu": 10}}, {"name": "Carlism (Spain)", "umbrella": false, "anchor": {"sove": 65, "titl": 8, "reli": 98, "orde": 5, "cent": 2, "econ": 5, "rout": 90, "popu": 80}}, {"name": "Jacobitism (Stuart claim)", "umbrella": false, "anchor": {"sove": 55, "titl": 3, "reli": 70, "orde": 20, "cent": 25, "econ": 25, "rout": 75, "popu": 45}}, {"name": "Bonapartism", "umbrella": false, "anchor": {"sove": 85, "titl": 88, "reli": 30, "orde": 85, "cent": 95, "econ": 60, "rout": 92, "popu": 98}}, {"name": "Tsarist Restorationism", "umbrella": false, "anchor": {"sove": 90, "titl": 10, "reli": 85, "orde": 20, "cent": 88, "econ": 30, "rout": 55, "popu": 40}}, {"name": "Throne-and-Altar Traditionalism", "umbrella": false, "anchor": {"sove": 72, "titl": 18, "reli": 100, "orde": 3, "cent": 25, "econ": 8, "rout": 30, "popu": 35}}, {"name": "Neo-Reaction / Dark Enlightenment", "umbrella": false, "anchor": {"sove": 88, "titl": 95, "reli": 15, "orde": 25, "cent": 20, "econ": 98, "rout": 40, "popu": 3}}], "questions": [{"id": "sove01", "axis": "sove", "core": true, "effect": {"sove": 10}, "text": "The monarch should hold real, personal decision-making power, not merely a ceremonial role."}, {"id": "sove02", "axis": "sove", "core": true, "effect": {"sove": 9}, "text": "Ultimate sovereignty properly rests in the person of the monarch, not in a legislature."}, {"id": "sove03", "axis": "sove", "core": true, "effect": {"sove": 8}, "text": "A crown without real governing power has lost the thing that makes monarchy worthwhile."}, {"id": "sove04", "axis": "sove", "core": false, "effect": {"sove": 10}, "text": "The monarch's personal judgment should be able to override the counsel of ministers when necessary."}, {"id": "sove05", "axis": "sove", "core": false, "effect": {"sove": 8}, "text": "Executive authority concentrated in the monarch is more decisive and coherent than authority spread across institutions."}, {"id": "sove06", "axis": "sove", "core": false, "effect": {"sove": 7}, "text": "The crown's power should not be reduced to signing what parliament has already decided."}, {"id": "sove07", "axis": "sove", "core": true, "effect": {"sove": -10}, "text": "The monarch should reign but not rule, with real governing power resting in elected or constitutional bodies."}, {"id": "sove08", "axis": "sove", "core": true, "effect": {"sove": -9}, "text": "A ceremonial monarchy, above ordinary politics, does more for national unity than one that governs directly."}, {"id": "sove09", "axis": "sove", "core": true, "effect": {"sove": -8}, "text": "Political power exercised through accountable institutions is preferable to power concentrated in one person, even a monarch."}, {"id": "sove10", "axis": "sove", "core": false, "effect": {"sove": -10}, "text": "The crown's value lies in continuity and symbolism, not in exercising personal command."}, {"id": "sove11", "axis": "sove", "core": false, "effect": {"sove": -8}, "text": "Constitutional limits on the monarch protect the institution as much as they protect the people."}, {"id": "sove12", "axis": "sove", "core": false, "effect": {"sove": -7}, "text": "A monarch confined to ceremonial duties is fulfilling, not diminishing, the office's proper role."}, {"id": "titl01", "axis": "titl", "core": true, "effect": {"titl": -10}, "text": "Legitimate rule passes by hereditary right and divine sanction, not by popular consent."}, {"id": "titl02", "axis": "titl", "core": true, "effect": {"titl": -9}, "text": "A monarch's claim to the throne rests on bloodline, not on the approval of the governed."}, {"id": "titl03", "axis": "titl", "core": true, "effect": {"titl": -8}, "text": "The legitimacy of a dynasty does not depend on whether the current generation performs well."}, {"id": "titl04", "axis": "titl", "core": false, "effect": {"titl": -10}, "text": "Succession by blood provides a stability and continuity that no elected office can match."}, {"id": "titl05", "axis": "titl", "core": false, "effect": {"titl": -8}, "text": "God-given right, not the people's will, is the true foundation of royal authority."}, {"id": "titl06", "axis": "titl", "core": false, "effect": {"titl": -7}, "text": "A rightful heir's claim stands regardless of how popular or unpopular they personally are."}, {"id": "titl07", "axis": "titl", "core": true, "effect": {"titl": 10}, "text": "A ruler's legitimacy ultimately depends on the consent and acclaim of the people they govern."}, {"id": "titl08", "axis": "titl", "core": true, "effect": {"titl": 9}, "text": "Effective, popular leadership is a more solid basis for authority than inherited bloodline."}, {"id": "titl09", "axis": "titl", "core": true, "effect": {"titl": 8}, "text": "A ruler who has lost the people's confidence has lost their legitimacy, whatever their lineage."}, {"id": "titl10", "axis": "titl", "core": false, "effect": {"titl": 10}, "text": "Authority earned through demonstrated capability outranks authority claimed through birth."}, {"id": "titl11", "axis": "titl", "core": false, "effect": {"titl": 8}, "text": "A social or constitutional contract, not divine right, is what properly grounds a ruler's power."}, {"id": "titl12", "axis": "titl", "core": false, "effect": {"titl": 7}, "text": "Even a monarch's legitimacy ultimately rests on some form of public acceptance."}, {"id": "reli01", "axis": "reli", "core": true, "effect": {"reli": 10}, "text": "The state should be formally bound to a single confessional church and its teachings."}, {"id": "reli02", "axis": "reli", "core": true, "effect": {"reli": 9}, "text": "The monarch's authority is properly understood as sanctioned and blessed by the church."}, {"id": "reli03", "axis": "reli", "core": true, "effect": {"reli": 8}, "text": "Church and throne should stand together as mutually reinforcing pillars of the social order."}, {"id": "reli04", "axis": "reli", "core": false, "effect": {"reli": 10}, "text": "Religious orthodoxy should be actively defended and enforced by the crown."}, {"id": "reli05", "axis": "reli", "core": false, "effect": {"reli": 8}, "text": "The nation's laws should reflect and be answerable to the teachings of its established church."}, {"id": "reli06", "axis": "reli", "core": false, "effect": {"reli": 7}, "text": "A monarchy without a religious foundation lacks the deeper legitimacy that sustains it."}, {"id": "reli07", "axis": "reli", "core": true, "effect": {"reli": -10}, "text": "The state's authority should rest on secular, civil grounds, independent of any church's blessing."}, {"id": "reli08", "axis": "reli", "core": true, "effect": {"reli": -9}, "text": "Religious and political authority should be kept separate, even under a monarchy."}, {"id": "reli09", "axis": "reli", "core": true, "effect": {"reli": -8}, "text": "A monarch's legitimacy shouldn't depend on the endorsement of any religious institution."}, {"id": "reli10", "axis": "reli", "core": false, "effect": {"reli": -10}, "text": "Erastian control of the church by the state is preferable to the church holding independent authority."}, {"id": "reli11", "axis": "reli", "core": false, "effect": {"reli": -8}, "text": "The crown should treat religious institutions as subordinate to civil authority, not as a co-equal pillar of order."}, {"id": "reli12", "axis": "reli", "core": false, "effect": {"reli": -7}, "text": "A modern monarchy is stronger when it isn't bound to any one confessional tradition."}, {"id": "orde01", "axis": "orde", "core": true, "effect": {"orde": -10}, "text": "Society is naturally and rightly ordered into estates and ranks, each with its own duties and privileges."}, {"id": "orde02", "axis": "orde", "core": true, "effect": {"orde": -9}, "text": "Formal social hierarchy, recognised in law, reflects a natural and legitimate order."}, {"id": "orde03", "axis": "orde", "core": true, "effect": {"orde": -8}, "text": "Different classes of society properly have different rights, obligations, and legal standing."}, {"id": "orde04", "axis": "orde", "core": false, "effect": {"orde": -10}, "text": "A hereditary nobility with its own privileges is a legitimate and stabilising feature of society."}, {"id": "orde05", "axis": "orde", "core": false, "effect": {"orde": -8}, "text": "Corporate bodies \u2014 guilds, estates, orders \u2014 properly mediate between the individual and the crown."}, {"id": "orde06", "axis": "orde", "core": false, "effect": {"orde": -7}, "text": "Formal legal distinctions between ranks of society preserve a natural and functional order."}, {"id": "orde07", "axis": "orde", "core": true, "effect": {"orde": 10}, "text": "All subjects should be equal before the law, regardless of birth or rank."}, {"id": "orde08", "axis": "orde", "core": true, "effect": {"orde": 9}, "text": "Legal privilege attached to noble birth has no place in a well-ordered modern state."}, {"id": "orde09", "axis": "orde", "core": true, "effect": {"orde": 8}, "text": "A single, uniform citizenship is a fairer basis for society than a hierarchy of legal estates."}, {"id": "orde10", "axis": "orde", "core": false, "effect": {"orde": 10}, "text": "Formal distinctions of rank in law should give way to equal legal status for all."}, {"id": "orde11", "axis": "orde", "core": false, "effect": {"orde": 8}, "text": "The abolition of legal privilege by birth was a genuine improvement, not a loss, in social order."}, {"id": "orde12", "axis": "orde", "core": false, "effect": {"orde": 7}, "text": "A modern monarchy is more legitimate when all its subjects share the same legal standing."}, {"id": "cent01", "axis": "cent", "core": true, "effect": {"cent": -10}, "text": "Historic regional rights, charters, and local privileges deserve to be respected and preserved."}, {"id": "cent02", "axis": "cent", "core": true, "effect": {"cent": -9}, "text": "A kingdom made up of distinct provinces with their own traditional laws is a legitimate model of order."}, {"id": "cent03", "axis": "cent", "core": true, "effect": {"cent": -8}, "text": "Local and regional autonomy should be protected against absorption into a single centralised administration."}, {"id": "cent04", "axis": "cent", "core": false, "effect": {"cent": -10}, "text": "Traditional local liberties are worth defending even against the crown's own centralising instincts."}, {"id": "cent05", "axis": "cent", "core": false, "effect": {"cent": -8}, "text": "A patchwork of regional laws and customs reflects the organic, historical character of the realm."}, {"id": "cent06", "axis": "cent", "core": false, "effect": {"cent": -7}, "text": "Centralising every function of government erodes the local attachments that give a kingdom its cohesion."}, {"id": "cent07", "axis": "cent", "core": true, "effect": {"cent": 10}, "text": "A single, unified legal and administrative system across the whole realm is the mark of a well-ordered state."}, {"id": "cent08", "axis": "cent", "core": true, "effect": {"cent": 9}, "text": "Regional privileges and local exceptions weaken the crown's ability to govern effectively."}, {"id": "cent09", "axis": "cent", "core": true, "effect": {"cent": 8}, "text": "The crown should override local particularism in favour of uniform, centrally administered law."}, {"id": "cent10", "axis": "cent", "core": false, "effect": {"cent": 10}, "text": "A strong, centralised monarchy is more capable of defending the realm than one fragmented by local privilege."}, {"id": "cent11", "axis": "cent", "core": false, "effect": {"cent": 8}, "text": "Absolute royal authority is best exercised through a single, unified administration, not through regional intermediaries."}, {"id": "cent12", "axis": "cent", "core": false, "effect": {"cent": 7}, "text": "Uniform centralisation, even at the cost of local tradition, serves the strength of the state."}, {"id": "econ01", "axis": "econ", "core": true, "effect": {"econ": -10}, "text": "The traditional agrarian order \u2014 land, estate, and peasant obligation \u2014 is the proper economic foundation of the realm."}, {"id": "econ02", "axis": "econ", "core": true, "effect": {"econ": -9}, "text": "Guild and corporate regulation of trade and craft is preferable to unregulated commerce."}, {"id": "econ03", "axis": "econ", "core": true, "effect": {"econ": -8}, "text": "Land tied to noble estates and inherited obligation is a more stable economic basis than commercial exchange."}, {"id": "econ04", "axis": "econ", "core": false, "effect": {"econ": -10}, "text": "Rapid commercial and industrial change threatens the social bonds a traditional economy depends on."}, {"id": "econ05", "axis": "econ", "core": false, "effect": {"econ": -8}, "text": "The economy should serve the traditional social order, not reshape it in the name of efficiency."}, {"id": "econ06", "axis": "econ", "core": false, "effect": {"econ": -7}, "text": "Restraining commercial and financial interests protects the older, more stable agrarian foundation of society."}, {"id": "econ07", "axis": "econ", "core": true, "effect": {"econ": 10}, "text": "A modern commercial and capitalist economy is compatible with, and can strengthen, monarchical rule."}, {"id": "econ08", "axis": "econ", "core": true, "effect": {"econ": 9}, "text": "The crown should encourage trade, industry, and commercial growth rather than defend an agrarian order against them."}, {"id": "econ09", "axis": "econ", "core": true, "effect": {"econ": 8}, "text": "Economic modernisation, even where it disrupts old estates and guilds, ultimately strengthens the realm."}, {"id": "econ10", "axis": "econ", "core": false, "effect": {"econ": 10}, "text": "A monarchy that embraces commerce and enterprise is more durable than one tied to an agrarian past."}, {"id": "econ11", "axis": "econ", "core": false, "effect": {"econ": 8}, "text": "Financial and mercantile interests can be valuable allies of the crown, not threats to it."}, {"id": "econ12", "axis": "econ", "core": false, "effect": {"econ": 7}, "text": "The traditional agrarian economy is not worth preserving at the cost of the realm's commercial strength."}, {"id": "rout01", "axis": "rout", "core": true, "effect": {"rout": -10}, "text": "Restoration of the monarchy should proceed through legal, constitutional, and peaceful means."}, {"id": "rout02", "axis": "rout", "core": true, "effect": {"rout": -9}, "text": "Patient legal and diplomatic effort is the proper route to restoring rightful rule."}, {"id": "rout03", "axis": "rout", "core": true, "effect": {"rout": -8}, "text": "A restoration achieved through negotiation and legitimate process carries more lasting authority than one imposed by force."}, {"id": "rout04", "axis": "rout", "core": false, "effect": {"rout": -10}, "text": "Working within existing legal and political structures is the responsible path back to monarchy."}, {"id": "rout05", "axis": "rout", "core": false, "effect": {"rout": -8}, "text": "A monarchist movement should renounce violence and pursue restoration by lawful means."}, {"id": "rout06", "axis": "rout", "core": false, "effect": {"rout": -7}, "text": "Gradual, institutional change is more likely to produce a durable restoration than any sudden seizure of power."}, {"id": "rout07", "axis": "rout", "core": true, "effect": {"rout": 10}, "text": "Restoration may legitimately require an uprising, coup, or armed struggle if legal channels are closed."}, {"id": "rout08", "axis": "rout", "core": true, "effect": {"rout": 9}, "text": "Waiting on legal process when the crown has been unjustly displaced can mean waiting forever."}, {"id": "rout09", "axis": "rout", "core": true, "effect": {"rout": 8}, "text": "A rightful monarch's cause justifies the use of force to reclaim the throne when necessary."}, {"id": "rout10", "axis": "rout", "core": false, "effect": {"rout": 10}, "text": "History shows that restorations have usually come through decisive action, not patient legalism."}, {"id": "rout11", "axis": "rout", "core": false, "effect": {"rout": 8}, "text": "A monarchist movement that rules out force in principle has no real path back to power."}, {"id": "rout12", "axis": "rout", "core": false, "effect": {"rout": 7}, "text": "Direct action to restore the crown is legitimate when the existing order has no lawful path to change."}, {"id": "popu01", "axis": "popu", "core": true, "effect": {"popu": -10}, "text": "Monarchist politics is properly the business of the aristocracy, the court, and established elites."}, {"id": "popu02", "axis": "popu", "core": true, "effect": {"popu": -9}, "text": "Restoration should be pursued through influence over elites and institutions, not popular mobilisation."}, {"id": "popu03", "axis": "popu", "core": true, "effect": {"popu": -8}, "text": "A monarchist movement should be cautious about appeals to the masses, which can spiral beyond its control."}, {"id": "popu04", "axis": "popu", "core": false, "effect": {"popu": -10}, "text": "The legitimacy of monarchy rests on tradition and elite continuity, not on popular enthusiasm."}, {"id": "popu05", "axis": "popu", "core": false, "effect": {"popu": -8}, "text": "Popular political mobilisation is a poor fit for a cause grounded in inherited, not democratic, legitimacy."}, {"id": "popu06", "axis": "popu", "core": false, "effect": {"popu": -7}, "text": "Court and aristocratic politics, not mass rallies, are the proper terrain for a monarchist movement."}, {"id": "popu07", "axis": "popu", "core": true, "effect": {"popu": 10}, "text": "A monarchist cause needs to build genuine popular support to have any chance of succeeding today."}, {"id": "popu08", "axis": "popu", "core": true, "effect": {"popu": 9}, "text": "Mass mobilisation and popular appeal are necessary tools for restoring a monarchy in the modern era."}, {"id": "popu09", "axis": "popu", "core": true, "effect": {"popu": 8}, "text": "A restored monarchy needs the demonstrated backing of ordinary people, not just elite favour, to be secure."}, {"id": "popu10", "axis": "popu", "core": false, "effect": {"popu": 10}, "text": "Popular plebiscite or acclaim can be a legitimate part of restoring a monarch to power."}, {"id": "popu11", "axis": "popu", "core": false, "effect": {"popu": 8}, "text": "A monarchist movement should actively organise and appeal to popular sentiment, not rely on elite networks alone."}, {"id": "popu12", "axis": "popu", "core": false, "effect": {"popu": 7}, "text": "Winning over the crowd is as important to a modern restoration as winning over the aristocracy."}]}, "10": {"meta": {"module": 2, "bucketId": 10, "bucket": "Theocracy / Religious Fundamentalism", "version": "0.1-draft", "questionCount": 96, "shortFormCount": 48, "scoring": {"answerScale": [{"label": "Strongly Agree", "mult": 1.0}, {"label": "Agree", "mult": 0.5}, {"label": "Neutral / Unsure", "mult": 0.0}, {"label": "Disagree", "mult": -0.5}, {"label": "Strongly Disagree", "mult": -1.0}], "formula": "raw[axis] = sum(mult * effect[axis]); max[axis] = sum(abs(effect[axis])); score[axis] = 100 * (max + raw) / (2 * max)"}, "presentation": "Stored grouped by axis for maintainability. The app must SHUFFLE at runtime with a fixed seed so consecutive items do not come from the same axis."}, "axes": [{"key": "rout", "name": "Route to Power", "negPole": "Electoral / Gradualist / Preaching", "posPole": "Armed Vanguard Struggle"}, {"key": "cler", "name": "Locus of Authority", "negPole": "Lay Political Leadership", "posPole": "Formal Clerical Rule"}, {"key": "lite", "name": "Relation to Text", "negPole": "Interpretive Tradition & Jurisprudence", "posPole": "Direct Return to Scripture"}, {"key": "natl", "name": "Political Community", "negPole": "Universal Religious Community", "posPole": "Ethno-National Religious State"}, {"key": "econ", "name": "Economic Doctrine", "negPole": "Redistributive Religious Economics", "posPole": "Market & Merchant-Friendly"}, {"key": "form", "name": "The Modern State", "negPole": "Reject It / Pre-Modern Order", "posPole": "Capture and Use It"}, {"key": "takf", "name": "Boundary of the Faithful", "negPole": "Broad / Ecumenical Inclusion", "posPole": "Excommunicative Purism"}, {"key": "impe", "name": "Geopolitical Posture", "negPole": "Accommodating to Western Power", "posPole": "Militant Anti-Western"}], "subIdeologies": [{"name": "Salafism / Wahhabism", "umbrella": false, "anchor": {"rout": 35, "cler": 60, "lite": 98, "natl": 15, "econ": 80, "form": 25, "takf": 86, "impe": 25}}, {"name": "Khomeinism (Vilayat-e Faqih)", "umbrella": false, "anchor": {"rout": 70, "cler": 100, "lite": 30, "natl": 40, "econ": 20, "form": 88, "takf": 45, "impe": 97}}, {"name": "Muslim Brotherhood Islamism", "umbrella": false, "anchor": {"rout": 12, "cler": 42, "lite": 55, "natl": 30, "econ": 55, "form": 78, "takf": 24, "impe": 66}}, {"name": "Salafi-Jihadism", "umbrella": false, "anchor": {"rout": 100, "cler": 50, "lite": 95, "natl": 0, "econ": 45, "form": 4, "takf": 100, "impe": 100}}, {"name": "Christian Dominionism", "umbrella": false, "anchor": {"rout": 20, "cler": 30, "lite": 65, "natl": 60, "econ": 82, "form": 62, "takf": 45, "impe": 10}}, {"name": "Christian Reconstructionism", "umbrella": false, "anchor": {"rout": 12, "cler": 55, "lite": 92, "natl": 55, "econ": 97, "form": 34, "takf": 72, "impe": 20}}, {"name": "Religious Zionism / Kahanism", "umbrella": false, "anchor": {"rout": 58, "cler": 40, "lite": 60, "natl": 92, "econ": 66, "form": 72, "takf": 66, "impe": 12}}, {"name": "Hindutva", "umbrella": false, "anchor": {"rout": 38, "cler": 18, "lite": 35, "natl": 97, "econ": 78, "form": 97, "takf": 40, "impe": 20}}, {"name": "Buddhist Nationalism", "umbrella": false, "anchor": {"rout": 42, "cler": 46, "lite": 28, "natl": 94, "econ": 52, "form": 86, "takf": 46, "impe": 32}}, {"name": "Catholic Integralism", "umbrella": false, "anchor": {"rout": 6, "cler": 88, "lite": 4, "natl": 18, "econ": 42, "form": 28, "takf": 40, "impe": 36}}, {"name": "Deobandi political current", "umbrella": false, "anchor": {"rout": 40, "cler": 72, "lite": 58, "natl": 44, "econ": 48, "form": 44, "takf": 68, "impe": 62}}, {"name": "Barelvi political current", "umbrella": false, "anchor": {"rout": 28, "cler": 82, "lite": 8, "natl": 58, "econ": 44, "form": 56, "takf": 26, "impe": 40}}, {"name": "Islamism (general, umbrella)", "umbrella": true, "anchor": {"rout": 30, "cler": 55, "lite": 55, "natl": 25, "econ": 45, "form": 66, "takf": 45, "impe": 70}}], "questions": [{"id": "rout01", "axis": "rout", "core": true, "effect": {"rout": 10}, "text": "Armed struggle is a legitimate and necessary means of establishing religious rule."}, {"id": "rout02", "axis": "rout", "core": true, "effect": {"rout": 9}, "text": "Political change through preaching and elections alone is too slow to correct a society that has strayed this far."}, {"id": "rout03", "axis": "rout", "core": true, "effect": {"rout": 8}, "text": "A vanguard willing to use force is sometimes required to bring about a truly religious order."}, {"id": "rout04", "axis": "rout", "core": false, "effect": {"rout": 10}, "text": "Waiting on gradual persuasion cedes the field to those actively working against religious values."}, {"id": "rout05", "axis": "rout", "core": false, "effect": {"rout": 8}, "text": "Jihad or holy struggle, in its militant sense, remains a legitimate instrument of religious politics today."}, {"id": "rout06", "axis": "rout", "core": false, "effect": {"rout": 7}, "text": "Revolutionary upheaval, not incremental reform, is what real religious renewal requires."}, {"id": "rout07", "axis": "rout", "core": true, "effect": {"rout": -10}, "text": "Religious renewal should be pursued through preaching, education, and participation in existing political processes."}, {"id": "rout08", "axis": "rout", "core": true, "effect": {"rout": -9}, "text": "Elections and gradual religious education are a legitimate and sufficient path to a more religious society."}, {"id": "rout09", "axis": "rout", "core": true, "effect": {"rout": -8}, "text": "Armed struggle against the existing order tends to discredit religious politics rather than advance it."}, {"id": "rout10", "axis": "rout", "core": false, "effect": {"rout": -10}, "text": "Patient civic and missionary work builds more lasting change than confrontation does."}, {"id": "rout11", "axis": "rout", "core": false, "effect": {"rout": -8}, "text": "Working within the existing political system is compatible with a serious commitment to religious values."}, {"id": "rout12", "axis": "rout", "core": false, "effect": {"rout": -7}, "text": "A movement that renounces violence can still achieve real religious influence over society."}, {"id": "cler01", "axis": "cler", "core": true, "effect": {"cler": 10}, "text": "Trained religious scholars should hold formal authority to govern or to veto un-Islamic or ungodly legislation."}, {"id": "cler02", "axis": "cler", "core": true, "effect": {"cler": 9}, "text": "The guardianship of the jurist, or an equivalent clerical office, is a legitimate model of government."}, {"id": "cler03", "axis": "cler", "core": true, "effect": {"cler": 8}, "text": "Ordinary political leaders should be answerable to religious scholars on matters of law and policy."}, {"id": "cler04", "axis": "cler", "core": false, "effect": {"cler": 10}, "text": "A council of clergy should have the final word when law conflicts with religious teaching."}, {"id": "cler05", "axis": "cler", "core": false, "effect": {"cler": 8}, "text": "Formal clerical office is a more reliable guardian of religious law than lay politicians."}, {"id": "cler06", "axis": "cler", "core": false, "effect": {"cler": 7}, "text": "The scholars of the faith, not elected politicians, should have ultimate authority over what counts as legitimate law."}, {"id": "cler07", "axis": "cler", "core": true, "effect": {"cler": -10}, "text": "Governance should remain in the hands of lay political leaders, with clergy limited to moral and religious guidance."}, {"id": "cler08", "axis": "cler", "core": true, "effect": {"cler": -9}, "text": "Formal clerical rule over the state risks corrupting the clergy as much as it risks corrupting the state."}, {"id": "cler09", "axis": "cler", "core": true, "effect": {"cler": -8}, "text": "A lay government that consults religious scholars, without being bound by them, is the better model."}, {"id": "cler10", "axis": "cler", "core": false, "effect": {"cler": -10}, "text": "Political authority and religious authority should be held by different people, even in a religious state."}, {"id": "cler11", "axis": "cler", "core": false, "effect": {"cler": -8}, "text": "Clergy who govern directly tend to lose the moral authority that comes from staying above politics."}, {"id": "cler12", "axis": "cler", "core": false, "effect": {"cler": -7}, "text": "The state should implement religious law through its own institutions, not cede governing power to the clergy."}, {"id": "lite01", "axis": "lite", "core": true, "effect": {"lite": -10}, "text": "Centuries of legal scholarship and interpretive tradition remain the proper guide to applying scripture today."}, {"id": "lite02", "axis": "lite", "core": true, "effect": {"lite": -9}, "text": "Sound religious law depends on trained jurisprudence, not on reading scripture without that tradition."}, {"id": "lite03", "axis": "lite", "core": true, "effect": {"lite": -8}, "text": "Interpretive schools built up over generations should not be casually discarded in favour of individual readings."}, {"id": "lite04", "axis": "lite", "core": false, "effect": {"lite": -10}, "text": "A jurist's ruling, grounded in the accumulated tradition, carries real authority in applying the text."}, {"id": "lite05", "axis": "lite", "core": false, "effect": {"lite": -8}, "text": "Scripture has to be read through the accumulated wisdom of scholars across generations, not in isolation."}, {"id": "lite06", "axis": "lite", "core": false, "effect": {"lite": -7}, "text": "Bypassing centuries of legal tradition in favour of a direct reading of scripture invites serious error."}, {"id": "lite07", "axis": "lite", "core": true, "effect": {"lite": 10}, "text": "Believers should return directly to the original scripture, setting aside centuries of accumulated interpretation."}, {"id": "lite08", "axis": "lite", "core": true, "effect": {"lite": 9}, "text": "Much of the later interpretive tradition represents a departure from, not a clarification of, the original texts."}, {"id": "lite09", "axis": "lite", "core": true, "effect": {"lite": 8}, "text": "The earliest generation's practice, not later scholarly elaboration, is the authoritative guide."}, {"id": "lite10", "axis": "lite", "core": false, "effect": {"lite": 10}, "text": "Later schools of interpretation added innovations that a return to the source text should strip away."}, {"id": "lite11", "axis": "lite", "core": false, "effect": {"lite": 8}, "text": "A direct, literal reading of scripture is more reliable than layers of scholarly commentary."}, {"id": "lite12", "axis": "lite", "core": false, "effect": {"lite": 7}, "text": "Purifying religious practice means stripping away accumulated interpretation and returning to the original sources."}, {"id": "natl01", "axis": "natl", "core": true, "effect": {"natl": -10}, "text": "The community of the faithful transcends nationality and is the proper political community."}, {"id": "natl02", "axis": "natl", "core": true, "effect": {"natl": -9}, "text": "Believers everywhere belong to a single community that should take priority over national citizenship."}, {"id": "natl03", "axis": "natl", "core": true, "effect": {"natl": -8}, "text": "National borders are a secondary, even artificial, division within the true community of the faith."}, {"id": "natl04", "axis": "natl", "core": false, "effect": {"natl": -10}, "text": "A religious polity should aim to unite believers across national lines, not confine itself to one nation."}, {"id": "natl05", "axis": "natl", "core": false, "effect": {"natl": -8}, "text": "Loyalty to the faith community should outweigh loyalty to any particular nation-state."}, {"id": "natl06", "axis": "natl", "core": false, "effect": {"natl": -7}, "text": "The ultimate political horizon is the community of believers, not any single national state."}, {"id": "natl07", "axis": "natl", "core": true, "effect": {"natl": 10}, "text": "The religious state should be organised around and for a particular nation and its people."}, {"id": "natl08", "axis": "natl", "core": true, "effect": {"natl": 9}, "text": "Religious and national identity are properly fused, not separated into rival loyalties."}, {"id": "natl09", "axis": "natl", "core": true, "effect": {"natl": 8}, "text": "A religious state has legitimate obligations to its own nation that come before universal religious solidarity."}, {"id": "natl10", "axis": "natl", "core": false, "effect": {"natl": 10}, "text": "The nation, not the wider community of believers, is the primary vessel of religious political life today."}, {"id": "natl11", "axis": "natl", "core": false, "effect": {"natl": 8}, "text": "Religious politics should serve the particular people and homeland it arises from, not a universal community."}, {"id": "natl12", "axis": "natl", "core": false, "effect": {"natl": 7}, "text": "A specific national mission is central to this movement's religious project, not incidental to it."}, {"id": "econ01", "axis": "econ", "core": true, "effect": {"econ": -10}, "text": "The wealthy have a binding religious obligation to redistribute a real share of their wealth to the poor."}, {"id": "econ02", "axis": "econ", "core": true, "effect": {"econ": -9}, "text": "Charging interest and similar exploitative financial practices should be prohibited by religious law."}, {"id": "econ03", "axis": "econ", "core": true, "effect": {"econ": -8}, "text": "Economic policy should actively narrow the gap between rich and poor as a matter of religious duty."}, {"id": "econ04", "axis": "econ", "core": false, "effect": {"econ": -10}, "text": "A religious economy should place limits on private accumulation in the name of communal welfare."}, {"id": "econ05", "axis": "econ", "core": false, "effect": {"econ": -8}, "text": "Religious welfare obligations should be enforced through the state, not left to voluntary charity alone."}, {"id": "econ06", "axis": "econ", "core": false, "effect": {"econ": -7}, "text": "Concentrated private wealth is a religious as well as a social problem that policy should address."}, {"id": "econ07", "axis": "econ", "core": true, "effect": {"econ": 10}, "text": "A religious state should welcome commerce and free exchange rather than impose heavy redistributive obligations."}, {"id": "econ08", "axis": "econ", "core": true, "effect": {"econ": 9}, "text": "Private property and market exchange are fully compatible with, and even blessed by, religious teaching."}, {"id": "econ09", "axis": "econ", "core": true, "effect": {"econ": 8}, "text": "Merchants and entrepreneurs deserve religious and social respect, not suspicion, for their success."}, {"id": "econ10", "axis": "econ", "core": false, "effect": {"econ": 10}, "text": "Religious law protects private property and trade at least as much as it demands redistribution."}, {"id": "econ11", "axis": "econ", "core": false, "effect": {"econ": 8}, "text": "A prosperous merchant class strengthens a religious society rather than threatening it."}, {"id": "econ12", "axis": "econ", "core": false, "effect": {"econ": 7}, "text": "Voluntary charity, not state-enforced redistribution, is the proper religious response to poverty."}, {"id": "form01", "axis": "form", "core": true, "effect": {"form": 10}, "text": "The modern nation-state, its constitutions, and its bureaucracy should be actively captured and used to enact religious law."}, {"id": "form02", "axis": "form", "core": true, "effect": {"form": 9}, "text": "A movement can and should work through existing state institutions to establish religious governance."}, {"id": "form03", "axis": "form", "core": true, "effect": {"form": 8}, "text": "Modern administrative capacity, once captured, is a legitimate and useful tool for religious governance."}, {"id": "form04", "axis": "form", "core": false, "effect": {"form": 10}, "text": "There's nothing wrong in principle with running for office and legislating within a modern constitutional state."}, {"id": "form05", "axis": "form", "core": false, "effect": {"form": 8}, "text": "Using the machinery of a modern state is compatible with, and even necessary for, implementing religious law at scale."}, {"id": "form06", "axis": "form", "core": false, "effect": {"form": 7}, "text": "A religious movement should be pragmatic about using whatever modern institutions are available to it."}, {"id": "form07", "axis": "form", "core": true, "effect": {"form": -10}, "text": "The modern nation-state and its man-made constitutions are themselves illegitimate and should be rejected, not captured."}, {"id": "form08", "axis": "form", "core": true, "effect": {"form": -9}, "text": "Sovereignty belongs to God alone, which makes man-made constitutions a rival and false claim to authority."}, {"id": "form09", "axis": "form", "core": true, "effect": {"form": -8}, "text": "A truly religious order requires dismantling the modern state, not winning elections within it."}, {"id": "form10", "axis": "form", "core": false, "effect": {"form": -10}, "text": "Legitimate religious governance can't be built by working through institutions premised on human, not divine, sovereignty."}, {"id": "form11", "axis": "form", "core": false, "effect": {"form": -8}, "text": "Modern constitutionalism is itself part of the problem a religious movement exists to overturn."}, {"id": "form12", "axis": "form", "core": false, "effect": {"form": -7}, "text": "Participating in the modern state's institutions concedes their legitimacy in a way true believers shouldn't accept."}, {"id": "takf01", "axis": "takf", "core": true, "effect": {"takf": -10}, "text": "The community of the truly faithful should be broad, including those who differ on secondary matters of practice or doctrine."}, {"id": "takf02", "axis": "takf", "core": true, "effect": {"takf": -9}, "text": "Fellow believers should not be readily declared apostates over disagreements in interpretation."}, {"id": "takf03", "axis": "takf", "core": true, "effect": {"takf": -8}, "text": "Unity among believers of different schools and traditions matters more than doctrinal precision on every point."}, {"id": "takf04", "axis": "takf", "core": false, "effect": {"takf": -10}, "text": "Excommunicating other believers over doctrinal disputes weakens the community more than it purifies it."}, {"id": "takf05", "axis": "takf", "core": false, "effect": {"takf": -8}, "text": "A wide, tolerant view of who counts as a genuine believer serves the community better than a narrow one."}, {"id": "takf06", "axis": "takf", "core": false, "effect": {"takf": -7}, "text": "Doctrinal disagreement among believers should be a matter for debate, not grounds for exclusion."}, {"id": "takf07", "axis": "takf", "core": true, "effect": {"takf": 10}, "text": "Believers who deviate seriously from correct doctrine or practice should be considered outside the true faith."}, {"id": "takf08", "axis": "takf", "core": true, "effect": {"takf": 9}, "text": "Maintaining doctrinal purity sometimes requires declaring even nominal believers apostate."}, {"id": "takf09", "axis": "takf", "core": true, "effect": {"takf": 8}, "text": "A community that tolerates significant doctrinal deviation has compromised the faith itself."}, {"id": "takf10", "axis": "takf", "core": false, "effect": {"takf": 10}, "text": "Firm boundaries around correct belief and practice are necessary, even when they exclude many who call themselves believers."}, {"id": "takf11", "axis": "takf", "core": false, "effect": {"takf": 8}, "text": "Doctrinal laxity is a greater danger to the faith than the divisiveness of strict boundaries."}, {"id": "takf12", "axis": "takf", "core": false, "effect": {"takf": 7}, "text": "True religious renewal requires clearly separating the genuinely faithful from those who only appear to be."}, {"id": "impe01", "axis": "impe", "core": true, "effect": {"impe": 10}, "text": "Western political and cultural influence is a corrupting force that religious politics should actively resist."}, {"id": "impe02", "axis": "impe", "core": true, "effect": {"impe": 9}, "text": "Accommodation with Western powers tends to compromise a movement's religious integrity."}, {"id": "impe03", "axis": "impe", "core": true, "effect": {"impe": 8}, "text": "The West's global dominance is itself a target that religious politics is right to confront."}, {"id": "impe04", "axis": "impe", "core": false, "effect": {"impe": 10}, "text": "Cooperation with Western governments should be treated with deep suspicion, if not rejected outright."}, {"id": "impe05", "axis": "impe", "core": false, "effect": {"impe": 8}, "text": "Resisting Western cultural and political influence is as central to this movement as its domestic religious goals."}, {"id": "impe06", "axis": "impe", "core": false, "effect": {"impe": 7}, "text": "A movement that grows too close to Western powers has already begun to lose its religious purpose."}, {"id": "impe07", "axis": "impe", "core": true, "effect": {"impe": -10}, "text": "Practical cooperation and diplomacy with Western powers can serve a religious movement's interests without betraying them."}, {"id": "impe08", "axis": "impe", "core": true, "effect": {"impe": -9}, "text": "Religious politics doesn't require treating the West as a fundamental enemy."}, {"id": "impe09", "axis": "impe", "core": true, "effect": {"impe": -8}, "text": "A pragmatic relationship with Western governments is compatible with maintaining religious conviction."}, {"id": "impe10", "axis": "impe", "core": false, "effect": {"impe": -10}, "text": "Isolating a movement from all relations with Western powers weakens it more than it protects it."}, {"id": "impe11", "axis": "impe", "core": false, "effect": {"impe": -8}, "text": "Confrontation with the West should not be an end in itself for a religious movement."}, {"id": "impe12", "axis": "impe", "core": false, "effect": {"impe": -7}, "text": "A religious movement can pursue its domestic goals without making opposition to the West central to its identity."}]}, "11": {"meta": {"module": 2, "bucketId": 11, "bucket": "Anarcho-Capitalism / Right-Libertarianism", "version": "0.1-draft", "questionCount": 96, "shortFormCount": 48, "scoring": {"answerScale": [{"label": "Strongly Agree", "mult": 1.0}, {"label": "Agree", "mult": 0.5}, {"label": "Neutral / Unsure", "mult": 0.0}, {"label": "Disagree", "mult": -0.5}, {"label": "St
